<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sight Singing</title>
    <link rel="icon" href="../icons/bg-icon.png">
    <link rel="stylesheet" href="../common-styles.css">
    <link rel="preload" href="../fonts/Zapfino.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    
    <script src="../apstudents.js"></script>
    <script src="../login-screen.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .container {
            margin: 30px auto;
            max-width: 800px;
            width: 90%;
            text-align: center;
        }

        .reminders {
            width: 400px;
            border-radius: 10px;
            margin: 30px auto;
            border: solid #6ec5d9a5;
            background-color: rgba(49, 129, 125, 0.543);
            padding: 18px 25px 20px;
            text-align: left;      
        }

        .reminders h2 {
            font-size: 1.2rem;
            text-align: center; 
        }

        .reminders h3 {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.45;
        }

        .time-restriction {
            font-size: 1.15rem;
            margin: 15px 0 20px 0;
            text-align: center;
        }

        .image-container {
            position: relative;
            width: 90%;
            max-width: 720px;
            margin: 15px auto 10px;
        }

        #exerciseImage {
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            filter: blur(10px);
            transition: filter 0.6s ease;
        }

        #exerciseImage.revealed { 
            filter: blur(0); 
        }

        .recording-notice {
            color: #ff9800;
            font-size: 15px;
            margin-top: -8px;
            margin-bottom: 22px;
            display: none;
        }

        #recordButton {
            width: 60px;
            height: 60px;
            margin: 8px auto 25px;
            border-radius: 50%;
            background-color: #888888;
            cursor: not-allowed;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #recordButton:not(:disabled) {
            background-color: #f44336;
            cursor: pointer;
        }

        #recordIcon {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
        }

        #recordIcon.recording {
            width: 14px;
            height: 14px;
            border-radius: 0;
        }

        #visualizer {
            width: 100%;
            height: 180px;
            background-color: #3c3c3c;
            margin: 10px auto;
            display: none;
        }

        #audioPlayback { 
            display: none; 
            margin: 5px auto 20px;
            width: 100%;
        }

        #downloadButton {
            display: none;
            background-color: #4c8baf;
            color: white;
            margin-bottom: 30px;
        }
    </style>
    <base target="_blank">
</head>
<body>

    <div id="main-content" style="display: none;">

        <div class="background"></div>
        <div class="overlay"></div>
        <div class="overlay2"></div>

        <h1 class="Title">BIPH Music</h1>
        <h1 class="Subtitle">Daily Sight Singing</h1>

        <div class="container">
            <div id="timeRestriction" class="time-restriction"></div>

            <div class="image-container">
                <img id="exerciseImage" alt="Sight Singing Exercise" draggable="false">
            </div>

            <div id="recordingNotice" class="recording-notice">
                You may start recording at any time, but only may record once.
            </div>

            <button id="recordButton" class="action-btn" disabled>
                <div id="recordIcon"></div>
            </button>

            <canvas id="visualizer"></canvas>
            <audio id="audioPlayback" controls></audio>
            <button id="downloadButton" class="action-btn">Download Recording</button>
        </div>

        <div class="reminders">
            <h2>Some Reminders:</h2>
            <h3>
                <p>• Observe the key signature, first and last notes</p>
                <p>• Look for accidentals</p>
                <p>• Sing the scale before you start</p>
                <p>• Aim for accurate rhythms and consistency of tempo</p>
            </h3>
        </div>

        <div id="shared-menu"></div>
    </div>

    <script src="../menu.js"></script>
    <script src="../mymenu.js"></script>

    <script>
        // (Script remains unchanged from previous version)
        window.onSuccessfulLogin = function(displayName) {
            document.getElementById('main-content').style.display = 'block';
            localStorage.setItem('biph_student_name', displayName);
            localStorage.setItem('biph_name_timestamp', Date.now().toString());
            initPage();
        };

        function initPage() {
            const startDate = new Date('2024-11-04');
            const today = new Date();
            let differenceInDays = Math.floor((today.getTime() - startDate.getTime()) / (1000 * 3600 * 24));

            const completeWeeks = Math.floor(differenceInDays / 7);
            differenceInDays -= (completeWeeks * 2);

            const currentDay = today.getDay();
            if (currentDay === 0) differenceInDays -= 2;
            if (currentDay === 6) differenceInDays -= 1;

            const currentExample = (differenceInDays % 30) + 1;
            document.getElementById('exerciseImage').src = `examples/${currentExample}.jpg`;

            checkTimeAndUnlock();
            setInterval(() => {
                updateCountdown();
                checkTimeAndUnlock();
            }, 1000);
            
            updateCountdown();
        }

        function checkTimeAndUnlock() {
            if (checkTime()) {
                document.getElementById('exerciseImage').classList.add('revealed');
                document.getElementById('recordButton').disabled = false;
            }
        }

        function checkTime() {
            const now = new Date();
            const hour = now.getHours();
            const minutes = now.getMinutes();
            return (hour === 10 && minutes >= 45 && minutes < 48);
        }

        let mediaRecorder, audioChunks = [], isRecording = false, analyser, animationId;

        document.getElementById('recordButton').addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const audioContext = new AudioContext();
                    const source = audioContext.createMediaStreamSource(stream);
                    analyser = audioContext.createAnalyser();
                    source.connect(analyser);

                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    document.getElementById('visualizer').style.display = 'block';
                    drawVisualization();

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        document.getElementById('audioPlayback').src = audioUrl;
                        document.getElementById('audioPlayback').style.display = 'block';
                        document.getElementById('downloadButton').style.display = 'block';
                        document.getElementById('visualizer').style.display = 'none';
                        cancelAnimationFrame(animationId);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('recordIcon').classList.add('recording');
                    document.getElementById('recordingNotice').style.display = 'block';
                } catch (err) {
                    console.error('Microphone error:', err);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('recordIcon').classList.remove('recording');
                document.getElementById('recordingNotice').style.display = 'none';
            }
        });

        document.getElementById('downloadButton').addEventListener('click', () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            const formattedDate = new Date().toISOString().split('T')[0];
            const name = localStorage.getItem('biph_student_name') || "Student";

            a.href = url;
            a.download = `${formattedDate} Sight Singing - ${name}.wav`;
            a.click();
        });

        function drawVisualization() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            const width = canvas.width = 800;
            const height = canvas.height = 180;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                analyser.getByteFrequencyData(dataArray);
                ctx.fillStyle = '#3c3c3c';
                ctx.fillRect(0, 0, width, height);

                const barWidth = width / bufferLength * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = dataArray[i] / 2;
                    ctx.fillStyle = `rgb(${barHeight + 100}, 50, 50)`;
                    ctx.fillRect(x, height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
                animationId = requestAnimationFrame(draw);
            }
            draw();
        }

        function updateCountdown() {
            const now = new Date();
            const targetTime = new Date(now); targetTime.setHours(10, 45, 0);
            const endTime = new Date(now); endTime.setHours(10, 48, 0);
            const peerReviewEnd = new Date(now); peerReviewEnd.setHours(10, 50, 0);
            const nextDay = new Date(now); nextDay.setDate(nextDay.getDate() + 1); nextDay.setHours(10, 45, 0);

            const timeRestriction = document.getElementById('timeRestriction');
            const exerciseImage = document.getElementById('exerciseImage');

            if (now >= targetTime && now < endTime) {
                const timeLeft = endTime - now;
                const minutes = Math.floor(timeLeft / 60000);
                const seconds = Math.floor((timeLeft % 60000) / 1000);
                timeRestriction.textContent = `${minutes}:${seconds.toString().padStart(2, '0')} remaining`;
                exerciseImage.classList.add('revealed');
            } else if (now < targetTime) {
                const timeLeft = targetTime - now;
                const hours = Math.floor(timeLeft / 3600000);
                const minutes = Math.floor((timeLeft % 3600000) / 60000);
                const seconds = Math.floor((timeLeft % 60000) / 1000);
                timeRestriction.textContent = `Today's sight singing example will go live in ${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                exerciseImage.classList.remove('revealed');
            } else if (now < peerReviewEnd) {
                timeRestriction.textContent = "Bring your recording in for peer review!";
                exerciseImage.classList.remove('revealed');
            } else {
                const timeLeft = nextDay - now;
                const hours = Math.floor(timeLeft / 3600000);
                const minutes = Math.floor((timeLeft % 3600000) / 60000);
                const seconds = Math.floor((timeLeft % 60000) / 1000);
                timeRestriction.textContent = `Tomorrow's sight singing example will go live in ${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                exerciseImage.classList.remove('revealed');
            }
        }

        window.onload = () => initLogin();
    </script>
</body>
</html>
