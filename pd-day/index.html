function exportScores() {
    let studentsToExport = students;
    const currentClass = classes[currentClassIndex];
    // Export the current class in its original roster order.
    studentsToExport = currentClass.students.slice().map(orig => {
        const live = students.find(s => s.name === orig.name);
        return live ? { ...live } : { ...orig };
    });

    // Don't export if every student is still marked Absent/EX.
    // UNX, EX, and >15m are valid Tech Theater statuses.
    const allAbsent = studentsToExport.every(
        student =>
            student.attendance === 'Absent' &&
            student.score === 'EX'
    );

    if (allAbsent) {
        showTemporaryMessage(
            'No changes detected—all students absent/EX. CSV not exported.'
        );
        return;
    }

    const regularStudents = studentsToExport.filter(s => !s.isAdditional);
    const additionalStudents = studentsToExport.filter(s => s.isAdditional);

    const headers = [
        'Name',
        ...regularStudents.map(student => `"${student.name}"`)
    ];

    const classworkRow = [
        'Classwork',
        ...regularStudents.map(student => {
            let value;

            if (istechTheater && student.attendance === '>15m') {
                value = '>15m';
            } else if (
                student.score === 'EX' ||
                student.score === 'UNX'
            ) {
                value = student.score;
            } else {
                value = `${student.score}%`;
            }

            return `"${value}"`;
        })
    ];

    const now = new Date();

    const dateStr = now.toLocaleDateString('en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
    });

    const csvFileDateStr = now.toLocaleDateString('en-US', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
    }).replace(/\//g, '-');

    const housePointsItemized = studentsToExport
        .filter(student => student.housePoints !== 0)
        .map(student => {
            const masterStudent = getMasterStudent(student.name);
            const liveschoolName = masterStudent
                ? masterStudent.liveschoolName
                : student.name;

            return {
                name: liveschoolName,
                points: student.housePoints
            };
        })
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(item =>
            `"${item.name}",${item.points > 0 ? '+' : ''}${item.points}`
        );

    // Both Tardy and >15m students appear in the Tardies section.
    // Students marked >15m receive an additional note in the CSV.
    const tardiesStudents = studentsToExport
        .filter(student =>
            student.attendance === 'Tardy' ||
            (istechTheater && student.attendance === '>15m')
        );

    const tardiesItemized = tardiesStudents.map(student => {
        const isOver15Minutes =
            istechTheater && student.attendance === '>15m';

        return {
            name: student.name,
            note: isOver15Minutes ? '>15m late' : '',
            csv: isOver15Minutes
                ? `"${student.name}",Tardy,=DATEVALUE("${dateStr}"),">15m late"`
                : `"${student.name}",Tardy,=DATEVALUE("${dateStr}")`
        };
    });

    const absencesItemized = studentsToExport
        .filter(student =>
            student.attendance === 'Absent' ||
            (istechTheater && student.attendance === 'EX')
        )
        .map(student =>
            `"${student.name}",Absent,=DATEVALUE("${dateStr}")`
        );

    const additionalStudentsMessage = additionalStudents.length > 0
        ? additionalStudents.map(s => `"${s.name}",Additional`)
        : [];

    const finalCsvRows = [
        headers.join(','),
        classworkRow.join(','),
        ...(housePointsItemized.length > 0
            ? ['', 'House Points', ...housePointsItemized]
            : []),
        ...(tardiesItemized.length > 0
            ? ['', 'Tardies', ...tardiesItemized.map(item => item.csv)]
            : []),
        ...(absencesItemized.length > 0
            ? ['', 'Absences', ...absencesItemized]
            : []),
        ...(additionalStudentsMessage.length > 0
            ? additionalStudentsMessage
            : [])
    ];

    const className = classes[currentClassIndex].name
        .replace(/[^a-zA-Z0-9]/g, '_')
        .replace(/_{2,}/g, '_')
        .replace(/^_|_$/g, '');

    const csvContent = finalCsvRows.join('\n');
    const blob = new Blob([csvContent], {
        type: 'text/csv;charset=utf-8;'
    });

    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);

    link.setAttribute('href', url);
    link.setAttribute(
        'download',
        `${className}_Scores_${csvFileDateStr}.csv`
    );

    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    const housePointsDisplay = housePointsItemized.length > 0
        ? housePointsItemized.map(item => {
            const [name, points] = item.split(',');
            return `${name.replace(/"/g, '')}: ${points}`;
        }).join('\n')
        : 'No house points';

    const tardiesDisplay = tardiesItemized.length > 0
        ? `Tardies:\n${tardiesItemized.map(item =>
            item.note
                ? `${item.name} (${item.note})`
                : item.name
        ).join('\n')}`
        : 'No tardies';

    const absencesDisplay = absencesItemized.length > 0
        ? `Absences:\n${absencesItemized.map(item => {
            const [name] = item.split(',');
            return name.replace(/"/g, '');
        }).join('\n')}`
        : 'No absences';

    const separator =
        housePointsItemized.length === 0 &&
        tardiesItemized.length === 0 &&
        absencesItemized.length === 0
            ? '\n'
            : '\n\n';

    const message =
        `House points for today:\n${housePointsDisplay}` +
        `${separator}${tardiesDisplay}\n\n${absencesDisplay}` +
        `${additionalStudentsMessage.length > 0
            ? `\n\nAdditional students:\n${additionalStudents.map(s => s.name).join('\n')}`
            : ''}` +
        '\n\nReset scores?';

    showCustomAlert(message);
    showTemporaryMessage('Scores exported as CSV');
    closeSpecificMenu('teacher-mode');
}

    const unxStudents = students
        .filter(student => student.attendance === 'UNX')
        .map(student => student.name)
        .sort((a, b) => a.localeCompare(b));

    const over15MinutesStudents = students
        .filter(student => student.attendance === '>15m')
        .map(student => student.name)
        .sort((a, b) => a.localeCompare(b));

    const message = [
        'UNX (no-show)',
        ...unxStudents,
        '',
        'UNX (>15m late)',
        ...over15MinutesStudents
    ].join('\n');

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(message);
        } else {
            const textarea = document.createElement('textarea');
            textarea.value = message;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();

            const copied = document.execCommand('copy');
            textarea.remove();

            if (!copied) {
                throw new Error('Clipboard copy failed.');
            }
        }

        showTemporaryMessage('UNX list copied to clipboard!');
    } catch (error) {
        console.error('Could not copy UNX list:', error);
        showTemporaryMessage('Could not copy UNX list. Please try again.');
    }
}


function resetAllStudents() {
    const isTechTheater = classes[currentClassIndex].name === 'Tech Theater';
    const resetAttendance = isTechTheater ? 'UNX' : 'Absent';
    const resetScore = isTechTheater ? 'UNX' : 'EX';

    students.forEach(student => {
        student.attendance = resetAttendance;

        student.stands = false;
        student.intonation = false;
        student.devices = false;
        student.review = false;
        student.returned = false;
        student.progress = false;
        student.engagement = false;

        student.score = resetScore;
        student.manualAdjustment = 0;
        student.housePoints = 0;

        updateScoreDisplay(student);
    });

    document.querySelectorAll('.attendance-dropdown select').forEach(select => {
        select.value = resetAttendance;
        select.classList.remove('present', 'tardy', 'absent', 'unx', 'ex');
        select.classList.add(resetAttendance.toLowerCase());
    });

    document.querySelectorAll('.checkbox-container input[type="checkbox"]').forEach(checkbox => {
        checkbox.checked = false;
        checkbox.disabled = isTechTheater;
    });

    document.querySelectorAll('.spreadsheet-row .stepper:last-child span').forEach(span => {
        span.textContent = '0';
    });

    const bars = document.querySelectorAll('.bar');

    bars.forEach(bar => {
        bar.style.transition = 'height 0.5s ease-in-out, width 0.5s ease-in-out';
        bar.style.height = '0px';
    });

    setTimeout(() => {
        createBars();

        if (document.getElementById('teacher-mode').style.display === 'block') {
            populateStudents();
        }
    }, 500);
}

createBars();
updateDateTime();
setInterval(updateDateTime, 1000);
    </script>
