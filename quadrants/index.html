<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../icons/bg-icon.png">
    <script src="../apstudents.js"></script>
    <title>Quadrants</title>
       
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BIPH Band">
    <link rel="apple-touch-icon" href="https://cdn.glitch.global/bed65df6-4eb8-4247-853c-e198a6399561/icons%2FBGicon.png">
    
    <link rel="icon" href="../icons/BGicon.png">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, rgb(45, 70, 119), rgb(9, 32, 79));
            font-family: Arial, sans-serif;
            user-select: none;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .student {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 20px;
            border: 2px solid rgba(255, 255, 255, 0.294);
            border-radius: 15px;
            color: white;
            transform: translate(-50%, -50%);
            transition: all 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
            pointer-events: auto;
            white-space: nowrap;
            font-size: 1.1em;
            opacity: 0;
            cursor: grab;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .student:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 1000;
        }

        .shuffle-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 200;
            pointer-events: auto;
        }
        
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 2em;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .quad-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.85em;
            text-align: center;
            outline: none;
            padding: 0 20px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .shuffle-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .edit-btn {
            position: fixed;
            top: 65px;
            left: 20px;
            font-size: 1.4em; 
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            border-radius: 50%;
            width: 45px;  
            height: 45px; 
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .edit-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        #editPanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 25px 30px;
            width: 92%;
            max-width: 420px;
            max-height: 85vh;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #editPanel h3 {
            margin: 0 0 20px 0;
            text-align: center;
            font-size: 1.5em;
            color: white;
        }

        .student-list {
            max-height: 58vh;
            overflow-y: auto;
            padding-right: 6px;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }

        .student-item span {
            color: white;
            font-size: 1.05em;
        }

        .student-item:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .remove-btn {
            background: rgba(255, 70, 70, 0.524);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(255, 70, 70, 0.828);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 14px;
            font-size: 1.1em;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.135);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-buttons button:hover {
            background: rgba(255, 255, 255, 0.404);
        }
    </style>
</head>
<body>
    <div id="shared-menu"></div>
    <script src="../menu.js"></script> 

    <!-- Edit Button -->
    <button onclick="toggleEditPanel()" class="edit-btn">✏️</button>

    <div class="container">
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <div class="box"><input type="text" class="quad-input" placeholder=""></div>
        <button class="shuffle-btn">🔀</button>
    </div>

    <!-- Edit Panel -->
    <div id="editPanel">
        <h3>Edit Roster</h3>
        <div class="student-list" id="studentList"></div>
        
        <div class="modal-buttons">
            <button onclick="toggleEditPanel()">Done</button>
            <button onclick="resetToFullRoster()">Reset Full Roster</button>
        </div>
    </div>

    <script>
        let currentStudents = [];
        let studentElements = [];
        let isDragging = false;
        let draggedElement = null;

        const container = document.querySelector('.container');
        const shuffleBtn = document.querySelector('.shuffle-btn');
        let isInputFocused = false;

        // Make element draggable
        function makeDraggable(element) {
            let offsetX, offsetY;

            element.addEventListener('mousedown', (e) => {
                if (document.getElementById('editPanel').style.display === 'block') return;
                if (isInputFocused) return;

                isDragging = true;
                draggedElement = element;

                const rect = element.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                element.style.transition = 'none';
                element.style.zIndex = 1000;
            });
        }

        function onMouseMove(e) {
            if (!isDragging || !draggedElement) return;

            const containerRect = container.getBoundingClientRect();

            let newLeft = e.clientX - containerRect.left;
            let newTop = e.clientY - containerRect.top;

            // Keep within bounds
            newLeft = Math.max(40, Math.min(newLeft, containerRect.width - 40));
            newTop = Math.max(40, Math.min(newTop, containerRect.height - 40));

            draggedElement.style.left = `${newLeft}px`;
            draggedElement.style.top = `${newTop}px`;
        }

        function onMouseUp() {
            if (draggedElement) {
                draggedElement.style.transition = 'all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1)';
                draggedElement.style.zIndex = 10;
            }
            isDragging = false;
            draggedElement = null;
        }

        function initRoster() {
            if (typeof apStudents !== 'undefined' && apStudents.length > 0) {
                currentStudents = apStudents.slice();
            } else {
                console.error("apStudents not found!");
                currentStudents = [];
            }
            createStudentElements();
        }

        function createStudentElements() {
            studentElements.forEach(el => el.remove());
            studentElements = [];

            currentStudents.forEach(student => {
                const name = student.name || student.altName || "";
                if (!name) return;

                const div = document.createElement('div');
                div.className = 'student';
                div.textContent = name;
                div.style.left = '50%';
                div.style.top = '50%';
                container.appendChild(div);
                studentElements.push(div);

                makeDraggable(div);
            });
        }

        function toggleEditPanel() {
            const panel = document.getElementById('editPanel');
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                refreshStudentList();
                panel.style.display = 'block';
            }
        }

        function refreshStudentList() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';

            currentStudents.forEach((student, index) => {
                const div = document.createElement('div');
                div.className = 'student-item';

                const span = document.createElement('span');
                span.textContent = student.name || student.altName || "";

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = 'Remove';

                removeBtn.addEventListener('click', function(e) {
                    e.stopImmediatePropagation();
                    removeStudent(index);
                });

                div.appendChild(span);
                div.appendChild(removeBtn);
                list.appendChild(div);
            });
        }

        function removeStudent(index) {
            if (index < 0 || index >= currentStudents.length) return;
            currentStudents.splice(index, 1);
            refreshStudentList();
            createStudentElements();
        }

        function resetToFullRoster() {
            if (typeof apStudents !== 'undefined') {
                currentStudents = apStudents.slice();
                refreshStudentList();
                createStudentElements();
            }
        }

        function getRandomPositionInQuadrant(quadIndex, existingPositions, minDistance = 95) {
            const rect = container.getBoundingClientRect();
            const qWidth = rect.width / 2;
            const qHeight = rect.height / 2;

            const baseX = (quadIndex % 2) * qWidth;
            const baseY = Math.floor(quadIndex / 2) * qHeight;

            const maxAttempts = 80;
            let attempts = 0;

            while (attempts < maxAttempts) {
                attempts++;
                const x = baseX + 80 + Math.random() * (qWidth - 160);
                const y = baseY + 70 + Math.random() * (qHeight - 140);

                let tooClose = false;
                for (const pos of existingPositions) {
                    const dx = x - pos.x;
                    const dy = y - pos.y;
                    if (Math.sqrt(dx * dx + dy * dy) < minDistance) {
                        tooClose = true;
                        break;
                    }
                }
                if (!tooClose) return { x, y };
            }

            return {
                x: baseX + 80 + Math.random() * (qWidth - 160),
                y: baseY + 70 + Math.random() * (qHeight - 140)
            };
        }

        function shuffle() {
            shuffleBtn.style.transform = 'translate(-50%, -50%) scale(1.2)';
            shuffleBtn.style.background = 'rgba(255, 255, 255, 0.35)';
            
            setTimeout(() => {
                shuffleBtn.style.transform = 'translate(-50%, -50%)';
                shuffleBtn.style.background = 'rgba(255, 255, 255, 0.1)';
            }, 180);

            studentElements.forEach(s => s.style.opacity = '1');

            const quadrants = [[], [], [], []];
            const shuffledStudents = [...studentElements].sort(() => Math.random() - 0.5);

            shuffledStudents.forEach((student, i) => {
                quadrants[i % 4].push(student);
            });

            quadrants.forEach((quadStudents, qIndex) => {
                const positions = [];
                quadStudents.forEach(student => {
                    const pos = getRandomPositionInQuadrant(qIndex, positions);
                    positions.push(pos);
                    student.style.left = `${pos.x}px`;
                    student.style.top = `${pos.y}px`;
                });
            });
        }

        // Event Listeners
        shuffleBtn.addEventListener('click', shuffle);

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);

        document.querySelectorAll('.quad-input').forEach(input => {
            input.addEventListener('focus', () => isInputFocused = true);
            input.addEventListener('blur', () => isInputFocused = false);
            input.addEventListener('keydown', e => {
                if (e.key === 'Escape') input.blur();
            });
        });

        document.addEventListener('keydown', e => {
            if (isInputFocused || isDragging) return;

            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                shuffle();
            }
            if (e.key === 'Escape') {
                const panel = document.getElementById('editPanel');
                if (panel.style.display === 'block') toggleEditPanel();
            }
        });

        window.addEventListener('resize', () => {
            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            studentElements.forEach(s => {
                s.style.left = `${centerX}px`;
                s.style.top = `${centerY}px`;
            });
        });

        window.addEventListener('load', () => {
            initRoster();
            setTimeout(shuffle, 400);
        });

        // Close modal when clicking outside
        document.addEventListener('click', function(event) {
            const panel = document.getElementById('editPanel');
            if (panel.style.display === 'block' && 
                !panel.contains(event.target) && 
                event.target.closest('.edit-btn') === null) {
                toggleEditPanel();
            }
        });
    </script>
</body>
</html>
