<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions on the Clock</title>
    <link rel="icon" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="questions.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root { --primary: #1c1c1c; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--primary);
            color: white;
            min-height: 100vh;
            transition: background 0.6s ease;
        }
        
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            z-index: 100;
            transition: opacity 2s ease;
        }
        
        .lives-container {
            background: rgba(0,0,0,0.4);
            padding: 8px 24px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;         
        }
        
        .heart {
            font-size: 2.1rem;
            transition: all 0.3s ease;
        }
        
        .heart.lost {
            opacity: 0.25;
            transform: scale(0.75);
        }
        
        .score {
            font-size: 2.8rem;
            font-weight: 700;
            background: rgba(0,0,0,0.4);
            padding: 0.4rem 1.8rem;
            border-radius: 9999px;
            width: 130px;     
            text-align: center;
            display: inline-block;  
        }
        
        .menu-btn {
            background: rgba(140, 140, 140, 0.069);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
            flex-shrink: 0;
        }

        .menu-btn:hover {
            background: rgba(140, 140, 140, 0.209);
        }
        
        .container {
            padding: 2rem;
            margin-top: 110px;
            max-width: 100%;
            width: 100%;
        }
        
        #readyScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            color: white;
            text-align: center;
            background: inherit;
        }
        
        .ready-content {
            padding: 2rem 2rem;
            border-radius: 20px;
            background: rgba(0,0,0,0.45);
            max-width: 90%;
        }
        
        .ready-content h1 {
            font-size: clamp(1.35rem, 4.5vw, 1.7rem);
            font-weight: 600;
            white-space: nowrap;
            margin-bottom: 2.2rem;
        }
        
        .start-game-btn {
            padding: 1.1rem 3.8rem;
            font-size: 1.55rem;
            font-weight: 700;
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.65);
            color: white;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .start-game-btn:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        .menu {
            position: fixed;  
            top: 75px;            
            right: 35px;          
            background: white;
            color: #1f2937;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            padding: 0.5rem 0;
            display: none;
            z-index: 200;
            min-width: 190px;
        }
        
        .menu button {
            padding: 0.9rem 1.5rem;
            width: 100%;
            text-align: left;
            border: none;
            background: none;
            font-size: 1.05rem;
            cursor: pointer;
        }
        
        .menu button:hover { background: #f3f4f6; }
        
        .color-picker {
            text-align: center;
            margin-top: 100px;
            padding: 2rem 1rem;
        }
        
        .color-picker h1 {
            font-size: clamp(2.2rem, 5vw, 2.8rem);
            margin-bottom: 2rem;
        }
        
        .colors {
            display: flex;
            justify-content: center;
            gap: clamp(0.1rem, 1.2vw, 0.8rem);
        }
        
        .color-btn {
            width: clamp(68px, 13vw, 88px);
            height: clamp(68px, 13vw, 88px);
            border-radius: 9999px;
            cursor: pointer;
            border: 7px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }
        
        .color-btn:hover {
            transform: scale(1.15);
            border-color: white;
        }
        
        .quiz-container { 
            margin-top: 10px;
            display: none; 
        }
        
        .question {
            font-size: 1.3rem;
            font-weight: 300;
            margin-bottom: 2.5rem;
            line-height: 1.35;
        }
        
        .options {
            display: grid;
            gap: 1.1rem;
            margin-bottom: 100px;
        }
        
        .option {
            background: rgba(255,255,255,0.16);
            padding: 1.45rem 1.7rem;
            border-radius: 16px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        .option:hover {
            background: rgba(255,255,255,0.26);
            transform: translateY(-1px);
        }
        
        .option.correct { background: #22c55e; color: white; }
        .option.incorrect { background: #ef4444; }
        .option.disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }
        
        .footer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(0,0,0,0.35);
            padding: 0.9rem 1.9rem;
            border-radius: 9999px;
            backdrop-filter: blur(12px);
            font-size: 1.15rem;
            display: none;
        }
        
        .message {
            position: absolute;
            top: 23px;
            left: 50%;
            transform: translateX(calc(-50% + 38px));   /* Shifted 30px to the right */
            font-size: 1.8rem;
            font-weight: 700;
            background: rgba(107, 107, 107, 1.0);
            padding: 8px 24px;
            border-radius: 9999px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 150;
            text-align: center;
            white-space: nowrap;
            width: 255px;
            height: 56px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header" id="header">
        <div id="setScore" class="score">0/3</div>
        
        <div id="livesContainer" class="lives-container">
            <!-- Hearts populated by JS -->
        </div>
        
        <button id="menuBtn" class="menu-btn">☰</button>
    </div>

    <div class="container">
        <!-- Color Picker -->
        <div id="colorScreen" class="color-picker">
            <h1>Choose your color</h1>
            <div class="colors">
                <div class="color-btn" style="background: #1e40af;" data-color="#162c76"></div>
                <div class="color-btn" style="background: #f666ce;" data-color="#a44288"></div>
                <div class="color-btn" style="background: #6b21a8;" data-color="#4f197b"></div>
                <div class="color-btn" style="background: #b40909;" data-color="#810808"></div>
                <div class="color-btn" style="background: #0e8c3e;" data-color="#0a602b"></div>
                <div class="color-btn" style="background: #b65a21;" data-color="#84431a"></div>
            </div>
        </div>

        <!-- Ready Screen -->
        <div id="readyScreen">
            <div class="ready-content">
                <h1>Wait for all players to be ready</h1>
                <button id="startGameBtn" class="start-game-btn">Start Game</button>
            </div>
        </div>

        <!-- Quiz -->
        <div id="quizScreen" class="quiz-container">
            <div id="questionText" class="question"></div>
            <div id="options" class="options"></div>
        </div>

        <div id="menu" class="menu">
            <button id="loseLifeBtn">Lose a Life</button>
        </div>
    </div>

    <div id="totalFooter" class="footer">
        Total: <span id="totalCorrect">0/0 (0%)</span>
    </div>

    <div id="message" class="message">Penalty: 0s</div>

    <script>
        let currentColor = '#1c1c1c';
        let remainingQuestions = [];
        let currentQuestionIndex = 0;
        let setCorrect = 0;
        let totalCorrect = 0;
        let totalAttempted = 0;
        let totalWrong = 0;
        let selectedAnswer = null;
        let gameOverMode = false;
        let isInPenalty = false;
        let lives = 5;

        const body = document.body;
        const colorScreen = document.getElementById('colorScreen');
        const readyScreen = document.getElementById('readyScreen');
        const quizScreen = document.getElementById('quizScreen');
        const setScoreEl = document.getElementById('setScore');
        const totalCorrectEl = document.getElementById('totalCorrect');
        const livesContainer = document.getElementById('livesContainer');
        const header = document.getElementById('header');
        const messageEl = document.getElementById('message');
        const menu = document.getElementById('menu');
        const menuBtn = document.getElementById('menuBtn');
        const optionsEl = document.getElementById('options');
        const questionText = document.getElementById('questionText');

        const correctSound = new Audio('correct.mp3');
        const incorrectSound = new Audio('incorrect.mp3');
        const gongSound = new Audio('gong.wav');
        const gameOverSound = new Audio('gameover.mp3');
        const loseLifeSound = new Audio('lose-a-life.mp3');
        const tickTockSound = new Audio('ticktock.mp3');
        tickTockSound.preload = 'auto';


        function playTick() {
            tickTockSound.currentTime = 0;
            tickTockSound.play().catch(() => {});
        }

        function createLives() {
            livesContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = '❤️';
                livesContainer.appendChild(heart);
            }
        }

        function updateLivesDisplay() {
            const hearts = livesContainer.querySelectorAll('.heart');
            hearts.forEach((heart, i) => {
                heart.classList.toggle('lost', i >= lives);
            });
        }

        function loseLife() {
            if (lives <= 0) return;

            const wasLastLife = lives === 1;
            lives--;
            updateLivesDisplay();

            if (wasLastLife) {
                playSound(gameOverSound);
                body.style.transition = 'background 10s ease';
                body.style.background = '#000000';
                gameOverMode = true;

                messageEl.textContent = "Game Over";
                messageEl.style.opacity = '1';
                
                setTimeout(() => {
                    header.style.transition = 'opacity 8s ease';
                    header.style.opacity = '0';
                }, 1200);

                setTimeout(() => {
                    messageEl.style.transition = 'fontSize 0s ease';
                    messageEl.textContent = "But keep going!";
                    messageEl.style.fontSize = '1.3rem';
                    messageEl.style.lineHeight = '1.7';
                    messageEl.style.opacity = '1';
                }, 1600);

                setTimeout(() => {
                    messageEl.style.transition = 'opacity 3s ease';   
                    messageEl.style.opacity = '0.5';
                }, 2600);

                setTimeout(() => {
                    messageEl.textContent = "(Improve your score)";
                    messageEl.style.fontSize = '1rem';
                    messageEl.style.lineHeight = '2.3';
                    messageEl.style.fontStyle = 'italic';
                    messageEl.style.fontWeight = '200';
                }, 3400);

                setTimeout(() => {
                    messageEl.style.transition = 'opacity 8s ease';   
                    messageEl.style.opacity = '0';
                }, 2700);

            } else {
                playSound(loseLifeSound);
            }
        }

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function refillQuestions() {
            remainingQuestions = shuffle(allQuestions);
        }

        function startQuiz() {
            colorScreen.style.display = 'none';
            readyScreen.style.display = 'flex';
            readyScreen.style.background = currentColor;
        }

        function beginGame() {
            readyScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            totalFooter.style.display = 'block';
            body.style.background = currentColor;
            gameOverMode = false;
            
            refillQuestions();
            currentQuestionIndex = 0;
            setCorrect = 0;
            totalWrong = 0;
            
            loadQuestion();
        }

        function updateSetScore() {
            setScoreEl.textContent = `${setCorrect}/3`;
        }

        function updateTotalFooter() {
            const percent = totalAttempted === 0 ? 0 : Math.round((totalCorrect / totalAttempted) * 100);
            totalCorrectEl.textContent = `${totalCorrect}/${totalAttempted} (${percent}%)`;
        }

        function loadQuestion(isPenalty = false) {
            if (remainingQuestions.length === 0) refillQuestions();
            if (currentQuestionIndex >= remainingQuestions.length) currentQuestionIndex = 0;

            const q = remainingQuestions[currentQuestionIndex];
            questionText.innerHTML = q.question.replace(/\n/g, '<br><br>');
            
            optionsEl.innerHTML = '';
            selectedAnswer = null;
            
            q.options.forEach(option => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = option;
                div.onclick = () => selectAnswer(option, div, q.answer);
                optionsEl.appendChild(div);
            });

            if (isPenalty) {
                isInPenalty = true;
                Array.from(optionsEl.children).forEach(opt => opt.classList.add('disabled'));
            }
        }

        function playSound(audio) {
            const clone = audio.cloneNode();
            clone.volume = audio.volume;
            clone.play().catch(() => {});
        }

        function startPenalty(seconds) {
            isInPenalty = true;
            let timeLeft = seconds;
            
            messageEl.textContent = `Penalty: ${timeLeft}s`;
            messageEl.style.opacity = '1';
            
            playTick();                    // Initial tick

            const countdown = setInterval(() => {
                timeLeft--;
                
                if (timeLeft > 0) {
                    playTick();                    // Changed from playSound(tickTockSound)
                    messageEl.textContent = `Penalty: ${timeLeft}s`;
                } else {
                    clearInterval(countdown);
                    messageEl.style.opacity = '0';
                    isInPenalty = false;
                    Array.from(optionsEl.children).forEach(opt => opt.classList.remove('disabled'));
                }
            }, 1000);
        }

        function triggerCelebration() {
            if (gameOverMode) return;
            playSound(gongSound);
            confetti({ particleCount: 400, spread: 90, origin: { y: 0.6 } });
            setTimeout(() => confetti({ particleCount: 250, angle: 60, spread: 70 }), 250);
            
            messageEl.textContent = "Flip your timer!";
            messageEl.style.opacity = '1';
            
            setTimeout(() => {
                messageEl.style.opacity = '0';
                setCorrect = 0;
                updateSetScore();
                currentQuestionIndex++;
                loadQuestion();
            }, 1600);
        }

        function selectAnswer(selectedOptionText, element, correctAnswer) {
            if (selectedAnswer || isInPenalty) return;
            selectedAnswer = selectedOptionText;
            
            const selectedLetter = selectedOptionText.trim().charAt(0).toUpperCase();
            const isCorrect = selectedLetter === correctAnswer;

            Array.from(optionsEl.children).forEach(opt => {
                opt.style.pointerEvents = 'none';
                const optLetter = opt.textContent.trim().charAt(0).toUpperCase();
                if (optLetter === correctAnswer) opt.classList.add('correct');
                if (opt.textContent === selectedOptionText && !isCorrect) opt.classList.add('incorrect');
            });
            
            totalAttempted++;

            if (isCorrect) {
                playSound(correctSound);
                setCorrect++;
                totalCorrect++;
                updateSetScore();
                updateTotalFooter();

                if (setCorrect >= 3) {
                    triggerCelebration();
                    return;
                }
                setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 800);
            } else {
                playSound(incorrectSound);
                totalWrong++;
                updateTotalFooter();
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion(true);
                    startPenalty(totalWrong);
                }, 900);
            }
        }

        // Event Listeners
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentColor = btn.dataset.color;
                startQuiz();
            });
        });

        document.getElementById('startGameBtn').addEventListener('click', beginGame);

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });

        document.getElementById('loseLifeBtn').addEventListener('click', () => {
            loseLife();
            menu.style.display = 'none';
        });

        document.addEventListener('click', () => menu.style.display = 'none');

        window.addEventListener('beforeunload', (e) => {
            const message = "Are you sure you want to quit or refresh? Your cumulative score will reset to 0.";
            e.preventDefault();
            e.returnValue = message;
            return message;
        });

        function updateHeaderVisibility() {
            const isColorScreen = colorScreen.style.display !== 'none';
            header.style.display = isColorScreen ? 'none' : 'flex';
        }

        // Initialize
        createLives();
        updateLivesDisplay();
        updateSetScore();
        updateTotalFooter();
        updateHeaderVisibility();

        const observer = new MutationObserver(updateHeaderVisibility);
        observer.observe(colorScreen, { attributes: true, attributeFilter: ['style'] });
    </script>
</body>
</html>
