<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions on the Clock</title>
    <link rel="icon" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="questions.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root {
            --primary: #1c1c1c;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--primary);
            color: white;
            min-height: 100vh;
            transition: background 0.6s ease;
        }
        
        .header {
            position: absolute;
            background: rgba(0, 0, 0, 0);
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
            z-index: 100;
        }
        
        .score {
            font-size: 2.8rem;
            font-weight: 700;
            background: rgba(0,0,0,0.4);
            padding: 0.4rem 1.8rem;
            border-radius: 9999px;
        }
        
        .menu-btn {
            background: rgba(140, 140, 140, 0.069);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            color: white;
            font-size: 1.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s;
        }

        .menu-btn:hover {
            background: rgba(140, 140, 140, 0.209);
        }
        
        .container {
            padding: 2rem;
            margin-top: 90px;
            max-width: 100%;
            width: 100%;
        }
        
        .menu {
            position: fixed;  
            top: 75px;            
            right: 35px;          
            background: white;
            color: #1f2937;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            padding: 0.5rem 0;
            display: none;
            z-index: 200;
            min-width: 190px;
        }
        
        .menu button {
            padding: 0.9rem 1.5rem;
            width: 100%;
            text-align: left;
            border: none;
            background: none;
            font-size: 1.05rem;
            cursor: pointer;
        }
        
        .menu button:hover { background: #f3f4f6; }
        
        .color-picker {
            text-align: center;
            margin-top: 100px;
            padding: 2rem 1rem;
            width: 100%;
        }
        
        .color-picker h1 {
            font-size: clamp(2.2rem, 5vw, 2.8rem);
            margin-bottom: 2rem;
        }
        
        .colors {
            display: flex;
            justify-content: center;
            gap: clamp(0.1rem, 1.2vw, 0.8rem);
            flex-wrap: nowrap;
            padding: 1rem 2rem; 
            scroll-padding: 2rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .colors::-webkit-scrollbar {
            display: none;
        }
                
        .color-btn {
            width: clamp(68px, 13vw, 88px);
            height: clamp(68px, 13vw, 88px);
            border-radius: 9999px;
            cursor: pointer;
            border: 7px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        
        .color-btn:hover {
            transform: scale(1.15);
            border-color: white;
        }
        
        .quiz-container { 
            margin-top: 10px;
            display: none; 
        }
        
        .question {
            font-size: 1.3rem;
            font-weight: 300;
            margin-bottom: 2.5rem;
            line-height: 1.35;
        }
        
        .options {
            display: grid;
            gap: 1.1rem;
            margin-bottom: 100px;
        }
        
        .option {
            background: rgba(255,255,255,0.16);
            padding: 1.45rem 1.7rem;
            border-radius: 16px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        .option:hover {
            background: rgba(255,255,255,0.26);
            transform: translateY(-1px);
        }
        
        .option.correct { background: #22c55e; color: white; }
        .option.incorrect { background: #ef4444; }
        .option.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: rgba(255,255,255,0.08);
        }
        
        .footer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(0,0,0,0.35);
            padding: 0.9rem 1.9rem;
            border-radius: 9999px;
            backdrop-filter: blur(12px);
            font-size: 1.15rem;
        }
        
        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.4rem;
            font-weight: 700;
            background: rgba(107, 107, 107, 0.95);
            padding: 1.2rem 3rem;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 300;
            text-align: center;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <div id="setScore" class="score">0/3</div>
        <button id="menuBtn" class="menu-btn">☰</button>
    </div>

    <div class="container">
        <div id="colorScreen" class="color-picker">
            <h1>Choose your color</h1>
            <div class="colors">
                <div class="color-btn" style="background: #1e40af;" data-color="#162c76"></div>
                <div class="color-btn" style="background: #f666ce;" data-color="#a44288"></div>
                <div class="color-btn" style="background: #6b21a8;" data-color="#4f197b"></div>
                <div class="color-btn" style="background: #b40909;" data-color="#810808"></div>
                <div class="color-btn" style="background: #0e8c3e;" data-color="#0a602b"></div>
                <div class="color-btn" style="background: #b65a21;" data-color="#84431a"></div>
            </div>
        </div>

        <div id="quizScreen" class="quiz-container">
            <div id="questionText" class="question"></div>
            <div id="options" class="options"></div>
        </div>

        <div id="menu" class="menu">
            <button id="resetBtn">Reset the Game</button>
            <button id="gameOverBtn">Game Over</button>
        </div>
    </div>

    <div id="totalFooter" class="footer">
        Total: <span id="totalCorrect">0/0 (0%)</span>
    </div>

    <div id="message" class="message">Penalty: 0s</div>

   <script>
    let currentColor = '#1c1c1c';
    let remainingQuestions = [];
    let currentQuestionIndex = 0;
    let setCorrect = 0;
    let totalCorrect = 0;
    let totalAttempted = 0;
    let totalWrong = 0;
    let selectedAnswer = null;
    let gameOverMode = false;
    let isInPenalty = false;

    const body = document.body;
    const colorScreen = document.getElementById('colorScreen');
    const quizScreen = document.getElementById('quizScreen');
    const setScoreEl = document.getElementById('setScore');
    const totalCorrectEl = document.getElementById('totalCorrect');
    const totalFooter = document.getElementById('totalFooter');
    const questionText = document.getElementById('questionText');
    const optionsEl = document.getElementById('options');
    const messageEl = document.getElementById('message');
    const menu = document.getElementById('menu');
    const menuBtn = document.getElementById('menuBtn');

    const correctSound = new Audio('correct.mp3');
    const incorrectSound = new Audio('incorrect.mp3');
    const gongSound = new Audio('gong.wav');
    const gameOverSound = new Audio('gameover.mp3');
    const tickTockSound = new Audio('ticktock.mp3');

    correctSound.volume = 0.1;
    incorrectSound.volume = 0.1;
    gongSound.volume = 0.1;
    gameOverSound.volume = 0.1;
    tickTockSound.volume = 0.2;

    // Improved Fisher-Yates shuffle
    function shuffle(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
    }

    function refillQuestions() {
        remainingQuestions = shuffle(allQuestions);
    }

    function updateUIVisibility() {
        const isColorScreen = colorScreen.style.display !== 'none';
        setScoreEl.style.display = isColorScreen ? 'none' : 'block';
        totalFooter.style.display = isColorScreen ? 'none' : 'block';
        menuBtn.style.display = isColorScreen ? 'none' : 'block';
    }

    function startQuiz() {
        colorScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        body.style.background = currentColor;
        gameOverMode = false;
        
        refillQuestions();           // Full shuffle at start
        currentQuestionIndex = 0;
        setCorrect = 0;
        totalWrong = 0;
        
        loadQuestion();
        updateUIVisibility();
    }

    function updateSetScore() {
        setScoreEl.textContent = `${setCorrect}/3`;
    }

    function updateTotalFooter() {
        const percent = totalAttempted === 0 ? 0 : Math.round((totalCorrect / totalAttempted) * 100);
        totalCorrectEl.textContent = `${totalCorrect}/${totalAttempted} (${percent}%)`;
    }

    function getAnswerLetter(optionText) {
        return optionText.trim().charAt(0).toUpperCase();
    }

    function loadQuestion(isPenalty = false) {
        // Refill only when we've gone through the entire deck
        if (remainingQuestions.length === 0) {
            refillQuestions();
        }

        // Safety check
        if (currentQuestionIndex >= remainingQuestions.length) {
            currentQuestionIndex = 0;
        }

        const q = remainingQuestions[currentQuestionIndex];
        
        // Support line breaks
        questionText.innerHTML = q.question.replace(/\n/g, '<br><br>');
        
        optionsEl.innerHTML = '';
        selectedAnswer = null;
        
        q.options.forEach(option => {
            const div = document.createElement('div');
            div.className = 'option';
            div.textContent = option;
            div.onclick = () => selectAnswer(option, div, q.answer);
            optionsEl.appendChild(div);
        });

        if (isPenalty) {
            isInPenalty = true;
            const options = optionsEl.children;
            for (let opt of options) opt.classList.add('disabled');
        }

        window.scrollTo({
            top: 0,
            behavior: 'smooth' 
        });
    }

    function playSound(audio) {
        const clone = audio.cloneNode();
        clone.volume = audio.volume;
        clone.play().catch(() => {});
    }

    function startPenalty(seconds) {
        isInPenalty = true;
        let timeLeft = seconds;

        messageEl.textContent = `Penalty: ${timeLeft}s`;
        messageEl.style.opacity = '1';
        messageEl.style.background = 'rgba(107, 107, 107, 0.95)';
        playSound(tickTockSound);

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                playSound(tickTockSound);
                messageEl.textContent = `Penalty: ${timeLeft}s`;
            } else {
                clearInterval(countdown);
                messageEl.style.opacity = '0';
                isInPenalty = false;

                const options = optionsEl.children;
                for (let opt of options) opt.classList.remove('disabled');
            }
        }, 1000);
    }

    function triggerCelebration() {
        if (gameOverMode) return;
        
        playSound(gongSound);
        confetti({ particleCount: 400, spread: 90, origin: { y: 0.6 } });
        setTimeout(() => confetti({ particleCount: 250, angle: 60, spread: 70 }), 250);
        
        messageEl.textContent = "Flip your timer!";
        messageEl.style.background = 'rgba(234, 88, 12, 0.95)';
        messageEl.style.opacity = '1';
        
        setTimeout(() => {
            messageEl.style.opacity = '0';
            
            setCorrect = 0;
            updateSetScore();
            startNewSet();
        }, 1600);
    }

    function startNewSet() {
        // Just continue to the next question — do NOT reset index
        currentQuestionIndex++;
        loadQuestion();
    }

    function selectAnswer(selectedOptionText, element, correctAnswer) {
        if (selectedAnswer || isInPenalty) return;
        selectedAnswer = selectedOptionText;
        
        const selectedLetter = getAnswerLetter(selectedOptionText);
        const isCorrect = selectedLetter === correctAnswer;

        const options = optionsEl.children;
        for (let opt of options) {
            opt.style.pointerEvents = 'none';
            const optLetter = getAnswerLetter(opt.textContent);
            
            if (optLetter === correctAnswer) opt.classList.add('correct');
            if (opt.textContent === selectedOptionText && !isCorrect) opt.classList.add('incorrect');
        }
        
        totalAttempted++;

        if (isCorrect) {
            playSound(correctSound);
            setCorrect++;
            totalCorrect++;
            updateSetScore();
            updateTotalFooter();

            if (setCorrect >= 3) {
                triggerCelebration();
                return;
            }

            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 800);
        } else {
            playSound(incorrectSound);
            totalWrong++;
            updateTotalFooter();

            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion(true);
                startPenalty(totalWrong);
            }, 900);
        }
    }

    // Color selection
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            currentColor = btn.dataset.color;
            startQuiz();
        });
    });

    // Menu
    document.getElementById('menuBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('Reset the game and return to color selection?')) {
            setCorrect = 0;
            totalCorrect = 0;
            totalAttempted = 0;
            totalWrong = 0;
            totalCorrectEl.textContent = '0/0 (0%)';
            menu.style.display = 'none';
            quizScreen.style.display = 'none';
            colorScreen.style.display = 'block';
            body.style.background = 'var(--primary)';
            updateUIVisibility();
        }
    });

    document.getElementById('gameOverBtn').addEventListener('click', () => {
        if (confirm('End the current session? Background will turn black.')) {
            playSound(gameOverSound);
            menu.style.display = 'none';
            body.style.background = '#000000';
            gameOverMode = true;
            setScoreEl.style.display = 'none';
        }
    });

    document.addEventListener('click', () => menu.style.display = 'none');

    // Initialize
    updateSetScore();
    updateTotalFooter();
    updateUIVisibility();
</script>
</body>
</html>
