        function unicodeToBase64(str) {
            const utf8Bytes = new TextEncoder().encode(str);
            const binary = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join('');
            return btoa(binary);
        }

        function capitalizeName(name) {
            return name.trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
        }

        // ====================== QUIZ LOGIC ======================
        function generateQuestionSet(section, num) {
            let pool = [...audioFiles[section]];

            // Apply difficulty filter if present
            if (QUIZ_CONFIG.allowedAnswers && QUIZ_CONFIG.allowedAnswers[section]) {
                pool = pool.filter(item => 
                    QUIZ_CONFIG.allowedAnswers[section].includes(item.answer)
                );
            }

            pool.sort(() => Math.random() - 0.5);
            const selected = pool.slice(0, num);

            return {
                urls: selected.map(item => `audio/${section}/${item.file}`),
                answers: selected.map(item => item.answer)
            };
        }

        function initQuiz() {
            questionBank[currentStudent] = {};
            sections.forEach((sec, i) => {
                const n = QUIZ_CONFIG.questionsPerSection[i];
                questionBank[currentStudent][sec] = generateQuestionSet(sec, n);
            });

            studentAnswers = [];
            currentSectionIndex = 0;
            currentQuestionIndex = 0;
            renderCurrentQuestion();

                triads: ['Major Triad','Minor Triad','Augmented Triad','Diminished Triad'],
                seventhChords: ['Major 7','Dominant 7','Minor 7','Half-Diminished 7','Diminished 7'],
                modes: ['Ionian','Dorian','Phrygian','Lydian','Mixolydian','Aeolian','Locrian']
            };

            const options = fullOrdered[section] || [];

            // Filter to only the answers allowed by the current difficulty
            if (QUIZ_CONFIG.allowedAnswers && QUIZ_CONFIG.allowedAnswers[section]) {
                return options.filter(opt => 
                    QUIZ_CONFIG.allowedAnswers[section].includes(opt)
                );
            }
            return options;
        }

        function renderCurrentQuestion() {
            const container = document.getElementById('quiz-questions');
            container.innerHTML = '';

            const sectionKey = sections[currentSectionIndex];
            const numQs = QUIZ_CONFIG.questionsPerSection[currentSectionIndex];

            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerHTML = `<strong>Part ${currentSectionIndex + 1}: ${sectionTitles[currentSectionIndex]}</strong><br>Question ${currentQuestionIndex + 1}/${numQs}`;
            container.appendChild(header);

            const box = document.createElement('div');
            box.className = 'question-box';
            box.innerHTML = `
                <button class="play-button" onclick="playCurrentAudio()">▶ Play Audio</button>
                <p id="play-count" class="play-count">Plays remaining: 2</p>
                <select id="answer-select" class="answer-select">
                    <option value="" disabled selected>Select your answer</option>
                </select>
            `;
            container.appendChild(box);

            // Populate dropdown with only relevant options
            const select = document.getElementById('answer-select');
            getOrderedOptions(sectionKey).forEach(opt => {
                const o = document.createElement('option');
                o.value = opt;
                o.textContent = opt;
                select.appendChild(o);
            });

            // Reset audio state
            playsLeft = 2;
            currentAudio = null;
            
            const playBtn = document.querySelector('.play-button');
            if (playBtn) playBtn.disabled = false;

            document.querySelector('.quiz-actions').classList.remove('hidden');
        }

        function playCurrentAudio() {
            const playBtn = document.querySelector('.play-button');
            
            if (!currentAudio) {
                const sectionKey = sections[currentSectionIndex];
                const url = questionBank[currentStudent][sectionKey].urls[currentQuestionIndex];
                currentAudio = new Audio(url);
            }

            if (playsLeft > 0) {
                currentAudio.currentTime = 0;
                currentAudio.play().catch(e => console.error(e));
                
                playsLeft--;
                document.getElementById('play-count').textContent = `Plays remaining: ${playsLeft}`;

                if (playsLeft === 0 && playBtn) {
                    playBtn.disabled = true;
                }
            }
        }

        function submitCurrentAnswer() {
            const answer = document.getElementById('answer-select').value;
            if (!answer) {
                alert("Please select an answer.");
                return;
            }
            studentAnswers.push(answer);

            const numQs = QUIZ_CONFIG.questionsPerSection[currentSectionIndex];

            if (currentQuestionIndex < numQs - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
            } else if (currentSectionIndex < sections.length - 1) {
                currentSectionIndex++;
                currentQuestionIndex = 0;
                renderCurrentQuestion();
            } else {
                finishQuiz();
            }
        }

        // ====================== RESULTS ======================
        function finishQuiz() {
            const resultData = prepareResultData();
            
            document.querySelector('.quiz-container').classList.add('hidden');
            document.querySelector('.quiz-actions').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');
            
            displayResults(resultData);
        }

        function prepareResultData() {
            const allCorrect = sections.flatMap(sec => questionBank[currentStudent][sec].answers);
            const termsToReview = [];

            studentAnswers.forEach((ans, i) => {
                if (ans.toLowerCase() !== allCorrect[i].toLowerCase()) {
                    termsToReview.push({ item: `Q${i+1}`, correct: allCorrect[i] });
                }
            });

            const correctCount = studentAnswers.filter((a, i) => 
                a.toLowerCase() === allCorrect[i].toLowerCase()
            ).length;

            const total = studentAnswers.length;

            return {
                student: capitalizeName(currentStudent),
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
                exercise: QUIZ_CONFIG.name || "Ear Training",
                answers: studentAnswers,
                questionSet: { correctAnswers: allCorrect },
                termsToReview: termsToReview,
                percentage: Math.round((correctCount / total) * 100)
            };
        }

        // Initialize standard login
        window.onload = () => {
            initLogin();
        };

        // ====================== NEW SHARE / AIRDROP ======================

        async function shareScoreEntryLink(data) {
            try {
                const exportPayload = {
                    student: data.student,
                    date: data.date,
                    time: data.time,
                    percentage: data.percentage,
                    exercise: data.exercise || "Ear Training",
                    termsToReview: data.termsToReview
                        ? data.termsToReview.map(t => t.correct || t.item)
                        : []
                };

                const jsonStr = JSON.stringify(exportPayload);
                const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
                const scoreEntryBase = 'https://biphmusic.github.io/grades/';
                const deepLink = `${scoreEntryBase}#data=${base64}`;

                const safeName = (data.student || 'Student').replace(/[\/\\?%*:|"<>]/g, '').trim();
                const fileName = `${safeName} - ${data.exercise || 'Ear Training'}, ${data.date}.txt`;

                const blob = new Blob([deepLink + '\n'], { type: 'text/plain' });
                const file = new File([blob], fileName, { type: 'text/plain' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: fileName,
                        text: 'Score for ' + data.student
                    });
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert('Could not share the file.');
                }
            }
        }


        // ====================== DISPLAY RESULTS ======================

        function displayResults(data) {
            const container = document.getElementById('results-section');
            container.innerHTML = '';

            const title = document.createElement('h2');
            title.textContent = `Results for ${data.student}`;
            container.appendChild(title);

            const dateTime = document.createElement('p');
            dateTime.textContent = `Date: ${data.date} | Time: ${data.time}`;
            container.appendChild(dateTime);

            const score = document.createElement('p');
            score.innerHTML = `<strong>Score: ${data.percentage}%</strong>`;
            container.appendChild(score);

            let html = `<table class="results-table"><tr><th>#</th><th>Your Answer</th><th>Correct Answer</th></tr>`;

            data.answers.forEach((ans, i) => {
                const correct = data.questionSet.correctAnswers[i];
                const isCorrect = ans.toLowerCase() === correct.toLowerCase();

                html += `<tr>
                    <td>${i + 1}</td>
                    <td class="${isCorrect ? '' : 'incorrect'}">${ans} ${isCorrect ? '<span class="correct-mark">√</span>' : ''}</td>
                    <td>${correct}</td>
                </tr>`;
            });

            html += `</table>`;
            container.insertAdjacentHTML('beforeend', html);

            if (data.termsToReview && data.termsToReview.length) {
                let reviewHTML = `<div class="terms-to-review"><h3>Items to Review</h3><ul>`;

                data.termsToReview.forEach(item => {
                    reviewHTML += `<li><strong>${item.item}:</strong> ${item.correct}</li>`;
                });

                reviewHTML += `</ul></div>`;
                container.insertAdjacentHTML('beforeend', reviewHTML);
            }

            const linkActions = document.createElement('div');
            linkActions.className = 'link-actions';

            const exportPayload = {
                student: data.student,
                date: data.date,
                time: data.time,
                percentage: data.percentage,
                exercise: data.exercise || "Ear Training",
                termsToReview: data.termsToReview
                    ? data.termsToReview.map(t => t.correct || t.item)
                    : []
            };

            const jsonStr = JSON.stringify(exportPayload);
            const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
            const scoreEntryBase = 'https://biphmusic.github.io/grades/';
            const deepLink = `${scoreEntryBase}#data=${base64}`;

            const copyLinkBtn = document.createElement('button');
            copyLinkBtn.className = 'copy-button';
            copyLinkBtn.textContent = '📋 Copy Score';

            copyLinkBtn.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(deepLink);
                    copyLinkBtn.textContent = '√ Link Copied!';
                    setTimeout(() => copyLinkBtn.textContent = '📋 Copy Score', 2200);
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = deepLink;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    copyLinkBtn.textContent = '√ Link Copied!';
                    setTimeout(() => copyLinkBtn.textContent = '📋 Copy Score', 2200);
                }
            };

            linkActions.appendChild(copyLinkBtn);

            const shareBtn = document.createElement('button');
            shareBtn.className = 'copy-button';
            shareBtn.textContent = '📤 Share / AirDrop';
            shareBtn.onclick = () => shareScoreEntryLink(data);
            linkActions.appendChild(shareBtn);

            container.appendChild(linkActions);
        }


        // ====================== KEYBOARD SHORTCUTS ======================
        document.addEventListener('keydown', function(e) {
            const activeElement = document.activeElement;
            const answerSelect = document.getElementById('answer-select');

            const quizContainer = document.querySelector('.quiz-container');
            const isQuizActive = quizContainer && 
                                !quizContainer.classList.contains('hidden') &&
                                document.getElementById('main-content').style.display !== 'none';

            const isLoginActive = document.getElementById('login-section') !== null && 
                                 !document.getElementById('login-section').classList.contains('hidden');

            // TAB (Login)
            if (e.key === 'Tab' && isLoginActive) {
                const nameInput = document.getElementById('name-input');
                if (nameInput) {
                    nameInput.focus();
                    e.preventDefault();
                }
                return;
            }

            // ENTER
            if (e.key === 'Enter') {
                if (isLoginActive) {
                    if (typeof checkName === 'function') checkName();
                    e.preventDefault();
                } 
                else if (isQuizActive && answerSelect) {
                    submitCurrentAnswer();
                    e.preventDefault();
                }
                return;
            }

            // SPACE - Play Audio
            if ((e.key === ' ' || e.key === 'Spacebar') && isQuizActive) {
                if (activeElement.tagName !== 'INPUT' && activeElement.tagName !== 'SELECT') {
                    e.preventDefault();
                    playCurrentAudio();
                }
            }

            // ARROW KEYS - Navigate dropdown
            if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && isQuizActive && answerSelect) {
                const sectionKey = sections[currentSectionIndex];
                const options = getOrderedOptions(sectionKey);
                if (options.length === 0) return;

                let currentIndex = options.indexOf(answerSelect.value);

                if (e.key === 'ArrowDown') {
                    currentIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % options.length;
                } else {
                    currentIndex = currentIndex === -1 ? options.length - 1 : (currentIndex - 1 + options.length) % options.length;
                }

                answerSelect.value = options[currentIndex];
                e.preventDefault();
            }
        });
    </script>
</body>
