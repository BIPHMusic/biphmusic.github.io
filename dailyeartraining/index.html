function unicodeToBase64(str) {
            const utf8Bytes = new TextEncoder().encode(str);
            const binary = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join('');
            return btoa(binary);
        }

        function capitalizeName(name) {
            return name.trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
        }

        // ====================== LOGIN ======================
        function autoLoginIfPossible() {
            const storedName = localStorage.getItem('biph_student_name');
            if (!storedName) return false;

            const lower = storedName.toLowerCase();
            const student = approvedStudents.find(s => 
                s.name.toLowerCase() === lower || (s.altName && s.altName.toLowerCase() === lower)
            );
            
            if (student) {
                currentStudent = lower;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('quiz-section').classList.remove('hidden');
                initQuiz();
                return true;
            }
            return false;
        }

        function checkName() {
            const nameInput = document.getElementById('name-input').value.trim();
            const errorElement = document.getElementById('error-message');

            if (!nameInput) {
                errorElement.textContent = 'Please enter your name';
                return;
            }

            const lower = nameInput.toLowerCase();
            const student = approvedStudents.find(s =>
                s.name.toLowerCase() === lower || (s.altName && s.altName.toLowerCase() === lower)
            );

            if (student) {
                currentStudent = lower;
                const displayName = capitalizeName(student.name);
                localStorage.setItem('biph_student_name', displayName);
                localStorage.setItem('biph_name_timestamp', Date.now().toString());

                if (typeof initMyMenu === 'function') initMyMenu();

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('quiz-section').classList.remove('hidden');
                initQuiz();
            } else {
                errorElement.textContent = 'Name not found in approved list';
            }
        }

        // ====================== QUIZ LOGIC ======================
        function generateQuestionSet(section) {
            let pool = [...audioFiles[section]];
            pool.sort(() => Math.random() - 0.5);
            const selected = pool.slice(0, 5);
            return {
                urls: selected.map(item => `audio/${section}/${item.file}`),
                answers: selected.map(item => item.answer)
            };
        }

        function initQuiz() {
            questionBank[currentStudent] = {
                intervals: generateQuestionSet('intervals'),
                triads: generateQuestionSet('triads'),
                seventhChords: generateQuestionSet('seventhChords'),
                modes: generateQuestionSet('modes')
            };
            studentAnswers = [];
            currentSectionIndex = 0;
            currentQuestionIndex = 0;
            renderCurrentQuestion();
        }

                intervals: ['Minor 2nd','Major 2nd','Minor 3rd','Major 3rd','Perfect 4th','Tritone','Perfect 5th','Minor 6th','Major 6th','Minor 7th','Major 7th','Perfect 8ve'],
                triads: ['Major Triad','Minor Triad','Augmented Triad','Diminished Triad'],
                seventhChords: ['Major 7','Dominant 7','Minor 7','Half-Diminished 7','Diminished 7'],
                modes: ['Ionian','Dorian','Phrygian','Lydian','Mixolydian','Aeolian','Locrian']
            };
            return orderedOptions[section] || [];
        }

        function renderCurrentQuestion() {
    const container = document.getElementById('quiz-questions');
    container.innerHTML = '';

    const sectionKey = sections[currentSectionIndex];

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `<strong>Part ${currentSectionIndex + 1}: ${sectionTitles[currentSectionIndex]}</strong><br>Question ${currentQuestionIndex + 1}/5`;
    container.appendChild(header);

    const box = document.createElement('div');
    box.className = 'question-box';
    box.innerHTML = `
        <button class="play-button" onclick="playCurrentAudio()">▶ Play Audio</button>
        <p id="play-count" class="play-count">Plays remaining: 2</p>
        <select id="answer-select" class="answer-select">
            <option value="" disabled selected>Select your answer</option>
        </select>
    `;
    container.appendChild(box);

    // Populate dropdown
    const select = document.getElementById('answer-select');
    getOrderedOptions(sectionKey).forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        select.appendChild(o);
    });

    // Reset audio button state for new question
    playsLeft = 2;
    currentAudio = null;
    
    const playBtn = document.querySelector('.play-button');
    if (playBtn) playBtn.disabled = false;

    document.querySelector('.quiz-actions').classList.remove('hidden');
}

function playCurrentAudio() {
    const playBtn = document.querySelector('.play-button');
    
    if (!currentAudio) {
        const sectionKey = sections[currentSectionIndex];
        const url = questionBank[currentStudent][sectionKey].urls[currentQuestionIndex];
        currentAudio = new Audio(url);
    }

    if (playsLeft > 0) {
        currentAudio.currentTime = 0;
        currentAudio.play().catch(e => console.error(e));
        
        playsLeft--;
        document.getElementById('play-count').textContent = `Plays remaining: ${playsLeft}`;

        if (playsLeft === 0 && playBtn) {
            playBtn.disabled = true;
        }
    }
}

        function submitCurrentAnswer() {
            const answer = document.getElementById('answer-select').value;
            if (!answer) {
                alert("Please select an answer.");
                return;
            }
            studentAnswers.push(answer);

            if (currentQuestionIndex < 4) {
                currentQuestionIndex++;
                renderCurrentQuestion();
            } else if (currentSectionIndex < 3) {
                currentSectionIndex++;
                currentQuestionIndex = 0;
                renderCurrentQuestion();
            } else {
                finishQuiz();
            }
        }

        // ====================== RESULTS ======================
function finishQuiz() {
    const resultData = prepareResultData();
    
    document.querySelector('.quiz-container').classList.add('hidden');
    document.querySelector('.quiz-actions').classList.add('hidden');
    document.getElementById('results-section').classList.remove('hidden');
    
    displayResults(resultData);
}

        function prepareResultData() {
            const allCorrect = sections.flatMap(sec => questionBank[currentStudent][sec].answers);
            const termsToReview = [];

            studentAnswers.forEach((ans, i) => {
                if (ans.toLowerCase() !== allCorrect[i].toLowerCase()) {
                    termsToReview.push({ item: `Q${i+1}`, correct: allCorrect[i] });
                }
            });

            const correctCount = studentAnswers.filter((a, i) => a.toLowerCase() === allCorrect[i].toLowerCase()).length;

            return {
                student: capitalizeName(currentStudent),
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
                exercise: "Ear Training",
                answers: studentAnswers,
                questionSet: { correctAnswers: allCorrect },
                termsToReview: termsToReview,
                percentage: Math.round((correctCount / 20) * 100)
            };
        }

        // ====================== INIT ======================
        document.addEventListener('DOMContentLoaded', () => {
            autoLoginIfPossible();
        });


        // ====================== SHARING & ENCRYPTION ======================
function getHiddenKey() {
    const parts = ["B1PH", "MU51C", "_V0C4B", "2026", "X7K9"];
    let key = parts.join("_");
    key = key.split('').map((char, i) => {
        return String.fromCharCode(char.charCodeAt(0) ^ (i + 7));
    }).join('');
    return key;
}

const SECRET_KEY = getHiddenKey();

function encryptData(data) {
    const jsonStr = JSON.stringify(data);
    let encrypted = '';
    
    for (let i = 0; i < jsonStr.length; i++) {
        encrypted += String.fromCharCode(
            jsonStr.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length)
        );
    }
    
    return btoa(encrypted) + "==v2";
}

async function shareResultsAsText(resultData) {
    try {
        const exportData = {
            student: resultData.student || "Unknown",
            date: resultData.date,
            time: resultData.time,
            percentage: resultData.percentage,
            exercise: "Ear Training",
            termsToReview: resultData.termsToReview ? 
                resultData.termsToReview.map(item => item.correct || item.item) : []
        };

        const encryptedContent = encryptData(exportData);
        
        const blob = new Blob([encryptedContent], { type: 'text/plain' });
        const safeName = (exportData.student || "Student").replace(/[^a-zA-Z0-9]/g, '_');
        const fileName = `EarTraining_${safeName}_${exportData.date || 'unknown'}.txt`;

        const file = new File([blob], fileName, { type: 'text/plain' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
        } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        console.error(err);
        alert('Failed to export results.');
    }
}

// ====================== UPDATED DISPLAY RESULTS ======================
function displayResults(data) {
    const container = document.getElementById('results-section');
    container.innerHTML = '';

    const title = document.createElement('h2');
    title.textContent = `Results for ${data.student}`;
    container.appendChild(title);

    const dateTime = document.createElement('p');
    dateTime.textContent = `Date: ${data.date} | Time: ${data.time}`;
    container.appendChild(dateTime);

    const score = document.createElement('p');
    score.innerHTML = `<strong>Score: ${data.percentage}%</strong>`;
    container.appendChild(score);

    // Results Table
    let html = `<table class="results-table"><tr><th>#</th><th>Your Answer</th><th>Correct Answer</th></tr>`;
    data.answers.forEach((ans, i) => {
        const correct = data.questionSet.correctAnswers[i];
        const isCorrect = ans.toLowerCase() === correct.toLowerCase();
        html += `<tr>
            <td>${i+1}</td>
            <td class="${isCorrect ? '' : 'incorrect'}">${ans} ${isCorrect ? '<span class="correct-mark">√</span>' : ''}</td>
            <td>${correct}</td>
        </tr>`;
    });
    html += `</table>`;
    container.insertAdjacentHTML('beforeend', html);

    // Items to Review
    if (data.termsToReview && data.termsToReview.length) {
        let reviewHTML = `<div class="terms-to-review"><h3>Items to Review</h3><ul>`;
        data.termsToReview.forEach(item => {
            reviewHTML += `<li><strong>${item.item}:</strong> ${item.correct}</li>`;
        });
        reviewHTML += `</ul></div>`;
        container.insertAdjacentHTML('beforeend', reviewHTML);
    }

    // Share Button
    const shareBtn = document.createElement('button');
    shareBtn.className = 'copy-button';
    shareBtn.textContent = '📤 Share Results (Airdrop)';
    shareBtn.onclick = () => shareResultsAsText(data);
    container.appendChild(shareBtn);

    // ====================== QR CODE (Now identical to Vocab) ======================
    const qrContainer = document.createElement('div');
    qrContainer.id = 'qr-code';
    qrContainer.style.marginTop = '30px';
    qrContainer.style.width = '200px';
    qrContainer.style.height = '200px';
    qrContainer.style.marginLeft = 'auto';
    qrContainer.style.marginRight = 'auto';
    container.appendChild(qrContainer);

    const simplified = { 
        s: data.student, 
        d: data.date, 
        t: data.time, 
        p: data.percentage,
        e: "Ear" 
    };

    const resultUrl = `${window.location.origin}${window.location.pathname}?results=${encodeURIComponent(unicodeToBase64(JSON.stringify(simplified)))}`;

    if (typeof kjua !== 'undefined') {
        const qr = kjua({
            text: resultUrl,
            size: 200,
            fill: '#303f6c',
            back: '#FFFFFF',
            quiet: 0,
            ecLevel: 'M',
            render: 'canvas'
        });
        qrContainer.appendChild(qr);
    }
}


        // ====================== KEYBOARD SHORTCUTS ======================
document.addEventListener('keydown', function(e) {
    const activeElement = document.activeElement;
    const nameInput = document.getElementById('name-input');
    const answerSelect = document.getElementById('answer-select');
    const isQuizVisible = !document.getElementById('quiz-section').classList.contains('hidden');
    const isLoginVisible = !document.getElementById('login-section').classList.contains('hidden');

    // ==================== TAB ====================
    if (e.key === 'Tab') {
        if (isLoginVisible && activeElement !== nameInput) {
            nameInput.focus();
            e.preventDefault();
        }
        // You can extend Tab navigation inside quiz later if needed
        return;
    }

    // ==================== ENTER ====================
    if (e.key === 'Enter') {
        if (isLoginVisible) {
            checkName();
            e.preventDefault();
        } 
        else if (isQuizVisible && answerSelect) {
            submitCurrentAnswer();
            e.preventDefault();
        }
        return;
    }

    // ==================== SPACE - Play Audio ====================
    if ((e.key === ' ' || e.key === 'Spacebar') && isQuizVisible) {
        // Only trigger if not typing in an input
        if (activeElement.tagName !== 'INPUT' && activeElement.tagName !== 'SELECT') {
            e.preventDefault();
            playCurrentAudio();
        }
    }

    // ==================== ARROW KEYS - Navigate dropdown ====================
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && isQuizVisible && answerSelect) {
        const sectionKey = sections[currentSectionIndex];
        const orderedOptions = {
            intervals: [
                'Minor 2nd', 'Major 2nd', 'Minor 3rd', 'Major 3rd',
                'Perfect 4th', 'Tritone', 'Perfect 5th', 'Minor 6th',
                'Major 6th', 'Minor 7th', 'Major 7th', 'Perfect 8ve'
            ],
            triads: ['Major Triad', 'Minor Triad', 'Augmented Triad', 'Diminished Triad'],
            seventhChords: ['Major 7', 'Dominant 7', 'Minor 7', 'Half-Diminished 7', 'Diminished 7'],
            modes: ['Ionian', 'Dorian', 'Phrygian', 'Lydian', 'Mixolydian', 'Aeolian', 'Locrian']
        };

        const options = orderedOptions[sectionKey] || [];
        if (options.length === 0) return;

        let currentIndex = options.indexOf(answerSelect.value);

        if (e.key === 'ArrowDown') {
            currentIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % options.length;
        } else { // ArrowUp
            currentIndex = currentIndex === -1 ? options.length - 1 : (currentIndex - 1 + options.length) % options.length;
        }

        answerSelect.value = options[currentIndex];
        e.preventDefault();
    }
});
