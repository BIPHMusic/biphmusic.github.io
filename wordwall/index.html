<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Wall</title>
       
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BIPH Band">
    <link rel="apple-touch-icon" href="https://cdn.glitch.global/bed65df6-4eb8-4247-853c-e198a6399561/icons%2FBGicon.png">
    
    <link rel="icon" href="../icons/BGicon.png">
    <link rel="stylesheet" href="../common-styles.css">
    <link rel="preload" href="../fonts/Zapfino.ttf" as="font" type="font/ttf" crossorigin="anonymous">

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        /* SHARED STYLES */
        /* Loaded from common-styles.css - Do not duplicate/edit: */
        /* body, h1, .Subtitle, .background, .overlay, .overlay2, .logo */

        #unitSelector {
            display: block;
            margin: 0 auto 25px;
            padding: 8px 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            cursor: pointer;
            width: auto;
            min-width: 180px;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27 viewBox=%270 0 12 8%27 fill=%27white%27><polygon points=%276,8 0,0 12,0%27/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 32px;
        }

        #unitSelector:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.6);
        }

        #unitSelector option {
            cursor: pointer;
        }

        #glossary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .term-card {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 130px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0);
        }

        .term-card:hover {
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 5px 50px rgba(255, 255, 255, 0.05);
        }

        .term {
            font-family: sans-serif;
            font-size: 1.1em;
            margin-bottom: 12px;
            color: #fbe179;
            transition: filter 0.6s ease;
            position: relative;
        }

        .definition {
            font-size: 1.1em;
            line-height: 1.4;
            flex-grow: 1;
        }

        .hidden-mode .term {
            filter: blur(50px);
        }

        .term-card .reveal-btn {
            display: none;
            position: absolute;
            top: 8px;
            left: 12px;
            background: none;
            border: none;
            cursor: pointer;
            width: 38px;
            height: 38px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hidden-mode .term-card:hover .reveal-btn {
            display: block;
            opacity: 0.7;
        }

        .reveal-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            font-size: 19px;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            z-index: 20;
        }
        .close-btn:hover { color: white; }

        .poof {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
        .poof::before,
        .poof::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        .poof::before {
            width: 80px;
            height: 80px;
            top: -20px;
            left: -20px;
        }
        .poof::after {
            width: 60px;
            height: 60px;
            top: 30px;
            left: 50px;
        }

        @keyframes poofAnimation {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.6;
            }
            100% {
                transform: translate(-50%, -50%) scale(3.2);
                opacity: 0;
            }
        }

        .hidden-mode-toggle {
            position: absolute;
            top: 50px;
            left: 11px;
            background: none;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 60px;
            height: 50px;
        }
        .shuffle-button {
            position: absolute;
            top: 95px;
            left: 11px;
            background: none;
            border: none;
            padding: 10px;
            opacity: 0.7;
            cursor: pointer;
            width: 60px;
            height: 50px;
        }
        .hidden-mode-toggle img, .shuffle-button img {
            width: 100%;
            height: 100%;
        }

        /* Celebration overlay */
        #celebration {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
            padding: 20px;
        }

        #celebration.show {
            opacity: 1;
            pointer-events: auto;
        }

        #celebration .congrats-text {
            font-family: 'Zapfino', cursive;
            font-size: clamp(1.9rem, 5.2vw, 3.1rem);   /* smaller */
            font-weight: normal;
            margin: 0 0 6px 0;
            line-height: 1.1;
            text-shadow: 0 4px 22px rgba(0,0,0,0.55);
        }

        #celebration .cleared-text {
            font-size: clamp(1.15rem, 3.2vw, 1.55rem);
            margin: 0 0 14px 0;
            opacity: 0.95;
            line-height: 1.25;
        }

        #celebration .datetime-text {
            font-size: 0.78rem;
            opacity: 0.55;
            letter-spacing: 0.3px;
            margin: 0;
            line-height: 1.2;
        }

        /* Hotkey modal */
        #hotkey-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #hotkey-modal.show {
            display: flex;
            opacity: 1;
        }

        .hotkey-box {
            background: rgba(255, 255, 255, 0.97);
            color: #2c3e50;
            border-radius: 14px;
            padding: 28px 32px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
            font-family: Arial, sans-serif;
        }

        .hotkey-box h2 {
            margin: 0 0 18px 0;
            font-size: 1.35rem;
            text-align: center;
            color: #1a2a4a;
        }

        .hotkey-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #e8eef5;
            font-size: 0.98rem;
        }

        .hotkey-row:last-child {
            border-bottom: none;
        }

        .hotkey-key {
            background: #e8eef5;
            border: 1px solid #c5d0e0;
            border-radius: 6px;
            padding: 3px 10px;
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 600;
            min-width: 28px;
            text-align: center;
            color: #2c3e50;
        }

        .hotkey-desc {
            color: #445;
        }

        .hotkey-hint {
            margin-top: 18px;
            text-align: center;
            font-size: 0.82rem;
            color: #789;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    <div class="overlay2"></div>


    <h1 class="Title">BIPH Music</h1>
    <h1 class="Subtitle">Word Wall</h1>

    <select id="unitSelector" onchange="filterTerms()" style="margin-top: -20px;">
        <option value="Cumulative">Cumulative</option>
        <option value="Unit1">Unit 1</option>
        <!-- <option value="Unit2">Unit 2</option> -->
        <!-- <option value="Unit3">Unit 3</option> -->
        <!-- <option value="Unit4">Unit 4</option> -->
        <!-- <option value="Unit5">Unit 5</option> -->
    </select>

    <button class="hidden-mode-toggle" onclick="toggleHiddenMode()">
        <img src="../icons/hidden-off.png" alt="Toggle Hidden Mode" id="hiddenModeIcon">
    </button>

    <button class="shuffle-button" onclick="shuffleCards()">
        <img src="../icons/shuffle.png" alt="Shuffle">
    </button>

    <div id="glossary"></div>

    <div class="logocontainer">        
        <img src="../icons/Full Logo White on Transparent.png" alt="BASIS Logo" class="logo">
    </div>

    <div id="shared-menu"></div>
    <script src="../apstudents.js"></script>
    <script src="../login-screen.js"></script>
    <script src="../menu.js"></script>
    <script src="../mymenu.js"></script>
    <script src="../terms.js"></script>



    <script>

        let hiddenMode = false;
        let currentOrder = [];
        let initialWordCount = 0;

        function createTermCard(term) {
            const card = document.createElement('div');
            card.className = 'term-card';
            card.dataset.term = term.Term;

            card.innerHTML = `
                <div class="term">${term.Term}</div>
                <div class="definition">${term.Definition}</div>
                <button class="reveal-btn" onclick="revealTerm(this)">
                    <img src="../icons/magnifying-glass.png" alt="Reveal">
                </button>
                <button class="close-btn" onclick="removeCard(this.parentElement)">✕</button>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.closest('.reveal-btn') || e.target.closest('.close-btn')) return;
                if (!hiddenMode) removeCard(card);
            });

            return card;
        }

        function toggleHiddenMode() {
            hiddenMode = !hiddenMode;
            const icon = document.getElementById('hiddenModeIcon');
            icon.src = hiddenMode ? "../icons/hidden-on.png" : "../icons/hidden-off.png";
            document.body.classList.toggle('hidden-mode', hiddenMode);
            
            setTimeout(() => {
                renderCurrentCards();
            }, 500);
        }

        function renderCurrentCards() {
            const glossary = document.getElementById('glossary');
            glossary.innerHTML = '';

            if (currentOrder.length === 0) {
                theglossary.forEach(t => glossary.appendChild(createTermCard(t)));
                currentOrder = theglossary.map(t => t.Term);
            } else {
                currentOrder.forEach(name => {
                    const term = theglossary.find(t => t.Term === name);
                    if (term) glossary.appendChild(createTermCard(term));
                });
            }
        }

        function filterTerms() {
            const selected = document.getElementById('unitSelector').value;
            let termList;

            switch (selected) {
                case 'Unit1':
                    termList = unit1;
                    break;
                case 'Unit2':
                    termList = unit2;
                    break;
                case 'Unit3':
                    termList = unit3;
                    break;
                case 'Unit4':
                    termList = unit4;
                    break;
                case 'Unit5':
                    termList = unit5;
                    break;
                case 'Cumulative':
                    termList = cumulative;
                    break;
                default:
                    termList = cumulative;
            }

            const glossary = document.getElementById('glossary');
            glossary.innerHTML = '';

            const filtered = theglossary.filter(term => termList.includes(term.Term));
            filtered.forEach(term => glossary.appendChild(createTermCard(term)));
            currentOrder = filtered.map(t => t.Term);
            initialWordCount = filtered.length;
        }

        function revealTerm(button) {
            const card = button.closest('.term-card');
            const termEl = card.querySelector('.term');
            
            termEl.style.filter = 'blur(0px)';
            button.style.display = 'none';

            setTimeout(() => {
                if (hiddenMode && card.isConnected) {
                    termEl.style.filter = 'blur(50px)';
                    button.style.display = 'block';
                }
            }, 2000);
        }

        function removeCard(card) {
            const poof = document.createElement('div');
            poof.className = 'poof';
            poof.style.animation = 'poofAnimation 0.45s ease-out forwards';
            card.appendChild(poof);

            card.style.transition = 'opacity 0.35s ease';
            card.style.opacity = '0';

            setTimeout(() => {
                card.remove();
                currentOrder = currentOrder.filter(t => t !== card.dataset.term);

                if (currentOrder.length === 0) {
                    showCelebration();
                }
            }, 400);
        }

        function shuffleCards() {
            const glossary = document.getElementById('glossary');
            let cards = Array.from(glossary.children);

            // Fisher-Yates shuffle
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }

            glossary.innerHTML = '';
            cards.forEach(card => glossary.appendChild(card));

            const positions = cards.map(card => {
                const rect = card.getBoundingClientRect();
                return {
                    left: glossary.clientWidth / 2 - rect.left - rect.width / 2,
                    top: glossary.clientHeight / 2 - rect.top - rect.height / 2
                };
            });

            cards.forEach((card, i) => {
                card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
                card.style.transform = `translate(${positions[i].left}px, ${positions[i].top}px)`;
                card.style.opacity = '0.15';
            });

            setTimeout(() => {
                cards.forEach(card => {
                    card.style.transition = '';
                    card.style.transform = '';
                    card.style.opacity = '1';
                });
            }, 400);

            currentOrder = cards.map(card => card.dataset.term);
        }

        // ---------- Celebration ----------
        function getUserName() {
            return localStorage.getItem('biph_student_name') || null;
        }

        function showCelebration() {
            const defaults = {
                startVelocity: 42,
                decay: 0.92,
                ticks: 140,
                gravity: 0.85,
                zIndex: 3000
            };

            confetti({
                ...defaults,
                particleCount: 160,
                spread: 110,
                origin: { y: 0.55 }
            });

            setTimeout(() => {
                confetti({
                    ...defaults,
                    particleCount: 110,
                    angle: 60,
                    spread: 75,
                    origin: { x: 0, y: 0.65 }
                });
            }, 200);

            setTimeout(() => {
                confetti({
                    ...defaults,
                    particleCount: 110,
                    angle: 120,
                    spread: 75,
                    origin: { x: 1, y: 0.65 }
                });
            }, 380);

            setTimeout(() => {
                confetti({
                    ...defaults,
                    particleCount: 100,
                    spread: 160,
                    origin: { y: 0.48 }
                });
            }, 650);

            setTimeout(() => {
                confetti({
                    ...defaults,
                    particleCount: 70,
                    spread: 180,
                    startVelocity: 28,
                    origin: { y: 0.3 }
                });
            }, 1100);

            let celeb = document.getElementById('celebration');
            if (!celeb) {
                celeb = document.createElement('div');
                celeb.id = 'celebration';
                document.body.appendChild(celeb);
            }

            const name = getUserName();
            // Comma only when a name is present
            const title = name ? `Congratulations, ${name}!` : 'Congratulations!';
            const now = new Date();
            const dateTimeStr = now.toLocaleString(undefined, {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });

            celeb.innerHTML = `
                <div class="congrats-text">${title}</div>
                <div class="cleared-text">You just cleared ${initialWordCount} words!</div>
                <div class="datetime-text">${dateTimeStr}</div>
            `;

            requestAnimationFrame(() => {
                celeb.classList.add('show');
            });

            celeb.onclick = () => {
                celeb.classList.remove('show');
            };
        }

        // ---------- Hotkeys ----------
        function showHotkeyModal() {
            let modal = document.getElementById('hotkey-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'hotkey-modal';
                modal.innerHTML = `
                    <div class="hotkey-box">
                        <h2>Keyboard Shortcuts</h2>
                        <div class="hotkey-row">
                            <span class="hotkey-desc">Shuffle cards</span>
                            <span class="hotkey-key">S</span>
                        </div>
                        <div class="hotkey-row">
                            <span class="hotkey-desc">Toggle Hidden Mode</span>
                            <span class="hotkey-key">H</span>
                        </div>

                        <div class="hotkey-hint">Click anywhere outside or press Esc to close</div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Click outside the box closes it
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) hideHotkeyModal();
                });
            }

            modal.classList.add('show');
        }

        function hideHotkeyModal() {
            const modal = document.getElementById('hotkey-modal');
            if (modal) modal.classList.remove('show');
        }

        document.addEventListener('keydown', (e) => {
            // Ignore if user is typing in an input / select
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                return;
            }

            const key = e.key.toLowerCase();

            if (key === 's') {
                e.preventDefault();
                shuffleCards();
            } else if (key === 'h') {
                e.preventDefault();
                toggleHiddenMode();
            } else if (key === '?' || (e.shiftKey && key === '/')) {
                e.preventDefault();
                showHotkeyModal();
            } else if (key === 'escape') {
                hideHotkeyModal();
                // also close celebration if open
                const celeb = document.getElementById('celebration');
                if (celeb) celeb.classList.remove('show');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const unitSelector = document.getElementById('unitSelector');
            unitSelector.value = unitSelector.options[unitSelector.options.length - 1].value;
            filterTerms();
        });


    </script>
</body>
</html>
