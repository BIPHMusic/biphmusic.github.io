<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Dice</title>
<style>
  :root { color-scheme: dark; --blue:#3b82f6; --deep:#071a3a; --panel:#102b55; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#eff6ff; background:radial-gradient(ellipse at top,#164a91 0%,#0b2852 42%,#06142c 100%);
  }
  main { width:min(100%,520px); text-align:center; padding:clamp(24px,5vw,44px); border:1px solid #7db5ff45;
    border-radius:28px; background:#071a3ac9; box-shadow:0 24px 80px #0005; }
  .eyebrow { margin:0 0 8px; color:#93c5fd; letter-spacing:.18em; text-transform:uppercase; font-size:.75rem; font-weight:800; }
  h1 { margin:0; font-size:clamp(2rem,7vw,3rem); letter-spacing:-.04em; }
  .subtitle { color:#c3d9f8; margin:10px 0 26px; }
  .controls { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
  label { color:#c3d9f8; font-weight:650; }
  select,button { font:inherit; border-radius:12px; padding:11px 15px; border:1px solid #7db5ff70; }
  select { color:white; background:#102b55; }
  .dice-area { min-height:190px; display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; }
  .die { width:112px; height:112px; display:grid; place-items:center; border-radius:24px;
    color:#0b2b5d; background:linear-gradient(145deg,#fff,#dbeafe); font-size:4.4rem; font-weight:850;
    line-height:1; box-shadow:0 12px 0 #8db9ed,0 22px 32px #0005; }
  .die.rolling { animation: tumble .55s ease-in-out; }
  @keyframes tumble { 0%{transform:rotate(0) scale(1)} 35%{transform:rotate(18deg) scale(.88)} 70%{transform:rotate(-14deg) scale(1.06)} 100%{transform:rotate(0) scale(1)} }
  .total { font-size:1rem; font-weight:750; color:#bfdbfe; margin:26px 0 18px; min-height:24px; }
  #roll { width:100%; border:0; cursor:pointer; color:#06214a; font-weight:850; font-size:1.1rem;
    background:linear-gradient(135deg,#93c5fd,#3b82f6); box-shadow:0 6px 0 #1d4ed8; transition:transform .12s,filter .12s; }
  #roll:hover { filter:brightness(1.08); }
  #roll:active { transform:translateY(4px); box-shadow:0 2px 0 #1d4ed8; }
  #roll:focus-visible,select:focus-visible { outline:3px solid white; outline-offset:3px; }
  .hint { margin:18px 0 0; color:#8eadd9; font-size:.83rem; }
  @media(prefers-reduced-motion:reduce){.die.rolling{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">A little luck, in blue</p>
  <h1>Digital Dice</h1>
  <p class="subtitle">Choose your dice and roll!</p>
  <div class="controls">
    <label for="count">Dice</label>
    <select id="count" aria-label="Number of dice">
      <option value="1">1 die</option><option value="2" selected>2 dice</option>
      <option value="3">3 dice</option><option value="4">4 dice</option>
      <option value="5">5 dice</option><option value="6">6 dice</option>
    </select>
  </div>
  <div class="dice-area" id="dice" aria-live="polite" aria-label="Dice results"></div>
  <p class="total" id="total">Total: 7</p>
  <button id="roll" type="button">🎲 Roll Dice</button>
  <p class="hint">Tip: press Space or Enter to roll.</p>
</main>
<script>
  const diceBox = document.querySelector('#dice');
  const countSelect = document.querySelector('#count');
  const totalText = document.querySelector('#total');
  const rollButton = document.querySelector('#roll');
  const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  let values = [3,4];

  function render() {
    diceBox.replaceChildren();
    values.forEach((value, index) => {
      const die = document.createElement('div');
      die.className = 'die';
      die.textContent = faces[value - 1];
      die.setAttribute('role','img');
      die.setAttribute('aria-label', `Die ${index + 1}: ${value}`);
      diceBox.appendChild(die);
    });
    totalText.textContent = `Total: ${values.reduce((sum, n) => sum + n, 0)}`;
  }

  function roll() {
    const count = Number(countSelect.value);
    values = Array.from({length:count}, () => Math.floor(Math.random() * 6) + 1);
    render();
    [...diceBox.children].forEach((die, i) => {
      die.classList.remove('rolling');
      void die.offsetWidth;
      die.classList.add('rolling');
    });
  }
  rollButton.addEventListener('click', roll);
  countSelect.addEventListener('change', roll);
  document.addEventListener('keydown', event => {
    if ((event.code === 'Space' || event.code === 'Enter') &&
        !['BUTTON','SELECT','INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
      event.preventDefault(); roll();
    }
  });
  render();
</script>
</body>
</html>
