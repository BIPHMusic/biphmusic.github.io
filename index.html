<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP Music Theory</title>
    <link rel="icon" href="icons/bg-icon.png">
    <link rel="stylesheet" href="common-styles.css">
    <link rel="preload" href="fonts/Zapfino.ttf" as="font" type="font/ttf" crossorigin="anonymous">
    <script src="apstudents.js"></script>
    <script src="login-screen.js"></script>
    <style>
        /* SHARED STYLES */
        /* Loaded from common-styles.css - Do not duplicate/edit: */
        /* body, h1, .Subtitle, .background, .overlay, .overlay2, .logo */

        body {
            margin: 0;
            padding: 0;
        }

        .banner {
            position: relative;
            width: 100vw;
            height: 300px;
            overflow: hidden;
            z-index: 1;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
        }

        .banner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 2;
        }

        .manuscript-background {
            position: absolute;
            top: 0; 
            left: 50%; 
            width: 100vw; 
            height: auto;
            min-height: 100%;
            transform: translateX(-50%); 
            object-fit: cover;
            opacity: 0.2;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }

        .countdown {
            margin: 20px 0;
            font-size: 18px;
        }

        .zapfino {
            font-family: 'Zapfino', sans-serif; 
            font-size: 1.5em; 
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.322);
        }
        .greeting-text {
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.7);
            white-space: nowrap;   /* keep "Today is …" on a single line */
            font-size: 0.95em;     /* slightly smaller so it fits more easily */
        }

        .days-left {
            font-size: 0.75em;
            opacity: 0.3;
            font-weight: normal;
        }

        #daily-btn {
            font-size: 1.5em;
            padding: 18px 40px;
            background: #2c568e;
            color: white;
            border: 2px solid #3b6cac;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #daily-btn:hover {
            background: #3b6cac;
            border-color: #3680ce;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            box-shadow: 0 0 0 30px white inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

    </style>
</head>
<body>
    <!-- Menu lives OUTSIDE main-content so it can appear on the login screen -->
    <div id="shared-menu"></div>
    <script src="menu.js"></script>          <!-- original full menu.js -->
    <script src="mymenu.js"></script>

    <div id="main-content" style="display: none;">
        <div class="background"></div>
        <div class="overlay"></div>
        <div class="overlay2"></div>

        <div class="banner fade-in" id="banner-section">
            <img src="images/manuscript.png" alt="Manuscript Background" class="manuscript-background">
            <div class="banner-text" id="banner-text"></div>
        </div>

        <div class="container" id="container-section">
            <div class="countdown" id="upcoming-dates">
                <h2 class="fade-in" id="dates-title">Dates of Importance</h2>
                <p class="fade-in" id="mock-exam"><strong>Mock Exam</strong>: February 18th, 2027 <span class="days-left" id="mock-countdown"></span></p>
                <p class="fade-in" id="ap-exam"><strong>AP Exam</strong>: May 10, 2027 <span class="days-left" id="ap-countdown"></span></p>
            </div>
            
            <div style="margin: 30px 0;">
                <button id="daily-btn" class="fade-in" onclick="startDailyExercises()">
                    Start Daily Exercises
                </button>
            </div>
        </div>

        <div class="logo-container">
            <img src="icons/Full Logo White on Transparent.png" alt="BASIS Logo" class="logo">
        </div>
    </div>

    <script>
        // ===== Simple login-only menu =====
        const simpleMenuHTML = `
            <div class="hamburger-menu">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="menu-items" id="simple-menu">
                    <div class="menu-title">BIPH Music</div>
                    <a href="https://biphband.github.io">Back to Homepage</a>
                    <div class="menu-footer">© Garrison Tubbs 2026</div>
                </div>
            </div>
        `;

        // Exact student menu from the real menu.js
        const studentMenuHTML = `
            <div class="hamburger-menu">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle student menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="menu-items student-menu" id="student-menu">
                    <div class="menu-title">BIPH Music</div>
                    <a href="https://biphmusic.github.io/">Home</a>
                    <a href="https://biphmusic.github.io/dailysightsinging/">     • Sight Singing</a>
                    <a href="https://biphmusic.github.io/dailyvocab/">     • Vocab</a>
                    <a href="https://biphmusic.github.io/dailymcqs/">     • MCQs</a>
                    <a href="https://biphmusic.github.io/dailyeartraining/">     • Ear Training</a>
                    <a href="https://biphmusic.github.io/toolbox/">Toolbox</a>
                    <a href="mailto:garrison.tubbs-biph@basischina.com">Contact</a>
                    <div class="menu-footer">© Garrison Tubbs 2026</div>
                </div>
            </div>
        `;

        function showSimpleMenu() {
    const container = document.getElementById('shared-menu');
    if (!container) return;

    // Inject a small style override so the simple menu sits ABOVE the login overlay
    if (!document.getElementById('simple-menu-zfix')) {
        const style = document.createElement('style');
        style.id = 'simple-menu-zfix';
        style.textContent = `
            #shared-menu .hamburger-menu {
                position: fixed !important;   /* fixed so it stays visible */
                top: 20px !important;
                left: 20px !important;
                z-index: 10000 !important;   /* higher than login-screen (9999) */
            }
        `;
        document.head.appendChild(style);
    }

    container.innerHTML = simpleMenuHTML;

    const menuToggle = document.getElementById('menu-toggle');
    const menuItems = document.getElementById('simple-menu');

    function closeMenu() {
        menuToggle.classList.remove('open');
        menuItems.classList.remove('show');
    }

    menuToggle.onclick = function(e) {
        e.stopPropagation();
        const isOpen = menuItems.classList.contains('show');
        if (isOpen) {
            closeMenu();
        } else {
            menuToggle.classList.add('open');
            menuItems.classList.add('show');
        }
    };

    // Close on outside click / Escape
    document.addEventListener('click', function outside(e) {
        if (!menuToggle.contains(e.target) && !menuItems.contains(e.target)) {
            closeMenu();
        }
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeMenu();
    });
}

        function restoreNormalMenu() {
            const container = document.getElementById('shared-menu');
            if (!container) return;
            container.innerHTML = studentMenuHTML;
            // The original menu.js click listener is still attached to the container,
            // so the full student/teacher menu works again.
        }

        // ===== Your original functions =====
        function getGreeting(displayName = "") {
            const now = new Date();
            const hours = now.getHours();
            let greeting = hours < 12 ? "Good morning" : hours < 18 ? "Good afternoon" : "Good evening";

            const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            const dayOfWeek = daysOfWeek[now.getDay()];
            const month = months[now.getMonth()];
            const day = now.getDate();

            return `<span class="zapfino">${greeting}, ${displayName}!</span><br>
                    <span class="greeting-text">Today is ${dayOfWeek}, ${month} ${day}.</span>`;
        }

        // Days-until helper (whole days remaining)
        function daysUntil(year, month, day) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(year, month - 1, day);
            target.setHours(0, 0, 0, 0);
            const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            if (diff > 1) return `(${diff} days)`;
            if (diff === 1) return `(1 day)`;
            if (diff === 0) return `(today!)`;
            return `(passed)`;
        }

        function updateCountdowns() {
            const mockEl = document.getElementById('mock-countdown');
            const apEl   = document.getElementById('ap-countdown');
            if (mockEl) mockEl.textContent = daysUntil(2027, 2, 18);
            if (apEl)   apEl.textContent   = daysUntil(2027, 5, 10);
        }

        window.onSuccessfulLogin = function(displayName) {
            // Switch back to the full menu the moment the user is logged in
            restoreNormalMenu();

            const banner = document.getElementById('banner-section');
            const datesTitle = document.getElementById('dates-title');
            const mockExam = document.getElementById('mock-exam');
            const apExam = document.getElementById('ap-exam');
            const dailyBtn = document.getElementById('daily-btn');
            const logoContainer = document.querySelector('.logo-container');

            setTimeout(() => { if (banner) banner.classList.add('visible'); }, 100);
            setTimeout(() => { if (datesTitle) datesTitle.classList.add('visible'); }, 600);
            setTimeout(() => { if (mockExam) mockExam.classList.add('visible'); }, 900);
            setTimeout(() => { if (apExam) apExam.classList.add('visible'); }, 1200);
            setTimeout(() => { if (dailyBtn) dailyBtn.classList.add('visible'); }, 1600);
            setTimeout(() => { if (logoContainer) logoContainer.classList.add('visible'); }, 1400);

            document.getElementById('banner-text').innerHTML = getGreeting(displayName);
            updateCountdowns();

            if (typeof initMyMenu === 'function') initMyMenu(false);
        };

        function startDailyExercises() {
            const urls = [
                "https://biphmusic.github.io/dailysightsinging/",
                "https://biphmusic.github.io/dailyeartraining/",
                "https://biphmusic.github.io/dailyvocab/"
            ];

            window.location.href = urls[0];

            setTimeout(() => {
                urls.slice(1).forEach(url => {
                    const win = window.open(url, '_blank', 'noopener,noreferrer');
                    if (win) {
                        win.blur();
                        setTimeout(() => window.focus(), 50);
                    }
                });
            }, 150);
        }

        window.onload = () => {
            initLogin();
        };
    </script>
</body>
</html>
