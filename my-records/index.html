<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIPH Music - My Records</title>
    <link rel="icon" href="../icons/bg-icon.png">
    <link rel="stylesheet" href="../common-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../records.js"></script>
    <script src="../apstudents.js"></script>
    <script src="../mymenu.js"></script>

    <style>
        .container { max-width: 920px; margin: 0 auto; }
        #chart-container {
            position: relative;
            height: 500px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        #chart-title {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #222;
        }
        .default-tooltip, .lock-tooltip {
            position: absolute;
            background: rgba(255,255,255,0.97);
            border: 3px solid #4CAF50;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 10000;
            min-width: 160px;
        }
    </style>
</head>
<body>
    <div id="shared-menu"></div>
    <script src="../menu.js"></script>

    <div class="background"></div>
    <div class="overlay"></div>
    <div class="overlay2"></div>

    <h1 class="Title">BIPH Music</h1>
    <h1 class="Subtitle">My Records</h1>

    <div class="container">
        <div id="chart-container">
            <div id="chart-title">My Progress</div>
            <div style="position:relative; height: calc(100% - 60px);">
                <canvas id="progressChart"></canvas>
            </div>
        </div>
    </div>

    <div class="logocontainer">        
        <img src="../icons/Full Logo White on Transparent.png" alt="Logo" class="logo">
    </div>

    <div id="default-tooltip" class="default-tooltip"></div>
    <div id="lock-tooltip" class="lock-tooltip"></div>

    <script>
        let chart;
        let lockedDatasetIndex = null;

        const currentStudent = localStorage.getItem('biph_student_name');
        if (!currentStudent) {
            alert("Please sign in first.");
            window.location.href = "../index.html";
            throw new Error("No student signed in");
        }

        // Filter records for current student
        const myRecords = records.filter(r => 
            r.student.toLowerCase() === currentStudent.toLowerCase()
        );

        const exerciseMap = {
            "Vocab":        { label: "Vocab",        color: "#36A2EB" },
            "Sight Singing":{ label: "Sight Singing",color: "#FF6384" },
            "MCQs":         { label: "MCQs",         color: "#FFCE56" },
            "Ear Training": { label: "Ear Training", color: "#4BC0C0" }
        };

        function groupAndSortData() {
            const grouped = {};
            myRecords.forEach(record => {
                const ex = record.exercise;
                if (!grouped[ex]) grouped[ex] = [];
                grouped[ex].push({
                    percentage: record.percentage,
                    date: record.date,
                    time: record.time,
                    exercise: ex
                });
            });

            // Sort each exercise chronologically
            Object.keys(grouped).forEach(ex => {
                grouped[ex].sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return a.time.localeCompare(b.time);
                });
            });

            return grouped;
        }

        function createChart() {
            const grouped = groupAndSortData();
            const ctx = document.getElementById('progressChart').getContext('2d');

            const datasets = [];

            Object.keys(exerciseMap).forEach(exKey => {
                const dataPoints = grouped[exKey] || [];
                if (dataPoints.length > 0) {
                    datasets.push({
                        label: exerciseMap[exKey].label,
                        data: dataPoints.map(item => item.percentage),
                        borderColor: exerciseMap[exKey].color,
                        borderWidth: 3,
                        tension: 0.25,
                        pointRadius: 4,
                        pointHoverRadius: 8,
                        // Store metadata for tooltip
                        meta: dataPoints
                    });
                }
            });

            // Composite
            const maxAttempts = Math.max(...Object.values(grouped).map(arr => arr.length), 1);
            const compositeData = [];
            for (let i = 0; i < maxAttempts; i++) {
                let sum = 0, count = 0;
                Object.values(grouped).forEach(arr => {
                    if (arr[i]) {
                        sum += arr[i].percentage;
                        count++;
                    }
                });
                compositeData.push(count ? Math.round(sum / count) : null);
            }

            datasets.unshift({
                label: "Composite",
                data: compositeData,
                borderColor: "#2E7D32",
                borderWidth: 4.5,
                borderDash: [3, 2],
                tension: 0.2,
                pointRadius: 5,
                pointHoverRadius: 9,
                meta: null // Composite doesn't have single record
            });

            // Set initial title
            document.getElementById('chart-title').textContent = `My Progress — ${currentStudent}`;

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: maxAttempts}, (_, i) => `Attempt ${i+1}`),
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { stepSize: 20 } }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { enabled: false, external: customTooltip }
                    },
                    onClick: (evt, elements) => {
                        if (elements.length) toggleLockMode(elements[0].datasetIndex);
                        else if (lockedDatasetIndex !== null) disableLockMode();
                    }
                }
            });
        }

        function toggleLockMode(index) {
            if (lockedDatasetIndex === index) disableLockMode();
            else enableLockMode(index);
        }

        function enableLockMode(index) {
            lockedDatasetIndex = index;
            document.getElementById('chart-title').textContent = chart.data.datasets[index].label;
            chart.data.datasets.forEach((ds, i) => {
                ds.borderWidth = (i === index) ? 5 : 1.5;
                ds.borderColor = (i === index) 
                    ? ds.borderColor 
                    : "rgba(180,180,180,0.4)";
            });
            chart.update();
        }

        function disableLockMode() {
            lockedDatasetIndex = null;
            document.getElementById('chart-title').textContent = `My Progress — ${currentStudent}`;
            chart.data.datasets.forEach(ds => {
                if (ds.label === "Composite") ds.borderWidth = 4.5;
                else ds.borderWidth = 3;
            });
            chart.update();
        }

        function customTooltip(ctx) {
            const tooltipEl = lockedDatasetIndex === null 
                ? document.getElementById('default-tooltip')
                : document.getElementById('lock-tooltip');

            if (ctx.tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                return;
            }

            const dataPoint = ctx.tooltip.dataPoints[0];
            const dataset = chart.data.datasets[dataPoint.datasetIndex];
            const index = dataPoint.dataIndex;

            let html = `<strong>${dataset.label}</strong><br>`;

            if (dataset.meta && dataset.meta[index]) {
                const record = dataset.meta[index];
                html += `
                    ${record.date} &nbsp; ${record.time}<br>
                    <strong>${record.percentage}%</strong>
                `;
            } else {
                // Composite
                html += `<strong>${dataPoint.formattedValue}%</strong>`;
            }

            tooltipEl.innerHTML = html;
            tooltipEl.style.opacity = 1;

            const rect = ctx.chart.canvas.getBoundingClientRect();
            tooltipEl.style.left = `${rect.left + ctx.tooltip.caretX + 20}px`;
            tooltipEl.style.top  = `${rect.top + ctx.tooltip.caretY - 40}px`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMyMenu();
            if (myRecords.length > 0) {
                createChart();
            } else {
                document.getElementById('chart-title').innerHTML = 
                    `No records found for <b>${currentStudent}</b>`;
            }
        });
    </script>
</body>
</html>
