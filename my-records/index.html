<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIPH Music - My Records</title>
    <link rel="icon" href="../icons/bg-icon.png">
    <link rel="stylesheet" href="../common-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="../apstudents.js"></script>
    <script src="../records.js"></script> 
    <script src="../login-screen.js"></script>
    <script src="../mymenu.js"></script>

    <style>
        .container { max-width: 920px; margin: 0 auto; }
        #chart-container {
            position: relative;
            height: 450px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        #chart-title {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #222;
        }
    </style>
</head>
<body>

    <div id="main-content" style="display: none;">
        <div id="shared-menu"></div>
        <script src="../menu.js"></script>

        <div class="background"></div>
        <div class="overlay"></div>
        <div class="overlay2"></div>

        <h1 class="Title">BIPH Music</h1>
        <h1 class="Subtitle">My Records</h1>

        <div class="container">
            <div id="chart-container">
                <div id="chart-title">My Progress</div>
                <div style="position:relative; height: calc(100% - 60px);">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </div>

        <div class="logocontainer">        
            <img src="../icons/Full Logo White on Transparent.png" alt="Logo" class="logo">
        </div>
    </div>

    <script>
    let chart;
    let focusedIndex = null;   // null = all visible

    function onSuccessfulLogin(displayName) {
        document.getElementById('main-content').style.display = 'block';
       
        const currentStudent = localStorage.getItem('biph_student_name');
        if (!currentStudent) return;

        const myRecords = records.filter(r =>
            r.student.toLowerCase() === currentStudent.toLowerCase()
        );

        if (myRecords.length > 0) {
            createChart(myRecords, currentStudent);
        } else {
            document.getElementById('chart-title').innerHTML = 
                `No records found for <b>${currentStudent}</b>`;
        }
        
        if (typeof initMyMenu === 'function') initMyMenu(false);
    }

    function getExerciseColor(exercise) {
        const map = {
            "Vocab": "#36A2EB",
            "Sight Singing": "#FF6384",
            "MCQs": "#FFCE56",
            "Ear Training": "#4BC0C0"
        };
        return map[exercise] || "#9966FF";
    }

    function groupAndSortData(myRecords) {
        const grouped = {};
        myRecords.forEach(record => {
            const ex = record.exercise;
            if (!grouped[ex]) grouped[ex] = [];
            grouped[ex].push(record);
        });
        
        Object.keys(grouped).forEach(ex => {
            grouped[ex].sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return a.time.localeCompare(b.time);
            });
        });
        return grouped;
    }

    function createChart(myRecords, currentStudent) {
        const grouped = groupAndSortData(myRecords);
        const ctx = document.getElementById('progressChart').getContext('2d');
        const datasets = [];

        Object.keys(grouped).forEach((ex) => {
            const dataPoints = grouped[ex];
            datasets.push({
                label: ex,
                data: dataPoints.map(item => item.percentage),
                borderColor: getExerciseColor(ex),
                borderWidth: 3,
                tension: 0.25,
                pointRadius: 4,
                pointHoverRadius: 8,
                hidden: false
            });
        });

        const maxAttempts = Math.max(...Object.values(grouped).map(arr => arr.length), 1);

        document.getElementById('chart-title').textContent = `My Progress — ${currentStudent}`;

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: maxAttempts}, (_, i) => `Attempt ${i+1}`),
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 300,           // 0.3s transition
                    easing: 'easeInOutQuart'
                },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        max: 100, 
                        ticks: { stepSize: 20 }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                        onClick: (e, legendItem, legend) => {
                            const index = legendItem.datasetIndex;
                            toggleFocus(index);
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) label += ': ';
                                label += context.parsed.y + '%';
                                return label;
                            }
                        }
                    }
                },
                onClick: (evt, elements) => {
                    if (elements.length) {
                        toggleFocus(elements[0].datasetIndex);
                    } else {
                        // Clicked on empty area → reset
                        resetFocus();
                    }
                }
            }
        });
    }

    // ====================== FOCUS LOGIC ======================
    function toggleFocus(index) {
        if (focusedIndex === index) {
            resetFocus();
        } else {
            focusOn(index);
        }
    }

    function focusOn(index) {
        focusedIndex = index;
        
        chart.data.datasets.forEach((ds, i) => {
            const originalColor = getExerciseColor(ds.label) || ds.borderColor;
            
            if (i === index) {
                ds.hidden = false;
                ds.borderColor = originalColor;           // full opacity
                ds.borderWidth = 5;
                ds.pointRadius = 6;
            } else {
                ds.hidden = false;                        // keep rendered
                ds.borderColor = originalColor + "22";   // very low opacity (fade out)
                ds.borderWidth = 1.5;
                ds.pointRadius = 2;
            }
        });

        document.getElementById('chart-title').textContent = chart.data.datasets[index].label;
        chart.update();
    }

    function resetFocus() {
        focusedIndex = null;
        
        const currentStudent = localStorage.getItem('biph_student_name');
        document.getElementById('chart-title').textContent = `My Progress — ${currentStudent}`;

        chart.data.datasets.forEach(ds => {
            const originalColor = getExerciseColor(ds.label) || ds.borderColor;
            
            ds.hidden = false;
            ds.borderColor = originalColor;   // full opacity
            ds.borderWidth = 3;
            ds.pointRadius = 4;
        });

        chart.update();
    }

    window.onload = () => {
        initLogin();
    };
</script>
</body>
</html>
