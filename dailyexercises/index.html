<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Exercises</title>
<link rel="stylesheet" href="../common-styles.css">
<link rel="preload" href="../fonts/Zapfino.ttf" as="font" type="font/ttf" crossorigin="anonymous">
<link rel="icon" href="../icons/BGicon.png">
<style>

#exercise-stage {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
#exercise-stage > * {
  margin-left: auto;
  margin-right: auto;
}
#exercise-subtitle { text-align:center; }
#exercise-title { margin-bottom: 0; }
.daily-exercise-progress {
  text-align:center;
  margin: 8px auto 20px;
  color: rgba(255,255,255,.78);
  font-size: .95rem;
}
.hidden { display:none !important; }

/* ==================== DAILY ACCESS WINDOW ==================== */
#main-content { position: relative; }

.daily-access-overlay {
  position: fixed;
  inset: 0;
  z-index: 9000;
  overflow: hidden;
  display: block;
  box-sizing: border-box;
  background: rgb(45, 70, 119);
  opacity: 1;
  pointer-events: auto;
  transition: opacity 1s ease;
}

.daily-access-overlay.daily-access-ending {
  opacity: 0;
  pointer-events: none;
}

.daily-access-overlay .background,
.daily-access-overlay .overlay,
.daily-access-overlay .overlay2 {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  pointer-events: none !important;
}

.daily-access-overlay .background { z-index: 0 !important; }
.daily-access-overlay .overlay { z-index: 1 !important; }
.daily-access-overlay .overlay2 { z-index: 2 !important; }

.daily-access-overlay-title,
.daily-access-overlay-subtitle {
  position: fixed !important;
  z-index: 3 !important;
  box-sizing: border-box !important;
  filter: blur(30px) !important;
  opacity: 1 !important;
  margin: 0 !important;
  text-align: center !important;
  pointer-events: none !important;
}

.daily-access-overlay-content {
  position: absolute;
  inset: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  text-align: center;
  color: #fff;
  pointer-events: none;
  box-sizing: border-box;
}

.daily-access-message {
  margin-top: 85px;
  font-size: clamp(1.1rem, 2.5vw, 1.55rem);
  line-height: 1.5;
}

.daily-access-countdown {
  margin-top: 10px;
  transform: translateY(-20px);
  font-size: clamp(1.5rem, 4vw, 2.25rem);
  font-variant-numeric: tabular-nums;
}

.daily-access-overlay-fade-marker {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.daily-exercise-continue {
  display: block;
  margin: 28px auto 0;
}
.daily-review-row {
  cursor: pointer;
  user-select: none;
  transition: background .2s ease;
}
.daily-review-row:hover {
  background: rgba(255,255,255,.06);
}
.daily-review-row:focus-visible {
  outline: 2px solid rgba(255,255,255,.7);
  outline-offset: -2px;
}
.daily-review-row .daily-review-label {
  display: flex;
  align-items: center;
  gap: 9px;
}
.daily-review-arrow {
  display: inline-block;
  width: 14px;
  font-size: .9em;
  line-height: 1;
  transition: transform .2s ease;
}
.daily-review-row.expanded .daily-review-arrow {
  transform: rotate(90deg);
}
.daily-review-content {
  display: none;
  padding: 0 0 4px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.daily-review-content.expanded {
  display: block;
}
.daily-review-item,
.daily-review-empty {
  padding: 12px 0 12px 23px;
  border-top: 1px solid rgba(255,255,255,.1);
}
.daily-review-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.daily-review-item strong {
  font-size: 1rem;
}
.daily-review-item span {
  color: rgba(255,255,255,.78);
  line-height: 1.45;
}
.daily-review-empty {
  color: rgba(255,255,255,.75);
}
.sight-actions {
  justify-content: center;
  margin-top: 20px;
  margin-bottom: 30px;
}

.daily-completed-feedback {
  width: 92%;
  max-width: 850px;
  margin: 35px auto;
  text-align: center;
}
.daily-completed-feedback h2 { margin-bottom: 18px; }
.daily-feedback-score {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 18px;
  margin: 0 auto 20px;
  max-width: 600px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 8px;
  text-align: left;
}
.daily-feedback-review {
  max-width: 700px;
  margin: 20px auto;
  padding: 18px 22px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px;
  text-align: left;
}
.daily-feedback-review h3 { margin-top: 0; text-align: center; }
.daily-feedback-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 11px 0;
  border-top: 1px solid rgba(255,255,255,.1);
}
.daily-feedback-item span { color: rgba(255,255,255,.78); line-height: 1.45; }
.daily-feedback-complete {
  margin: 10px 0 24px;
  font-size: 1.15rem;
  color: rgba(255,255,255,.88);
}
.daily-sight-completed-feedback .action-button { margin-top: 5px; }

.daily-final {
  width: 92%;
  max-width: 850px;
  margin: 35px auto;
  text-align:center;
}
.daily-final h2 { margin-bottom: 8px; }
.daily-score-card {
  margin: 16px 0;
  padding: 0px 20px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 8px;
  text-align:left;
}
.daily-score-row {
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.daily-score-row:last-child { border-bottom:0; }
.daily-final-actions {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  margin-top:24px;
}
.daily-final-actions .copy-button { margin-top:0; min-width:190px; }
.daily-note {
  color:rgba(255,255,255,.72);
  line-height:1.5;
}
.sight-begin-button { margin: 5px auto 18px; display:block; }
.sight-status { min-height:24px; margin: 5px 0 14px; color:rgba(255,255,255,.78); }
#sightCountdown { min-height: 28px; }


/* ==================== NAVIGATION WARNING MODAL ==================== */
#daily-navigation-modal {
  position: fixed;
  inset: 0;
  z-index: 20000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
  background: rgba(0,0,0,.72);
}
#daily-navigation-modal.visible { display: flex; }
.daily-navigation-dialog {
  width: min(92vw, 500px);
  box-sizing: border-box;
  padding: 28px 30px 24px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 12px;
  background: rgba(35,55,95,.98);
  color: #fff;
  text-align: center;
  box-shadow: 0 20px 70px rgba(0,0,0,.45);
}
.daily-navigation-dialog h2 {
  margin: 0 0 12px;
  font-size: 1.35rem;
}
.daily-navigation-dialog p {
  margin: 0;
  line-height: 1.55;
  color: rgba(255,255,255,.86);
}
.daily-navigation-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 24px;
  flex-wrap: wrap;
}
.daily-navigation-actions button {
  min-width: 130px;
  padding: 10px 18px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,.3);
  color: #fff;
  background: rgba(255,255,255,.14);
  cursor: pointer;
  font-size: 1rem;
}
.daily-navigation-actions button:hover {
  background: rgba(255,255,255,.25);
}
.daily-navigation-actions .daily-navigation-leave {
  background: rgba(244,67,54,.72);
}
.daily-navigation-actions .daily-navigation-leave:hover {
  background: rgba(244,67,54,.9);
}
</style>
<style id="exercise-style"></style>
</head>
<body>
<div id="shared-menu"></div>

<div id="daily-navigation-modal" aria-hidden="true">
  <div class="daily-navigation-dialog" role="dialog" aria-modal="true"
       aria-labelledby="daily-navigation-title" aria-describedby="daily-navigation-message">
    <h2 id="daily-navigation-title">Leave Daily Exercises?</h2>
    <p id="daily-navigation-message">If you leave this page, your current progress may be lost.</p>
    <div class="daily-navigation-actions">
      <button type="button" id="dailyNavigationStay">Stay</button>
      <button type="button" id="dailyNavigationLeave" class="daily-navigation-leave">Leave</button>
    </div>
  </div>
</div>
<div id="main-content" style="display:none;">
  <div class="background"></div>
  <div class="overlay"></div>
  <div class="overlay2"></div>
  <h1 class="Title" id="exercise-title">BIPH Music</h1>
  <h1 class="Subtitle" id="exercise-subtitle" style="margin-top: 10px;">Daily Exercises</h1>
  <div id="exercise-stage"></div>
  <div class="logocontainer">
    <img src="../icons/Full Logo White on Transparent.png" alt="BASIS Logo" class="logo">
  </div>
</div>

<script src="../apstudents.js"></script>
<script src="../login-screen.js"></script>
<script src="../menu.js"></script>
<script src="../mymenu.js"></script>
<script src="vocab.js"></script>
<script src="../dailyeartraining/quiz-intervals-all.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js"></script>


<script>
window.dailyExerciseState = {
  active: null,
  student: '',
  order: [],
  index: 0,
  results: {},
  sightRecording: null,
  sightExample: null,
  sessionReady: false,
  waitingForAdvance: false

let dailyAccessTimer = null;

/* ==================== IN-PAGE NAVIGATION / LEAVE PROTECTION ==================== */
let dailyNavigationAllowPop = false;
let dailyNavigationAllowUnload = false;
let dailyNavigationModalOpen = false;
let dailyNavigationPendingAction = null;
let dailyNavigationHistoryInitialized = false;

function dailyShouldWarnOnLeave() {
  const s = window.dailyExerciseState;
  return !!(s && s.student && s.sessionReady);
}

function dailyShowNavigationModal(pendingAction) {
  const modal = document.getElementById('daily-navigation-modal');
  if (!modal) return;
  dailyNavigationPendingAction = pendingAction || null;
  dailyNavigationModalOpen = true;
  modal.classList.add('visible');
  modal.setAttribute('aria-hidden', 'false');
  document.getElementById('dailyNavigationStay')?.focus();
}

function dailyHideNavigationModal() {
  const modal = document.getElementById('daily-navigation-modal');
  if (!modal) return;
  dailyNavigationModalOpen = false;
  dailyNavigationPendingAction = null;
  modal.classList.remove('visible');
  modal.setAttribute('aria-hidden', 'true');
}

function dailyConfirmNavigationAway() {
  const action = dailyNavigationPendingAction;
  dailyHideNavigationModal();

  if (typeof dailyStopSightRecordingForNavigation === 'function') {
    dailyStopSightRecordingForNavigation();
  }

  dailyNavigationAllowUnload = true;

  if (typeof action === 'function') {
    action();
  }
}

function dailyInitializeNavigationHistory() {
  if (dailyNavigationHistoryInitialized) return;
  dailyNavigationHistoryInitialized = true;

  const s = window.dailyExerciseState;
  const current = history.state;
  history.replaceState(
    { ...(current || {}), dailyExercises: true, dailyExerciseIndex: 0, dailyExerciseRoot: true },
    '',
    location.href
  );
}

function dailyPushExerciseHistory(index) {
  dailyInitializeNavigationHistory();
  history.pushState(
    { dailyExercises: true, dailyExerciseIndex: index },
    '',
    location.href
  );
}

function dailyHandlePopState(e) {
  const s = window.dailyExerciseState;
  if (!dailyShouldWarnOnLeave()) return;

  if (dailyNavigationAllowPop) {
    dailyNavigationAllowPop = false;
    return;
  }

  const state = e.state;

  if (state && state.dailyExercises && Number.isInteger(state.dailyExerciseIndex)) {
    const targetIndex = state.dailyExerciseIndex;

    if (targetIndex >= 0 && targetIndex < s.order.length) {
      if (targetIndex === s.index) return;
      if (typeof dailyStopSightRecordingForNavigation === 'function') {
        dailyStopSightRecordingForNavigation();
      }
      s.index = targetIndex;
      dailyShowExercise(s.order[targetIndex], true);
      return;
    }
  }

  // The browser has reached a page outside this Daily Exercises session.
  // Put the current session entry back, then ask using our own modal.
  history.pushState(
    { dailyExercises: true, dailyExerciseIndex: s.index },
    '',
    location.href
  );

  dailyShowNavigationModal(() => {
    dailyNavigationAllowPop = true;
    history.back();
  });
}

window.addEventListener('popstate', dailyHandlePopState);

window.addEventListener('beforeunload', e => {
  // Browsers intentionally require their own native beforeunload UI here.
  // This is the only reliable browser-level protection for refresh/close/tab/window exit.
  if (dailyNavigationAllowUnload || !dailyShouldWarnOnLeave()) return;
  e.preventDefault();
  e.returnValue = '';
});

document.addEventListener('click', e => {
  if (!dailyShouldWarnOnLeave() || dailyNavigationModalOpen) return;

  const anchor = e.target.closest?.('a[href]');
  if (!anchor) return;

  // Do not hijack modified clicks, downloads, hash-only links, or new-tab behavior.
  if (
    e.defaultPrevented ||
    e.button !== 0 ||
    e.metaKey ||
    e.ctrlKey ||
    e.shiftKey ||
    e.altKey ||
    anchor.target === '_blank' ||
    anchor.hasAttribute('download')
  ) return;

  const href = anchor.href;
  if (!href || href === location.href) return;

  e.preventDefault();
  dailyShowNavigationModal(() => {
    window.location.href = href;
  });
}, true);

document.addEventListener('keydown', e => {
  if (!dailyShouldWarnOnLeave() || dailyNavigationModalOpen) return;

  // Browser back/forward shortcuts. The actual history movement is handled by popstate.
  const isBack =
    (e.metaKey && e.key === '[') ||
    (e.ctrlKey && e.key === '[') ||
    (e.altKey && e.key === 'ArrowLeft');

  if (isBack) {
    // Let the browser generate popstate. We do not call preventDefault here because
    // some browsers will otherwise suppress the history traversal entirely.
    return;
  }

  // Prevent common forward shortcuts from bypassing the virtual exercise history.
  const isForward =
    (e.metaKey && e.key === ']') ||
    (e.ctrlKey && e.key === ']') ||
    (e.altKey && e.key === 'ArrowRight');

  if (isForward) return;
}, true);


document.addEventListener('keydown', e => {
  if (!dailyNavigationModalOpen) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    dailyHideNavigationModal();
  }
});
document.addEventListener('DOMContentLoaded', () => {
  const stay = document.getElementById('dailyNavigationStay');
  const leave = document.getElementById('dailyNavigationLeave');

  stay?.addEventListener('click', dailyHideNavigationModal);
  leave?.addEventListener('click', dailyConfirmNavigationAway);

  document.getElementById('daily-navigation-modal')?.addEventListener('click', e => {
    if (e.target.id === 'daily-navigation-modal') dailyHideNavigationModal();
  });
});


function dailyGetAccessState(now = new Date()) {
  const minutes = now.getHours() * 60 + now.getMinutes();
  const startMinutes = 10 * 60 + 40;
  const endMinutes = 11 * 60 + 35;

  if (minutes >= startMinutes && minutes < endMinutes) {
    return { allowed: true, target: null, label: '' };
  }

  const target = new Date(now);
  if (minutes >= endMinutes) {
    target.setDate(target.getDate() + 1);
  }
  target.setHours(10, 40, 0, 0);

  return {
    allowed: false,
    target,
    label: minutes < startMinutes ? "Today's exercises will be available in" : "Tomorrow's exercises will be available in"
  };
}

function dailyFormatCountdown(milliseconds) {
  const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return `${hours}h ${minutes}m ${seconds}s`;
}

function dailyEnsureMenuAboveAccessBlocker() {
  const sharedMenu = document.getElementById('shared-menu');
  if (sharedMenu) {
    sharedMenu.style.position = sharedMenu.style.position || 'relative';
    sharedMenu.style.zIndex = '10000';
  }

  document.querySelectorAll('[id*="menu"], [class*="menu"], [id*="hamburger"], [class*="hamburger"]').forEach(el => {
    if (el !== document.getElementById('main-content')) {
      el.style.zIndex = '10000';
    }
  });
}

function dailyPositionAccessOverlayTitles() {
  const pairs = [
    ['#exercise-title', '.daily-access-overlay-title'],
    ['#exercise-subtitle', '.daily-access-overlay-subtitle']
  ];

  pairs.forEach(([sourceSelector, cloneSelector]) => {
    const source = document.querySelector(sourceSelector);
    const clone = document.querySelector(cloneSelector);
    if (!source || !clone) return;

    const rect = source.getBoundingClientRect();
    clone.style.left = `${rect.left}px`;
    clone.style.top = `${rect.top}px`;
    clone.style.width = `${rect.width}px`;
  });
}

function dailyCreateAccessOverlay(accessState) {
  let overlay = document.getElementById('daily-access-overlay');
  if (overlay) return overlay;

  overlay = document.createElement('div');
  overlay.id = 'daily-access-overlay';
  overlay.className = 'daily-access-overlay';

  const sourceBackground = document.querySelector('#main-content .background');
  const sourceOverlay = document.querySelector('#main-content .overlay');
  const sourceOverlay2 = document.querySelector('#main-content .overlay2');
  const sourceTitle = document.querySelector('#exercise-title');
  const sourceSubtitle = document.querySelector('#exercise-subtitle');

  if (sourceBackground) {
    const clone = sourceBackground.cloneNode(true);
    clone.removeAttribute('id');
    overlay.appendChild(clone);
  }

  if (sourceOverlay) {
    const clone = sourceOverlay.cloneNode(true);
    clone.removeAttribute('id');
    overlay.appendChild(clone);
  }

  if (sourceOverlay2) {
    const clone = sourceOverlay2.cloneNode(true);
    clone.removeAttribute('id');
    overlay.appendChild(clone);
  }

  const content = document.createElement('div');
  content.className = 'daily-access-overlay-content';

  if (sourceTitle) {
    const title = sourceTitle.cloneNode(true);
    title.removeAttribute('id');
    title.classList.add('daily-access-overlay-title');
    title.textContent = 'BIPH Music';
    overlay.appendChild(title);
  }

  if (sourceSubtitle) {
    const subtitle = sourceSubtitle.cloneNode(true);
    subtitle.removeAttribute('id');
    subtitle.classList.add('daily-access-overlay-subtitle');
    subtitle.textContent = 'Daily Exercises';
    overlay.appendChild(subtitle);
  }

  const message = document.createElement('div');
  message.className = 'daily-access-message';
  message.innerHTML = `
    <div class="daily-access-label"></div>
    <div class="daily-access-countdown"></div>`;
  content.appendChild(message);

  overlay.appendChild(content);
  document.body.appendChild(overlay);

  dailyPositionAccessOverlayTitles();
  dailyEnsureMenuAboveAccessBlocker();
  dailyUpdateAccessOverlay(accessState);
  return overlay;
}

function dailyUpdateAccessOverlay(accessState) {
  const overlay = document.getElementById('daily-access-overlay');
  if (!overlay || accessState.allowed) return;

  const label = overlay.querySelector('.daily-access-label');
  const countdown = overlay.querySelector('.daily-access-countdown');

  if (label) label.textContent = accessState.label;
  if (countdown) {
    countdown.textContent = dailyFormatCountdown(accessState.target - new Date());
  }
}

window.addEventListener('resize', () => {
  if (document.getElementById('daily-access-overlay')) {
    dailyPositionAccessOverlayTitles();
  }
});

function dailyStartAccessOverlayFade() {
  const overlay = document.getElementById('daily-access-overlay');
  if (!overlay || overlay.classList.contains('daily-access-ending')) return;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      overlay.classList.add('daily-access-ending');
    });
  });

  setTimeout(() => {
    document.getElementById('daily-access-overlay')?.remove();
  }, 3000);
}

function dailyRemoveAccessBlocker() {
  document.getElementById('daily-access-blocker')?.remove();
  document.getElementById('daily-access-overlay')?.remove();
}

function dailyShowAccessBlocker(accessState) {
  dailyCreateAccessOverlay(accessState);
  dailyUpdateAccessOverlay(accessState);
}

function dailyPrepareExercisesForAccessWindow() {
  const state = window.dailyExerciseState;
  if (state.sessionReady) return;

  state.sessionReady = true;
  state.waitingForAdvance = false;
  state.order = dailyShuffle(['vocab','earTraining','sightSinging']);
  state.index = 0;
  state.results = {};
  state.sightRecording = null;
  state.sightExample = null;

  dailyInitializeNavigationHistory();
  dailyPushExerciseHistory(state.index);
  dailyShowExercise(state.order[state.index]);
}

function dailyBeginExercisesAfterAccessWindow() {
  const state = window.dailyExerciseState;

  if (!state.sessionReady) {
    dailyPrepareExercisesForAccessWindow();
  }

  dailyStartAccessOverlayFade();
}


function dailyUpdateAccessWindow() {
  const state = window.dailyExerciseState;
  if (!state.student) return;

  const accessState = dailyGetAccessState();

  if (accessState.allowed) {
    // Once 10:40 has actually arrived, prepare the exercises exactly once
    // and begin the fade. Do NOT continue updating the countdown overlay.
    if (!state.sessionReady) {
      dailyPrepareExercisesForAccessWindow();
    } else {
      dailyStartAccessOverlayFade();
    }

    return;
  }

  // Before 10:40, keep showing the countdown.
  // Do not prepare the exercises early and do not begin the fade early.
  dailyShowAccessBlocker(accessState);
}


function dailyStartAccessWindowWatcher() {
  if (dailyAccessTimer) clearInterval(dailyAccessTimer);
  dailyUpdateAccessWindow();
  dailyAccessTimer = setInterval(dailyUpdateAccessWindow, 50);
}

function dailyShuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function dailySetProgress() {}

function dailyShowExercise(type, fromHistory = false) {
  const state = window.dailyExerciseState;

  state.active = type;
  state.waitingForAdvance = false;

  document.getElementById('exercise-stage').innerHTML = '';
  document.getElementById('exercise-style').textContent = DAILY_EXERCISE_STYLES[type] || '';
  document.getElementById('exercise-subtitle').textContent =
    type === 'vocab' ? 'Daily Vocab' :
    type === 'earTraining' ? 'Daily Ear Training' :
    'Daily Sight Singing';

  // Going backward through browser history should show the completed exercise
  // feedback rather than generating a brand-new quiz.
  if (fromHistory && state.results[type]) {
    if (type === 'sightSinging') {
      dailyShowCompletedSightSinging();
    } else {
      dailyShowCompletedExerciseFeedback(type, state.results[type]);
    }
    window.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }

  document.getElementById('exercise-stage').innerHTML = DAILY_EXERCISE_TEMPLATES[type];

  if (type === 'vocab') {
    dailyVocabStudent = state.student.toLowerCase();
    dailyVocabQuestionBank[dailyVocabStudent] = dailyVocabGenerateQuestionSet(dailyVocabStudent);
    dailyVocabInitializeQuiz();

    const actions = document.querySelector('.quiz-actions');
    if (actions) actions.classList.remove('hidden');

    const actionButton = document.querySelector('.quiz-actions .action-button');
    if (actionButton) actionButton.textContent = 'Next exercise';
  } else if (type === 'earTraining') {
    dailyEarStudent = state.student;
    dailyEarInitQuiz();
  } else {
    dailyInitSightSinging();

    const button = document.getElementById('sightNextButton');
    if (button) {
      button.textContent = 'Next exercise';
      button.onclick = dailyAdvanceExercise;
    }
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function dailyEscapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function dailyShowCompletedExerciseFeedback(type, resultData) {
  const title = type === 'vocab' ? 'Vocab Complete' : 'Ear Training Complete';
  const score = Number(resultData?.percentage ?? 0);
  const answers = Array.isArray(resultData?.answers) ? resultData.answers : [];
  const correctAnswers = Array.isArray(resultData?.questionSet?.answers)
    ? resultData.questionSet.answers
    : Array.isArray(resultData?.questionSet?.correctAnswers)
      ? resultData.questionSet.correctAnswers
      : [];

  const correctCount = correctAnswers.reduce((count, correct, i) => {
    const answer = answers[i] || '';
    return count + (answer && String(answer).toLowerCase() === String(correct).toLowerCase() ? 1 : 0);
  }, 0);
  const total = correctAnswers.length || answers.length;

  let reviewHtml = '';

  if (type === 'vocab') {
    const reviewItems = Array.isArray(resultData?.termsToReview)
      ? resultData.termsToReview
      : [];

    reviewHtml = reviewItems.length
      ? `
        <div class="daily-feedback-review">
          <h3>Words to Review</h3>
          ${reviewItems.map(item => `
            <div class="daily-feedback-item">
              <strong>${dailyEscapeHtml(item.term)}</strong>
              <span>${dailyEscapeHtml(item.definition || 'Definition not found')}</span>
            </div>
          `).join('')}
        </div>`
      : `<div class="daily-feedback-review"><h3>Words to Review</h3><p class="daily-note">Perfect! No words to review.</p></div>`;
  } else {
    const reviewItems = Array.isArray(resultData?.termsToReview)
      ? resultData.termsToReview
      : [];

    reviewHtml = reviewItems.length
      ? `
        <div class="daily-feedback-review">
          <h3>Things to Review</h3>
          ${reviewItems.map(item => `
            <div class="daily-feedback-item">
              <strong>${dailyEscapeHtml(item.correct || item.item)}</strong>
            </div>
          `).join('')}
        </div>`
      : `<div class="daily-feedback-review"><h3>Things to Review</h3><p class="daily-note">Perfect! No intervals to review.</p></div>`;
  }

  document.getElementById('exercise-stage').innerHTML = `
    <div class="daily-completed-feedback">
      <h2>${title}</h2>
      <div class="daily-feedback-score">
        <span>Score</span>
        <strong>${correctCount}/${total} (${score}%)</strong>
      </div>
      ${reviewHtml}
    </div>`;
}

function dailyShowCompletedSightSinging() {
  document.getElementById('exercise-stage').innerHTML = `
    <div class="daily-completed-feedback daily-sight-completed-feedback">
      <h2>Sight Singing</h2>
      <p class="daily-feedback-complete">Recording complete.</p>
      <button class="action-button" type="button" id="completedSightNextButton">Next exercise</button>
    </div>`;

  const button = document.getElementById('completedSightNextButton');
  if (button) button.onclick = dailyAdvanceExercise;
  window.dailyExerciseState.waitingForAdvance = true;
}

function dailyCompleteExercise(type, resultData) {
  const state = window.dailyExerciseState;
  if (state.results[type]) return;

  if (type === 'vocab') {
    const correct = (resultData.answers || []).filter((answer, i) =>
      answer && resultData.questionSet?.answers?.[i] &&
      answer.toLowerCase() === resultData.questionSet.answers[i].toLowerCase()
    ).length;
    const total = resultData.questionSet?.answers?.length || resultData.answers?.length || 0;
    resultData.percentage = total ? Math.round(correct / total * 100) : 0;
    resultData.exercise = 'Vocab';
  }

  state.results[type] = resultData;

  if (type === 'sightSinging') {
    state.waitingForAdvance = true;

    const button = document.getElementById('sightNextButton');
    if (button) {
      button.textContent = state.index === state.order.length - 1 ? 'Submit' : 'Next exercise';
      button.onclick = dailyAdvanceExercise;
    }

    const actions = document.querySelector('.sight-actions');
    if (actions) actions.classList.remove('hidden');

    return;
  }

  state.index++;

  if (state.index < state.order.length) {
    dailyPushExerciseHistory(state.index);
    dailyShowExercise(state.order[state.index]);
  } else {
    dailyShowFinalScreen();
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
}

function dailyAdvanceExercise() {
  const state = window.dailyExerciseState;
  if (!state.waitingForAdvance) return;

  state.waitingForAdvance = false;
  state.index++;

  if (state.index < state.order.length) {
    dailyPushExerciseHistory(state.index);
    dailyShowExercise(state.order[state.index]);
  } else {
    dailyShowFinalScreen();
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
}

  };

  const button = document.getElementById('sightNextButton');

}

function dailyMakeExportData() {

function dailyBuildIncorrectDetails(results) {
  let vocabContent = '';
  let earContent = '';

  const vocab = results.vocab;
  if (vocab?.questionSet?.answers) {
    const wrongTerms = [];

    vocab.questionSet.answers.forEach((correct, i) => {
      const answer = vocab.answers?.[i] || '';
      if (answer.toLowerCase() !== correct.toLowerCase()) {
        wrongTerms.push(correct);
      }
    });

    const uniqueTerms = [...new Set(wrongTerms)];
    const reviewItems = uniqueTerms
      .map(term => ({
        term,
        definition: vocabularyTerms.find(v => v.Term === term)?.Definition || 'Definition not found'
      }))
      .sort((a, b) => a.term.localeCompare(b.term));

    vocabContent = reviewItems.length ? `
      <div class="daily-review-heading">Terms to Review:</div>
      ${reviewItems.map(item => `
        <div class="daily-review-item">
          <strong>${item.term}</strong>
          <span>${item.definition}</span>
        </div>
      `).join('')}
    ` : `
      <div class="daily-review-empty">Perfect! No Vocab terms to review.</div>
    `;
  }

  const ear = results.earTraining;
  if (ear?.questionSet?.correctAnswers) {
    const missedAnswers = [];

    ear.questionSet.correctAnswers.forEach((correct, i) => {
      const answer = ear.answers?.[i] || '';
      if (answer.toLowerCase() !== correct.toLowerCase()) {
        missedAnswers.push(correct);
      }
    });

    const uniqueMissedAnswers = [...new Set(missedAnswers)]
      .sort((a, b) => a.localeCompare(b));

    earContent = uniqueMissedAnswers.length ? `
      <div class="daily-review-heading">Ear Training to Review</div>
      ${uniqueMissedAnswers.map(answer => `
        <div class="daily-review-item">
          <strong>${answer}</strong>
        </div>
      `).join('')}
    ` : `
      <div class="daily-review-empty">Perfect! No Ear Training items to review.</div>
    `;
  }

  return { vocabContent, earContent };
}

<script>

// Unicode-safe base64 encoding and decoding functions
function unicodeToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    const binary = Array.from(
        utf8Bytes,
        byte => String.fromCharCode(byte)
    ).join('');
    return btoa(binary);
}

function base64ToUnicode(base64) {
    const binary = atob(base64);
    const bytes = Uint8Array.from(
        binary,
        char => char.charCodeAt(0)
    );
    return new TextDecoder().decode(bytes);
}

function unscrambleTerms(scrambledArray) {
    function unshiftString(str, shift) {
        return str.split('').map(char => {
            if (char.match(/[a-zA-Z]/)) {
                const code = char.charCodeAt(0);
                const base = char >= 'a' ? 97 : 65;

                return String.fromCharCode(
                    (code - base - shift + 26) % 26 + base
                );
            }

            return char;
        }).join('');
    }

    return scrambledArray.map(item => {
        const decodedTerm = base64ToUnicode(item.Term);
        const decodedDef = base64ToUnicode(item.Definition);

        return {
            Term: unshiftString(decodedTerm, 3),
            Definition: unshiftString(decodedDef, 3)
        };
    });
}

const vocabularyTerms = unscrambleTerms(scrambledVocabularyTerms);

// Use apStudents from apstudents.js
let dailyVocabApprovedStudents =
    typeof apStudents !== 'undefined' ? apStudents : [];

let dailyVocabStudent = '';
let dailyVocabQuestionBank = {};
let answers = [];
let usedTerms = {};

let selectedQuestion = null;
let selectedWord = null;


// ==================== INITIAL PAGE LOAD ====================

function dailyVocabCapitalizeName(name) {
    return name.trim().split(' ').map(
        w =>
            w.charAt(0).toUpperCase() +
            w.slice(1).toLowerCase()
    ).join(' ');
}


function dailyVocabGenerateQuestionSet(student) {
    const shuffledQuestions =
        [...vocabularyTerms]
            .sort(() => Math.random() - 0.5)
            .slice(0, 10);

    const sortedTerms =
        [...shuffledQuestions.map(q => q.Term)]
            .sort((a, b) => a.localeCompare(b));

    return {
        questions: shuffledQuestions,
        terms: sortedTerms,
        answers: shuffledQuestions.map(q => q.Term)
    };
}


// ==================== QUESTION SELECTION ====================

function selectQuestion(index, focusInput = true) {
    clearSelections();

    selectedQuestion = index;
    lastSelectedIndex = index;

    const qBox = document.querySelectorAll('.question-box')[index];
    const input = document.getElementById(`answer-${index}`);

    if (qBox) {
        // Clicking the question itself highlights it.
        qBox.classList.add('selected');

        const rect = qBox.getBoundingClientRect();

        // The questions column has its own scroll position.
        // Do not scroll the page when a question is selected.
        scrollQuestionToBox(qBox);
    }

    if (focusInput && input) {
        // Remember that the textbox is being focused
        // because the question box was clicked.
        input.dataset.focusFromQuestion = 'true';

        input.focus();

        input.setSelectionRange(
            input.value.length,
            input.value.length
        );

        updateInputWidth(input);
        updateTypingHighlights(input);
    }
}


function selectWord(index) {
    const buttons =
        Array.from(
            document.querySelectorAll('.word-bank button')
        );

    if (!buttons[index]) return;

    buttons.forEach(b =>
        b.classList.remove(
            'selected',
            'keyboard-highlight'
        )
    );

    selectedWord = index;

    buttons[index].classList.add(
        'selected',
        'keyboard-highlight'
    );

    // Scroll only the word-bank column, never the page.
    scrollWordBankToButton(
        buttons[index],
        'smooth'
    );
}


function clearSelections() {
    document.querySelectorAll('.question-box')
        .forEach(q =>
            q.classList.remove('selected')
        );

    document.querySelectorAll('.word-bank button')
        .forEach(b =>
            b.classList.remove(
                'selected',
                'keyboard-highlight'
            )
        );

    selectedQuestion = null;
    selectedWord = null;
}


// ==================== MATCHING WORDS ====================

function makeMatch(qIndex, wIndex) {
    const input = document.getElementById(`answer-${qIndex}`);
    const term = dailyVocabQuestionBank[dailyVocabStudent]?.terms?.[wIndex];

    if (!input || !term) return;

    input.value = term;
    input.dataset.committed = term;

    input.classList.remove('invalid-input');

    updateInputWidth(input);

    lastSelectedIndex = qIndex;

    updateAllAnswerStates();

    resetWordBankScrollFreedom();

    clearSelections();

    const qBox = input.closest('.question-box');
    if (qBox) {
        qBox.classList.remove('selected');
    }
}


// ==================== COMMIT TYPED ANSWER ====================

function commitTypedAnswer(index) {
    const input =
        document.getElementById(`answer-${index}`);

    if (!input) return false;

    const typed = input.value.trim();

    const terms =
        dailyVocabQuestionBank[dailyVocabStudent]?.terms || [];

    const exactMatch = terms.find(
        term =>
            term.toLowerCase() ===
            typed.toLowerCase()
    );

    const prefixMatches = terms.filter(
        term =>
            !usedTerms[term.toLowerCase()] &&
            term.toLowerCase()
                .startsWith(typed.toLowerCase())
    );

    const term =
        exactMatch ||
        (
            prefixMatches.length === 1
                ? prefixMatches[0]
                : null
        );

    if (!term) {
        // Empty input should never be red.
        // Non-empty invalid input should be red.
        if (typed) {
            input.classList.add('invalid-input');
        } else {
            input.classList.remove('invalid-input');
        }

        return false;
    }

    input.value = term;
    input.dataset.committed = term;

    input.classList.remove('invalid-input');

    updateInputWidth(input);

    lastSelectedIndex = index;

    updateAllAnswerStates();

    // Clear selection but KEEP TEXTBOX FOCUSED.
    clearSelections();

    input.focus();

    input.setSelectionRange(
        input.value.length,
        input.value.length
    );

    updateWordBank('');

    return true;
}


// ==================== CLEAR ANSWER ====================

function clearAnswer(index) {
    const input =
        document.getElementById(`answer-${index}`);

    if (!input) return;

    input.value = '';

    delete input.dataset.committed;

    input.classList.remove(
        'invalid-input',
        'duplicate-input'
    );

    updateInputWidth(input);
    updateAllAnswerStates();
    updateWordBank('');
}


// ==================== INPUT WIDTH ====================

function updateInputWidth(input) {
    const canvas =
        updateInputWidth.canvas ||
        (
            updateInputWidth.canvas =
            document.createElement('canvas')
        );

    const ctx = canvas.getContext('2d');

    if (!ctx) return;

    const style = getComputedStyle(input);

    ctx.font =
        `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;

    const textWidth =
        ctx.measureText(input.value || '').width;

    input.style.width =
        `${Math.max(120, Math.ceil(textWidth))}px`;
}


// ==================== ANSWER STATES ====================

function updateAllAnswerStates() {
    const inputs =
        Array.from(
            document.querySelectorAll('.answer-input')
        );

    const buttons =
        Array.from(
            document.querySelectorAll('.word-bank button')
        );

    const terms =
        dailyVocabQuestionBank[dailyVocabStudent]?.terms || [];

    inputs.forEach(input => {
        input.classList.remove('duplicate-input');
    });

    buttons.forEach(button => {
        button.classList.remove(
            'used',
            'duplicate',
            'possible',
            'filtered-out',
            'selected',
            'keyboard-highlight'
        );

        button.style.opacity = '1';
        button.style.backgroundColor =
            'rgba(255, 255, 255, 0.1)';
        button.style.color = 'white';
    });

    const usedCounts = {};

    inputs.forEach((input, idx) => {
        const committed =
            input.dataset.committed;

        if (!committed) return;

        const key =
            committed.toLowerCase();

        if (!usedCounts[key]) {
            usedCounts[key] = [];
        }

        usedCounts[key].push(idx);
    });

    Object.entries(usedCounts).forEach(
        ([key, positions]) => {
            const termIndex =
                terms.findIndex(
                    term =>
                        term.toLowerCase() === key
                );

            const button =
                termIndex >= 0
                    ? buttons[termIndex]
                    : null;

            if (positions.length > 1) {
                positions.forEach(position => {
                    inputs[position]
                        .classList.add(
                            'duplicate-input'
                        );
                });

                if (button) {
                    button.classList.add('duplicate');
                    button.style.opacity = '1';
                }

            } else if (button) {
                button.classList.add('used');
                button.style.opacity = '0.4';
            }
        }
    );

    answers =
        inputs.map(
            input =>
                input.dataset.committed || ''
        );

    usedTerms = {};

    answers.forEach((answer, idx) => {
        if (!answer) return;

        const key =
            answer.toLowerCase();

        if (!usedTerms[key]) {
            usedTerms[key] = [];
        }

        usedTerms[key].push(idx + 1);
    });
}


// ==================== WORD BANK SCROLLING ====================


function scrollQuestionToBox(box, behavior = 'smooth') {
    const container =
        document.querySelector('.questions-container');

    if (!container || !box) return;

    const containerRect =
        container.getBoundingClientRect();

    const boxRect =
        box.getBoundingClientRect();

    const padding = 10;

    if (boxRect.top < containerRect.top + padding) {
        container.scrollBy({
            top:
                boxRect.top -
                containerRect.top -
                padding,
            behavior
        });

    } else if (
        boxRect.bottom >
        containerRect.bottom - padding
    ) {
        container.scrollBy({
            top:
                boxRect.bottom -
                containerRect.bottom +
                padding,
            behavior
        });
    }
}


function scrollWordBankToButton(button, behavior = 'smooth') {
    const container =
        document.querySelector('.word-bank-container');

    if (!container || !button) return;

    const containerRect =
        container.getBoundingClientRect();

    const buttonRect =
        button.getBoundingClientRect();

    const padding = 10;

    if (buttonRect.top < containerRect.top + padding) {
        container.scrollBy({
            top:
                buttonRect.top -
                containerRect.top -
                padding,
            behavior
        });

    } else if (
        buttonRect.bottom >
        containerRect.bottom - padding
    ) {
        container.scrollBy({
            top:
                buttonRect.bottom -
                containerRect.bottom +
                padding,
            behavior
        });
    }
}

function resetWordBankScrollFreedom() {
    const container = document.querySelector('.word-bank-container');
    const bank = document.getElementById('word-bank');

    if (!container || !bank) return;

    if (container._wordBankScrollAnimation) {
        cancelAnimationFrame(container._wordBankScrollAnimation);
        container._wordBankScrollAnimation = null;
    }

    container.scrollTop = 0;
    container.classList.remove('word-bank-scroll-expanded');
    bank.style.removeProperty('--word-bank-spacer-top');
    bank.style.removeProperty('--word-bank-spacer-bottom');
}


function scrollHighlightedWordBankButtons(buttons) {
    if (!buttons?.length) return;

    const highlighted =
        buttons.filter(button =>
            button.classList.contains('possible') ||
            button.classList.contains('keyboard-highlight')
        );

    if (!highlighted.length) return;

    const target = highlighted[0];

    const container =
        document.querySelector('.word-bank-container');

    if (!container) return;

    const vv = window.visualViewport;

    const viewportTop =
        vv ? vv.offsetTop : 0;

    const viewportHeight =
        vv ? vv.height : window.innerHeight;

    // Put the highlighted word around 40% down the
    // ACTUAL visible viewport. This works much better
    // when the iPad keyboard is open.
    const desiredY =
        viewportTop + viewportHeight * 0.40;

    const rect =
        target.getBoundingClientRect();

    const wordCenter =
        (rect.top + rect.bottom) / 2;

    let scrollAmount =
        wordCenter - desiredY;

    // Keep the scroll amount within the word bank's
    // actual scrollable range.
    const maxScroll =
        container.scrollHeight -
        container.clientHeight;

    const newScrollTop =
        Math.max(
            0,
            Math.min(
                container.scrollTop + scrollAmount,
                maxScroll
            )
        );

    scrollAmount =
        newScrollTop - container.scrollTop;

    if (Math.abs(scrollAmount) > 1) {
        container.scrollBy({
            top: scrollAmount,
            behavior: 'smooth'
        });
    }

    // iPad Safari can finish resizing the visual viewport
    // slightly after the keyboard appears. Recheck once.
    setTimeout(() => {
        const finalVV =
            window.visualViewport;

        const finalViewportTop =
            finalVV ? finalVV.offsetTop : 0;

        const finalViewportHeight =
            finalVV ? finalVV.height : window.innerHeight;

        const finalDesiredY =
            finalViewportTop +
            finalViewportHeight * 0.40;

        const finalRect =
            target.getBoundingClientRect();

        const finalWordCenter =
            (finalRect.top + finalRect.bottom) / 2;

        let finalScrollAmount =
            finalWordCenter - finalDesiredY;

        const finalMaxScroll =
            container.scrollHeight -
            container.clientHeight;

        const finalScrollTop =
            Math.max(
                0,
                Math.min(
                    container.scrollTop +
                    finalScrollAmount,
                    finalMaxScroll
                )
            );

        finalScrollAmount =
            finalScrollTop -
            container.scrollTop;

        if (Math.abs(finalScrollAmount) > 1) {
            container.scrollBy({
                top: finalScrollAmount,
                behavior: 'smooth'
            });
        }
    }, 300);
}


// ==================== TYPING HIGHLIGHTS ====================

function updateTypingHighlights(input) {
    const buttons = Array.from(
        document.querySelectorAll('.word-bank button')
    );
    const terms = dailyVocabQuestionBank[dailyVocabStudent]?.terms || [];
    const typed = input.value.trim().toLowerCase();

    if (input.dataset.committed) {
        input.classList.remove(
            'invalid-input',
            'duplicate-input'
        );
        return;
    }

    buttons.forEach(button => {
        button.classList.remove(
            'possible',
            'keyboard-highlight'
        );
    });

    selectedWord = null;

    if (!typed) {
        input.classList.remove(
            'invalid-input',
            'duplicate-input'
        );
        resetWordBankScrollFreedom();
        return;
    }

    const matches = terms
        .map((term, index) => ({
            term,
            index
        }))
        .filter(item =>
            item.term
                .toLowerCase()
                .startsWith(typed)
        );

    const exactMatch = terms.find(
        term =>
            term.toLowerCase() === typed
    );

    const isDuplicate =
        exactMatch &&
        !!usedTerms[
            exactMatch.toLowerCase()
        ];

    input.classList.remove('invalid-input');

    if (isDuplicate) {
        input.classList.add('duplicate-input');
    } else {
        input.classList.remove('duplicate-input');

        if (matches.length === 0) {
            input.classList.add('invalid-input');
        }
    }

    matches.forEach(match => {
        const button = buttons[match.index];

        if (!button) return;

        button.classList.add('possible');
        button.style.opacity = '1';
    });

    if (matches.length === 1) {
        selectedWord = matches[0].index;
        buttons[selectedWord]?.classList.add(
            'keyboard-highlight'
        );

    } else {

// ==================== INITIALIZE QUIZ ====================

function dailyVocabInitializeQuiz() {
    const quizQuestionsDiv =
        document.getElementById(
            'quiz-questions'
        );

    const wordBankDiv =
        document.getElementById(
            'word-bank'
        );

    quizQuestionsDiv.innerHTML = '';
    wordBankDiv.innerHTML = '';

    answers = [];
    usedTerms = {};

    selectedQuestion = null;
    selectedWord = null;
    lastSelectedIndex = -1;

    const studentQuestions =
        dailyVocabQuestionBank[dailyVocabStudent];


    // ==================== QUESTIONS ====================

    studentQuestions.questions.forEach(
        (question, index) => {
            const questionDiv =
                document.createElement('div');

            questionDiv.className =
                'question-box';

            questionDiv.tabIndex = -1;

            questionDiv.innerHTML = `
                <div class="question-label">
                    <strong>${index + 1}.</strong>
                    <input type="text"
                           id="answer-${index}"
                           class="answer-input"
                           autocomplete="off"
                           spellcheck="false">
                </div>

                <div class="question-text">
                    ${question.Definition}
                </div>
            `;

            const input =
                questionDiv.querySelector(
                    '.answer-input'
                );


            // ==================== QUESTION CLICK ====================

            questionDiv.addEventListener('click', e => {
                if (e.target === input) return;

                // If a word is currently selected, clicking the question
                // immediately puts that word into this question.
                if (selectedWord !== null) {
                    makeMatch(index, selectedWord);
                } else {
                    selectQuestion(index, false);
                }
            });


            // ==================== INPUT FOCUS ====================

            input.addEventListener('focus', () => {
                selectedQuestion = index;
                lastSelectedIndex = index;

                if (input.dataset.focusFromQuestion === 'true') {
                    // The question box itself was clicked.
                    // Keep its yellow highlight.
                    delete input.dataset.focusFromQuestion;
                } else {
                    // Directly clicking/focusing the textbox should
                    // NOT highlight the question.
                    document.querySelectorAll('.question-box').forEach(q => {
                        q.classList.remove('selected');
                    });
                }

                // Show predictions for whatever is currently being typed.
                updateTypingHighlights(input);
            });


            // ==================== INPUT ====================

            input.addEventListener('input', () => {
                // The moment the student changes a committed answer,
                // it becomes an uncommitted typed answer again.
                delete input.dataset.committed;

                input.classList.remove('duplicate-input');

                selectedQuestion = index;
                lastSelectedIndex = index;

                updateAllAnswerStates();

                // Now prediction highlighting takes over.
                updateTypingHighlights(input);
            });


            quizQuestionsDiv.appendChild(
                questionDiv
            );

            updateInputWidth(input);
        }
    );


    // ==================== WORD BANK ====================

    studentQuestions.terms.forEach(
        (term, index) => {
            const button =
                document.createElement('button');

            // No A., B., C. prefixes.
            button.textContent = term;

            button.dataset.index = index;
            button.tabIndex = -1;

            button.addEventListener(
                'click',
                () => {
                    if (selectedQuestion !== null) {
                        makeMatch(
                            selectedQuestion,
                            index
                        );

                    } else if (
                        lastSelectedIndex >= 0
                    ) {
                        makeMatch(
                            lastSelectedIndex,
                            index
                        );

                    } else {
                        selectWord(index);
                    }
                }
            );

            wordBankDiv.appendChild(button);
        }
    );

    updateAllAnswerStates();

    // Make absolutely sure nothing is focused
    // or highlighted on initial quiz creation.
    clearSelections();

    document
        .querySelectorAll('.answer-input')
        .forEach(input => input.blur());

    document.activeElement?.blur();
}


// ==================== KEYBOARD SUPPORT ====================

let lastSelectedIndex = -1;
let keyboardCandidates = [];
let keyboardCandidatePosition = 0;


function updateLastSelected(index) {
    lastSelectedIndex = index;
}


function focusQuestion(index) {
    const input =
        document.getElementById(
            `answer-${index}`
        );

    if (!input) return;

    clearSelections();

    selectedQuestion = index;
    lastSelectedIndex = index;

    const qBox =
        input.closest('.question-box');

    if (qBox) {
        // IMPORTANT:
        // Tab/focusing a textbox does NOT
        // yellow-highlight the question.

        const rect =
            qBox.getBoundingClientRect();

        // The questions column has its own scroll position.
        // Do not scroll the page when a question is selected.
        scrollQuestionToBox(qBox);
    }

    input.focus();

    input.setSelectionRange(
        input.value.length,
        input.value.length
    );

    updateTypingHighlights(input);
}


function focusSubmitButton() {
    const submitBtn =
        document.querySelector(
            '.quiz-actions .action-button'
        );

    if (submitBtn) {
        clearSelections();
        submitBtn.focus();
    }
}


// ==================== WORD CANDIDATES ====================

function getCandidateWordIndices() {
    const terms =
        dailyVocabQuestionBank[dailyVocabStudent]?.terms || [];

    const input =
        document.activeElement
            ?.classList.contains('answer-input')
            ? document.activeElement
            : (
                selectedQuestion !== null
                    ? document.getElementById(
                        `answer-${selectedQuestion}`
                    )
                    : null
            );

    const prefix =
        input
            ? input.value.trim().toLowerCase()
            : '';

    return terms
        .map((term, i) => ({
            term,
            i
        }))
        .filter(item =>
            !usedTerms[
                item.term.toLowerCase()
            ] &&
            (
                !prefix ||
                item.term
                    .toLowerCase()
                    .startsWith(prefix)
            )
        )
        .map(item => item.i);
}


function moveWordSelection(direction) {
    const candidates =
        getCandidateWordIndices();

    if (!candidates.length) return;

    let currentPos =
        candidates.indexOf(selectedWord);

    if (currentPos < 0) {
        currentPos =
            direction > 0
                ? -1
                : candidates.length;
    }

    let nextPos =
        currentPos + direction;

    if (
        nextPos >= candidates.length
    ) {
        nextPos = 0;
    }

    if (nextPos < 0) {
        nextPos =
            candidates.length - 1;
    }

    const nextIndex =
        candidates[nextPos];

    selectWord(nextIndex);

    const button =
        document.querySelectorAll(
            '.word-bank button'
        )[nextIndex];

    if (button) {
        button.classList.add(
            'keyboard-highlight'
        );

        // Keep keyboard navigation inside the word-bank
        // scroll area instead of scrolling the page.
        scrollWordBankToButton(
            button,
            'smooth'
        );
    }
}


// ==================== GLOBAL KEYBOARD ====================

document.addEventListener(
    'keydown',
    e => {
        if (window.dailyExerciseState?.active !== 'vocab') return;
        const inputs =
            Array.from(
                document.querySelectorAll(
                    '.answer-input'
                )
            );

        if (!inputs.length) return;

        const currentInput =
            document.activeElement;

        const currentIndex =
            inputs.indexOf(currentInput);

        const submitButton =
            document.querySelector(
                '.quiz-actions .action-button'
            );

        const isSubmitFocused =
            submitButton === currentInput;


        // ==================== ESCAPE ====================

        if (e.key === 'Escape') {
            e.preventDefault();

            clearSelections();

            if (
                currentInput?.classList
                    .contains('answer-input')
            ) {
                currentInput.blur();
            }

            updateWordBank('');

            return;
        }


        // ==================== TAB ====================

        if (e.key === 'Tab') {
            e.preventDefault();

            let baseIndex =
                currentIndex >= 0
                    ? currentIndex
                    : lastSelectedIndex;

            // IMPORTANT:
            // If nothing has been selected/focused yet,
            // the first Tab goes to question 1.
            if (baseIndex < 0) {
                baseIndex = -1;
            }

            let targetIndex;

            if (e.shiftKey) {
                if (baseIndex <= 0) {
                    // Nothing before question 1.
                    return;
                }

                targetIndex =
                    baseIndex - 1;

            } else if (
                baseIndex < inputs.length - 1
            ) {
                targetIndex =
                    baseIndex + 1;

            } else {
                targetIndex = null;
            }


            // Submit button is currently focused.
            if (isSubmitFocused) {
                if (e.shiftKey) {
                    focusQuestion(
                        inputs.length - 1
                    );
                }

                return;
            }


            // Move to Submit after final question.
            if (targetIndex === null) {
                focusSubmitButton();

            } else {
                focusQuestion(
                    targetIndex
                );
            }

            return;
        }


        // ==================== ARROW KEYS ====================

        if (
            e.key === 'ArrowDown' ||
            e.key === 'ArrowUp'
        ) {
            if (
                currentIndex < 0 &&
                selectedQuestion === null &&
                selectedWord === null
            ) {
                return;
            }

            e.preventDefault();

            keyboardCandidates =
                getCandidateWordIndices();

            if (
                !keyboardCandidates.length
            ) {
                return;
            }

            moveWordSelection(
                e.key === 'ArrowDown'
                    ? 1
                    : -1
            );

            return;
        }


        // ==================== ENTER ====================

        if (e.key === 'Enter') {
            e.preventDefault();

            // If the Submit button is focused, submit the quiz.
            if (submitButton === currentInput) {
                submitQuiz();
                return;
            }

            // If an answer input is active,
            // use the selected word or commit typed text.
            if (currentIndex >= 0) {

                if (selectedWord !== null) {
                    const terms =
                        dailyVocabQuestionBank[
                            dailyVocabStudent
                        ].terms;

                    const typed =
                        currentInput.value
                            .trim()
                            .toLowerCase();

                    if (
                        !typed ||
                        terms[selectedWord]
                            .toLowerCase()
                            .startsWith(typed)
                    ) {
                        makeMatch(
                            currentIndex,
                            selectedWord
                        );

                    } else {
                        commitTypedAnswer(
                            currentIndex
                        );
                    }

                } else {
                    commitTypedAnswer(
                        currentIndex
                    );
                }

                return;
            }


            // If a word is selected with no input
            // focused, apply it to the most recent question.
            if (
                selectedWord !== null &&
                lastSelectedIndex >= 0
            ) {
                makeMatch(
                    lastSelectedIndex,
                    selectedWord
                );
            }
        }
    }
);


// ==================== CLICK OUTSIDE ====================

document.addEventListener(
    'click',
    e => {
        if (
            !e.target.closest(
                '.question-box'
            ) &&
            !e.target.closest(
                '.word-bank button'
            )
        ) {
            clearSelections();
        }
    }
);


// ==================== SUBMIT QUIZ ====================

function submitQuiz() {
    const hasBlankAnswers =
        answers.some(
            answer => !answer
        );

    const usedCounts = {};

    answers.forEach(answer => {
        if (answer) {
            usedCounts[answer] =
                (usedCounts[answer] || 0) + 1;
        }
    });

    const duplicateAnswers =
        Object.keys(usedCounts)
            .filter(
                term =>
                    usedCounts[term] > 1
            );


    if (
        hasBlankAnswers &&
        duplicateAnswers.length > 0
    ) {
        if (
            !confirm(
                'There are blank answers and duplicate responses.\nWould you still like to proceed?'
            )
        ) return;

    } else if (hasBlankAnswers) {
        if (
            !confirm(
                'There are some questions left blank.\nWould you still like to proceed?'
            )
        ) return;

    } else if (
        duplicateAnswers.length > 0
    ) {
        if (
            !confirm(
                'There are duplicate responses (each word should only be used once).\n\nWould you still like to proceed?'
            )
        ) return;
    }
    const resultData = dailyVocabPrepareResultData();
    dailyCompleteExercise("vocab", resultData);
}

// ==================== PREPARE RESULT DATA ====================

function dailyVocabPrepareResultData() {
    const correctAnswers =
        dailyVocabQuestionBank[
            dailyVocabStudent
        ].answers;

    const allTerms =
        [...correctAnswers];

    const correctTerms =
        answers
            .map(
                (answer, index) =>
                    answer &&
                    answer.toLowerCase() ===
                    correctAnswers[index]
                        .toLowerCase()
                        ? correctAnswers[index]
                        : null
            )
            .filter(term => term);

    const termsToReview =
        allTerms.filter(
            term =>
                !correctTerms.includes(term)
        );


    return {
        student:
            dailyVocabCapitalizeName(
                dailyVocabStudent
            ),

        date:
            new Date()
                .toISOString()
                .split('T')[0],

        time:
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    }
                ),

        exercise:
            "Vocab Quiz",

        answers:
            Array.from(
                { length: 10 },
                (_, index) =>
                    answers[index] || ""
            ),

        questionSet:
            dailyVocabQuestionBank[dailyVocabStudent],

        termsToReview:
            termsToReview
                .map(term => ({
                    term,
                    definition:
                        vocabularyTerms
                            .find(
                                v =>
                                    v.Term ===
                                    term
                            )
                            ?.Definition ||
                        "Definition not found"
                }))
                .sort(
                    (a, b) =>
                        a.term.localeCompare(
                            b.term
                        )
                )
    };
}

                modes: ['Ionian','Dorian','Phrygian','Lydian','Mixolydian','Aeolian','Locrian']
            };

            const options = fullOrdered[section] || [];

            // Filter to only the answers allowed by the current difficulty

                playsLeft--;

                if (playsLeft === 0 && playBtn) {

            studentAnswers.forEach((ans, i) => {
                if (ans.toLowerCase() !== allCorrect[i].toLowerCase()) {
                    missedAnswers.push(allCorrect[i]);

            });

            const termsToReview = [...new Set(missedAnswers)]
                .map(correct => ({ item: correct, correct }));

            const correctCount = studentAnswers.filter((a, i) => 
                a.toLowerCase() === allCorrect[i].toLowerCase()
            ).length;

            return {

                exercise: dailyEarQuizConfig.name || "Ear Training",

                termsToReview: termsToReview,
                percentage: Math.round((correctCount / total) * 100)
            };

            const isLoginActive = document.getElementById('login-section') !== null && 
                                 !document.getElementById('login-section').classList.contains('hidden');

            // TAB (Login)
            if (e.key === 'Tab' && isLoginActive) {
                const nameInput = document.getElementById('name-input');
                if (nameInput) {
                    nameInput.focus();
                    e.preventDefault();
                }
                return;
            }

            // ENTER
            if (e.key === 'Enter') {
                if (isLoginActive) {
                    if (typeof checkName === 'function') checkName();
                    e.preventDefault();
                } 
                else if (isQuizActive && answerSelect) {
                    dailyEarSubmitCurrentAnswer();
                    e.preventDefault();
                }
                return;
            }

            // SPACE - Play Audio
            if ((e.key === ' ' || e.key === 'Spacebar') && isQuizActive) {
                if (activeElement.tagName !== 'INPUT' && activeElement.tagName !== 'SELECT') {
                    e.preventDefault();
                    dailyEarPlayCurrentAudio();
                }
            }

            // ARROW KEYS - Navigate dropdown
            if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && isQuizActive && answerSelect) {
                const sectionKey = dailyEarSections[currentSectionIndex];
                const options = dailyEarGetOrderedOptions(sectionKey);
                if (options.length === 0) return;

                let currentIndex = options.indexOf(answerSelect.value);

                if (e.key === 'ArrowDown') {
                    currentIndex = currentIndex === -1 ? 0 : (currentIndex + 1) % options.length;
                } else {
                    currentIndex = currentIndex === -1 ? options.length - 1 : (currentIndex - 1 + options.length) % options.length;
                }

                answerSelect.value = options[currentIndex];
                e.preventDefault();
            }
        });
