<script>
let dailySightMediaRecorder = null;
let dailySightAudioChunks = [];
let dailySightIsRecording = false;
let dailySightHasRecorded = false;
let dailySightAnalyser = null;
let dailySightAnimationId = null;
let dailySightCountdownTimer = null;
let dailySightStartedAt = null;
let dailySightExample = null;
let dailySightTimeExpired = false;

function dailyInitSightSinging() {
  const startDate = new Date('2024-11-04');
  const today = new Date();
  let differenceInDays = Math.floor((today.getTime() - startDate.getTime()) / (1000 * 3600 * 24));
  const completeWeeks = Math.floor(differenceInDays / 7);
  differenceInDays -= completeWeeks * 2;
  const currentDay = today.getDay();
  if (currentDay === 0) differenceInDays -= 2;
  if (currentDay === 6) differenceInDays -= 1;
  dailySightExample = (differenceInDays % 30) + 1;
  document.getElementById('exerciseImage').src = `examples/${dailySightExample}.jpg`;
  dailySightIsRecording = false;
  dailySightHasRecorded = false;
  dailySightStartedAt = null;
  dailySightTimeExpired = false;
  if (dailySightCountdownTimer) {
    clearInterval(dailySightCountdownTimer);
    dailySightCountdownTimer = null;
  }
  document.getElementById('exerciseImage').classList.remove('revealed');
  document.getElementById('beginSightButton').disabled = false;
  document.getElementById('recordButton').disabled = true;
  document.getElementById('recordingNotice').style.display = 'none';
  document.getElementById('recordStatus').textContent = '';
}

function dailyBeginSightSinging() {
  if (dailySightStartedAt || dailySightHasRecorded || dailySightTimeExpired) return;

  dailySightStartedAt = Date.now();
  dailySightTimeExpired = false;
  document.getElementById('beginSightButton').disabled = true;
  document.getElementById('exerciseImage').classList.add('revealed');
  document.getElementById('recordButton').disabled = false;
  document.getElementById('recordingNotice').style.display = 'block';
  dailySightUpdateCountdown();
  dailySightCountdownTimer = setInterval(dailySightUpdateCountdown, 250);
}

function dailySightUpdateCountdown() {
  if (!dailySightStartedAt) return;

  const el = document.getElementById('sightCountdown');

    if (!el) {
    if (dailySightCountdownTimer) {
      clearInterval(dailySightCountdownTimer);
      dailySightCountdownTimer = null;
    }
    return;
  }

  const elapsed = Date.now() - dailySightStartedAt;
  const remaining = Math.max(0, 180000 - elapsed);
  const minutes = Math.floor(remaining / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);

  if (remaining > 0) {
    el.textContent = `${minutes}:${seconds.toString().padStart(2,'0')} remaining`;
  } else {
    el.textContent = "Time's up!";

    clearInterval(dailySightCountdownTimer);
    dailySightCountdownTimer = null;

    dailySightTimeExpired = true;

    const recordButton = document.getElementById('recordButton');
    const recordingNotice = document.getElementById('recordingNotice');
    const recordStatus = document.getElementById('recordStatus');

    // Disable the button immediately, even if the microphone/recorder is in
    // the middle of an async operation.
    if (recordButton) recordButton.disabled = true;
    if (recordingNotice) recordingNotice.style.display = 'none';

    if (dailySightIsRecording && dailySightMediaRecorder) {
      // Force-stop the active recording exactly at the time limit.
      try {
        if (dailySightMediaRecorder.state !== 'inactive') {
          dailySightMediaRecorder.stop();
        }
      } catch (err) {
        console.error('Could not stop expired sight-singing recording:', err);
      }

      dailySightIsRecording = false;
      dailySightHasRecorded = true;
      document.getElementById('recordIcon')?.classList.remove('recording');
    } else if (recordStatus) {
      recordStatus.textContent =
        'The 3-minute sight-singing window has ended.';
    }
  }
}

async function dailyToggleSightRecording() {
  const recordButton = document.getElementById('recordButton');
  if (!recordButton) return;

  // Hard gate: once the countdown has expired, recording is permanently locked
  // for this sight-singing attempt.
  if (dailySightTimeExpired || !dailySightStartedAt ||
      Date.now() - dailySightStartedAt >= 180000) {
    dailySightUpdateCountdown();
    recordButton.disabled = true;
    return;
  }

  if (!dailySightIsRecording) {
    if (dailySightHasRecorded || dailySightTimeExpired) return;

    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});

      // The microphone permission prompt is asynchronous. The 3-minute timer
      // may expire while it is open, so check the hard deadline again before
      // starting MediaRecorder.
      if (
        dailySightTimeExpired ||
        !dailySightStartedAt ||
        Date.now() - dailySightStartedAt >= 180000
      ) {
        stream.getTracks().forEach(track => track.stop());
        dailySightUpdateCountdown();
        return;
      }

      const audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(stream);
      dailySightAnalyser = audioContext.createAnalyser();
      source.connect(dailySightAnalyser);

      dailySightMediaRecorder = new MediaRecorder(stream);
      dailySightAudioChunks = [];

      document.getElementById('visualizer').style.display = 'block';
      dailySightDrawVisualization();

      dailySightMediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size) dailySightAudioChunks.push(e.data);
      };

      dailySightMediaRecorder.onstop = async () => {
        try {
          const webmBlob = new Blob(dailySightAudioChunks, {
            type: dailySightMediaRecorder.mimeType || 'audio/webm'
          });
          const arrayBuffer = await webmBlob.arrayBuffer();
          const audioCtx = new AudioContext();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          const samples = audioBuffer.getChannelData(0);
          const sampleRate = audioBuffer.sampleRate;
          const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
          const sampleBlockSize = 1152;
          const mp3Data = [];

          for (let i = 0; i < samples.length; i += sampleBlockSize) {
            const chunk = samples.subarray(i, i + sampleBlockSize);
            const int16 = new Int16Array(chunk.length);
            for (let j = 0; j < chunk.length; j++) {
              int16[j] = Math.max(-32768, Math.min(32767, chunk[j] * 32768));
            }
            const buf = mp3encoder.encodeBuffer(int16);
            if (buf.length) mp3Data.push(buf);
          }

          const flushed = mp3encoder.flush();
          if (flushed.length) mp3Data.push(flushed);

          const mp3Blob = new Blob(mp3Data, {type:'audio/mp3'});

          stream.getTracks().forEach(track => track.stop());
          try { await audioContext.close(); } catch (_) {}
          try { await audioCtx.close(); } catch (_) {}

          document.getElementById('visualizer').style.display = 'none';
          if (dailySightAnimationId) cancelAnimationFrame(dailySightAnimationId);
          dailySightAnimationId = null;

          document.getElementById('recordIcon')?.classList.remove('recording');

          if (dailySightTimeExpired) {
            document.getElementById('recordStatus').textContent =
              'Time expired. Recording stopped automatically.';
          } else {
            document.getElementById('recordStatus').textContent =
              'Recording complete.';
          }

          dailySightRecordingReady(mp3Blob, dailySightExample);
        } catch (err) {
          console.error('MP3 conversion error:', err);
          document.getElementById('visualizer').style.display = 'none';
          if (dailySightAnimationId) cancelAnimationFrame(dailySightAnimationId);
          dailySightAnimationId = null;
          document.getElementById('recordIcon')?.classList.remove('recording');
          document.getElementById('recordStatus').textContent =
            'Could not finish the recording.';
          if (!dailySightTimeExpired) recordButton.disabled = false;
        }
      };

      // Check one final time immediately before starting the recorder.
      if (
        dailySightTimeExpired ||
        Date.now() - dailySightStartedAt >= 180000
      ) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }

      dailySightMediaRecorder.start();
      dailySightIsRecording = true;
      recordButton.disabled = false;
      document.getElementById('recordIcon').classList.add('recording');
      document.getElementById('recordingNotice').style.display = 'block';
      document.getElementById('recordingNotice').textContent =
        'Recording… press the button again to stop.';
    } catch (err) {
      console.error('Microphone error:', err);
      if (!dailySightTimeExpired) {
        document.getElementById('recordStatus').textContent =
          'Microphone access is required for the sight-singing recording.';
      }
    }
  } else {
    if (dailySightTimeExpired) {
      // The countdown handler owns stopping an expired recording.
      return;
    }

    if (dailySightMediaRecorder &&
        dailySightMediaRecorder.state !== 'inactive') {
      dailySightMediaRecorder.stop();
    }

    dailySightIsRecording = false;
    dailySightHasRecorded = true;
    recordButton.disabled = true;
    document.getElementById('recordIcon').classList.remove('recording');
    document.getElementById('recordingNotice').style.display = 'none';

    if (dailySightCountdownTimer) {
      clearInterval(dailySightCountdownTimer);
      dailySightCountdownTimer = null;
    }

    const countdown = document.getElementById('sightCountdown');
    if (countdown) countdown.style.display = 'none';

    const beginButton = document.getElementById('beginSightButton');
    if (beginButton) beginButton.style.display = 'none';
  }
}

function dailyStopSightRecordingForNavigation() {
  if (dailySightCountdownTimer) {
    clearInterval(dailySightCountdownTimer);
    dailySightCountdownTimer = null;
  }

  if (dailySightMediaRecorder &&
      dailySightMediaRecorder.state !== 'inactive') {
    try {
      dailySightMediaRecorder.stop();
    } catch (err) {
      console.error('Could not stop recording during navigation:', err);
    }
  }

  dailySightIsRecording = false;

  if (typeof dailySightAnimationId !== 'undefined' && dailySightAnimationId) {
    cancelAnimationFrame(dailySightAnimationId);
    dailySightAnimationId = null;
  }

  if (typeof dailySightAnalyser !== 'undefined') {
    dailySightAnalyser = null;
  }
}

function dailySightDrawVisualization() {
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  canvas.width = 800; canvas.height = 180;
  const bufferLength = dailySightAnalyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  function draw() {
    if (!dailySightAnalyser) return;
    dailySightAnalyser.getByteFrequencyData(dataArray);
    ctx.fillStyle = '#3c3c3c';
    ctx.fillRect(0,0,800,180);
    const barWidth = 800 / bufferLength * 2.5;
    let x=0;
    for (let i=0; i<bufferLength; i++) {
      const barHeight = dataArray[i] / 2;
      ctx.fillStyle = `rgb(${barHeight+100},50,50)`;
      ctx.fillRect(x,180-barHeight,barWidth,barHeight);
      x += barWidth + 1;
    }
    dailySightAnimationId = requestAnimationFrame(draw);
  }
  draw();
}

document.addEventListener('click', e => {
  if (e.target.closest('#beginSightButton')) dailyBeginSightSinging();
  if (e.target.closest('#recordButton')) dailyToggleSightRecording();
});
</script>
