<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AP Terms</title>
<link rel="icon" href="../icons/BGicon.png">
<link rel="stylesheet" href="../common-styles.css">
<link rel="preload" href="../fonts/Zapfino.ttf" as="font" type="font/ttf" crossorigin="anonymous">
<style>
:root {
       --panel: rgba(10, 27, 61, 0.72);
       --panel-border: rgba(255, 255, 255, 0.18);
       --muted: rgba(255, 255, 255, 0.72);
       --accent: #a9d7ff;
}
.container { max-width: 800px; margin: 0 auto; text-align: left; }
.page-heading { text-align: center; margin-bottom: 24px; }
.toolbar, .panel {
       text-align: left;
       background: var(--panel);
       border: 1px solid var(--panel-border);
       border-radius: 14px;
       padding: 18px;
       margin: 16px 0;
       backdrop-filter: blur(15px);
}
.toolbar {
       display: flex;
       justify-content: center;
       align-items: center;
       gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 5px; min-width: 160px; }
.field label { font-size: .9rem; color: var(--muted); }
select, textarea {
       width: 100%;
       box-sizing: border-box;
       padding: 10px 12px;
       border: 1px solid rgba(255,255,255,.25);
       border-radius: 7px;
       background: rgba(255,255,255,.95);
       color: #202633;
       font: inherit;
}
.action-button {
       border: 1px solid rgba(255,255,255,.22);
       border-radius: 7px;
       padding: 10px 14px;
       font: inherit;
       cursor: pointer;
       transition: transform .12s ease, background .12s ease;
}
.action-button:hover:not(:disabled) { transform: translateY(-1px); }
.action-button:disabled { opacity: .4; cursor: default; }
.primary { background: #b7ddff; color: #132847; font-weight: 650; }
.secondary { background: rgba(255,255,255,.12); color: white; }
.unit-panel-heading {
       display: grid;
       grid-template-columns: auto minmax(0, 1fr) auto;
       align-items: center;
       gap: 12px;
       margin-bottom: 18px;
       text-align: center;
}
.unit-title {
       margin: 0;
       font-size: 1.25rem;
       font-weight: 700;
       overflow-wrap: anywhere;
}
.stepper-button {
       display: inline-flex;
       align-items: center;
       justify-content: center;
       min-width: 42px;
       min-height: 42px;
       padding: 8px 12px;
       font-size: 1.4rem;
       line-height: 1;
}
.term-list { display: grid; gap: 9px; }
.term-card {
       position: relative;
       text-align: left;
       padding: 15px 42px 15px 16px;
       border: 1px solid var(--panel-border);
       border-radius: 9px;
       background: rgba(255,255,255,.07);
       transition: border-color .25s ease, background-color .25s ease,
                   transform .4s ease, opacity .4s ease;
}
.term-name {
       font-weight: 700;
       font-size: 1.3rem;
       line-height: 1.4;
       color: #fbe179;
       overflow-wrap: anywhere;
       transition: filter .5s ease;
}

.term-card.future-term { opacity: .1; cursor: pointer; border-style: dashed; }
.term-card.future-term:hover { opacity: .2; background: rgba(255,255,255,.11); }
.term-card.future-term .definition { display: none; }
.term-card.introduced-term { cursor: default; }
.term-card.future-term .term-name { color: rgba(251,225,121,.9); }
.term-card.introduced-term.just-introduced { border-color: #ffe66d; background: rgba(255,230,109,.16); box-shadow: 0 0 22px rgba(255,230,109,.28); }

.definition {
       margin-top: 8px;
       color: rgba(255,255,255,.94);
       font-size: 1.15rem;
       line-height: 1.55;
       white-space: pre-wrap;
       overflow-wrap: anywhere;
}
.term-card.session-term-highlight {
    border-color: rgba(255, 230, 109, 0.7);
    background-color: rgba(255, 230, 109, .035);
    box-shadow: 0 0 5px rgba(255, 230, 109, .08);
}
.term-card.new-term-highlight {
    border-color: #ffe66d;
    background-color: rgba(255, 230, 109, .16);
    box-shadow: 0 0 22px rgba(255, 230, 109, .32);
    outline: 1px solid rgba(255, 230, 109, .38);
}
.term-remove, .reveal-btn {
       position: absolute;
       display: inline-flex;
       align-items: center;
       justify-content: center;
       cursor: pointer;
       border: 0;
       background: transparent;
       z-index: 2;
}
.term-remove {
       top: 5px;
       right: 6px;
       width: 28px;
       height: 28px;
       padding: 0;
       color: rgba(255,255,255,.75);
       font-size: 1rem;
       border-radius: 6px;
}
.term-remove:hover { color: white; background: rgba(255,255,255,.16); }
.reveal-btn {
       display: none;
       top: 12px;
       left: 12px;
       width: 32px;
       height: 32px;
       padding: 4px;
}
.reveal-btn img { width: 100%; height: 100%; object-fit: contain; }
body.hidden-mode .term-card.introduced-term:not(.term-revealed) .term-name {
       filter: blur(20px) opacity(50%);
       user-select: none;
}
body.hidden-mode .term-card .reveal-btn { display: inline-flex; }
body.hidden-mode .term-card.term-revealed .reveal-btn { display: none; }
.bottom-controls {
       display: flex;
       flex-direction: column;
       align-items: center;
       gap: 10px;
       margin-top: 18px;
       text-align: center;
}
.bottom-downloads {
       display: flex;
       justify-content: center;
       flex-wrap: wrap;
       gap: 10px;
       width: 100%;
}
.count {
       white-space: pre-line;
       text-align: center;
       font-size: 1rem;
       line-height: 1.6;
       color: var(--muted);
       margin: 12px 2px 0;
}
.hidden-mode-toggle, .shuffle-button {
       position: absolute;
       left: 11px;
       background: none;
       border: none;
       padding: 10px;
       cursor: pointer;
       width: 60px;
       height: 50px;
       z-index: 10;
}
.hidden-mode-toggle { top: 50px; }
.shuffle-button { top: 95px; opacity: .7; }
.hidden-mode-toggle img, .shuffle-button img { width: 100%; height: 100%; object-fit: contain; }
#hotkey-modal {
       position: fixed;
       inset: 0;
       z-index: 2000;
       display: none;
       align-items: center;
       justify-content: center;
       padding: 20px;
       background: rgba(0,0,0,.65);
}
#hotkey-modal.show { display: flex; }
.hotkey-box {
       width: min(360px, 100%);
       padding: 24px;
       border-radius: 14px;
       background: #f7f9fc;
       color: #1b2940;
       box-shadow: 0 15px 50px rgba(0,0,0,.35);
}
.hotkey-box h2 { margin-top: 0; }
.hotkey-row {
       display: flex;
       justify-content: space-between;
       align-items: center;
       gap: 16px;
       margin: 12px 0;
}
.hotkey-key {
       background: #e8eef5;
       border: 1px solid #c5d0e0;
       border-radius: 6px;
       padding: 3px 10px;
       font-family: monospace;
       font-size: .95rem;
       font-weight: 600;
       min-width: 28px;
       text-align: center;
}
.hotkey-hint {
       margin-top: 20px;
       font-size: .85rem;
       opacity: .75;
       text-align: center;
}
.empty { color: var(--muted); text-align: center; padding: 35px 12px; }
/* Add-terms modal */
#addDialog {
       position: fixed;
       inset: 0;
       margin: auto;
       width: min(560px, calc(100% - 36px));
       max-height: 88vh;
       overflow: auto;
       border: 1px solid rgba(255,255,255,.25);
       border-radius: 14px;
       padding: 0;
       color: white;
       background: #182e55;
       box-shadow: 0 20px 70px rgba(0,0,0,.45);
}
#addDialog::backdrop { background: rgba(0,0,0,.65); backdrop-filter: blur(3px); }
/* Unsaved-list confirmation */
#unsavedDialog {
    width: min(440px, calc(100% - 36px));
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 14px;
    padding: 0;
    color: white;
    background: #182e55;
    box-shadow: 0 20px 70px rgba(0,0,0,.5);
}
#unsavedDialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
.unsaved-inner { padding: 24px; }
.unsaved-inner h2 { margin: 0 0 10px; color: #fbe179; font-size: 1.35rem; }
.unsaved-inner p { line-height: 1.55; color: rgba(255,255,255,.9); }
.unsaved-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.unsaved-actions .primary { min-width: 190px; }
@media (max-width: 480px) {
    .unsaved-inner { padding: 18px; }
    .unsaved-actions { flex-direction: column; }
    .unsaved-actions button { width: 100%; }
}
.dialog-inner { padding: 22px; }
.dialog-header {
       display: flex;
       align-items: center;
       justify-content: flex-end;
       margin-bottom: 16px;
}
.dialog-close {
       display: inline-flex;
       align-items: center;
       justify-content: center;
       width: 36px;
       height: 36px;
       padding: 0;
       border: 0;
       border-radius: 7px;
       background: transparent;
       color: white;
       font-size: 1.8rem;
       line-height: 1;
       cursor: pointer;
}
.dialog-close:hover { background: rgba(255,255,255,.12); }
#pastedTerms {
       min-height: 220px;
       resize: vertical;
       user-select: text;
       -webkit-user-select: text;
       white-space: pre;
       overflow-wrap: normal;
}
.import-count {
       margin: 12px 0 0;
       color: var(--muted);
       font-size: .9rem;
       text-align: center;
       min-height: 1.3em;
}
.dialog-actions { display: flex; justify-content: center; margin-top: 18px; }
#downloadBoth { min-width: 230px; }
[hidden] { display: none !important; }
@media (max-width: 600px) {
       body { padding: 12px; }
       .unit-panel-heading { gap: 8px; }
       .unit-title { font-size: 1.1rem; }
       .stepper-button { min-width: 38px; min-height: 38px; }
       .dialog-inner { padding: 18px; }
       #downloadBoth { width: 100%; min-width: 0; }
}
</style>
</head>
<body>
<div id="shared-menu"></div>
<div class="background"></div>
<div class="overlay"></div>
<div class="overlay2"></div>
<button class="hidden-mode-toggle" id="hiddenModeToggle" type="button"
           aria-label="Toggle Hidden Mode" title="Toggle Hidden Mode">
       <img src="../icons/hidden-off.png" alt="" id="hiddenModeIcon">
</button>
<button class="shuffle-button" id="shuffleButton" type="button"
           aria-label="Shuffle terms" title="Shuffle terms">
       <img src="../icons/shuffle.png" alt="">
</button>
<div class="page-heading">
       <h1 class="Title">BIPH Music</h1>
       <h1 class="Subtitle">AP Terms</h1>
</div>
<div class="container">
       <section class="panel" aria-label="Music terms">
           <div class="unit-panel-heading">
               <button class="action-button secondary stepper-button"
                       id="previousUnit" type="button"
                       aria-label="Previous unit" title="Previous unit">&#8592;</button>
               <h2 class="unit-title" id="unitTitle">Unit</h2>
               <button class="action-button secondary stepper-button"
                       id="nextUnit" type="button"
                       aria-label="Next unit" title="Next unit">&#8594;</button>
           </div>
           <div id="termList" class="term-list" aria-live="polite"></div>
           <div class="bottom-controls">
                <p id="termCount" class="count"></p>
                <div class="bottom-downloads" hidden>
                    <button class="action-button secondary" id="downloadBoth" type="button">Download Updated List</button>
                </div>
                <a id="quizYourselfButton" class="action-button primary" href="https://biphmusic.github.io/vocabquiz/" target="_self" hidden style="text-decoration:none;text-align:center;">Quiz Yourself</a>
                <p class="import-count" id="pageStatus" aria-live="polite"></p>
            </div>
        </section>
</div>
<div class="logocontainer">
       <img src="../icons/Full Logo White on Transparent.png"
            alt="BASIS Logo" class="logo">
</div>
<script src="../apstudents.js"></script>
<script src="../menu.js"></script>
<script src="../mymenu.js"></script>
<script>
(() => {
    "use strict";

    const unitKeys = ["unit1", "unit2", "unit3", "unit4", "unit5", "unit6", "unit7", "unit8"];
    const unitLabels = Object.fromEntries(unitKeys.map((key, i) => [key, `Unit ${i + 1}`]));
    const STORAGE_KEY = "apTerms.introduced.v1";

    const unitTitle = document.getElementById("unitTitle");
    const previousUnit = document.getElementById("previousUnit");
    const nextUnit = document.getElementById("nextUnit");
    const termList = document.getElementById("termList");
    const termCount = document.getElementById("termCount");
    const pageStatus = document.getElementById("pageStatus");
    const downloadBoth = document.getElementById("downloadBoth");
    const bottomDownloads = document.querySelector(".bottom-downloads");
    const quizYourselfButton = document.getElementById("quizYourselfButton");
    const hiddenModeToggle = document.getElementById("hiddenModeToggle");
    const shuffleButton = document.getElementById("shuffleButton");

    let isTeacher = false;
    let isStudent = false;
    let hiddenMode = false;
    let selectedUnit = "unit1";
    let termsByUnit = Object.fromEntries(unitKeys.map(key => [key, []]));
    let glossary = [];
    let definitionsByUnit = Object.fromEntries(unitKeys.map(key => [key, []]));
    let introducedByUnit = Object.fromEntries(unitKeys.map(key => [key, []]));
    const typingTimers = new Set();

    function roleFromStorage() {
        const name = localStorage.getItem("biph_student_name");
        const role = localStorage.getItem("biph_user_role");
        return { teacher: !!name && role === "teacher", student: !!name && role === "student" };
    }

    function normalizeKey(value) {
        return String(value).trim().toLocaleLowerCase();
    }

    function unique(values) {
        const seen = new Set();
        return values.filter(value => {
            const key = normalizeKey(value);
            if (!key || seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    }

    function parseStringArray(source, name) {
        const match = source.match(new RegExp("\\bconst\\s+" + name + "\\s*=\\s*\\[([\\s\\S]*?)\\]\\s*;"));
        if (!match) return [];
        return [...match[1].matchAll(/"((?:\\.|[^"\\])*)"/g)].map(m => {
            try { return JSON.parse('"' + m[1] + '"'); }
            catch (_) { return m[1]; }
        });
    }

    function parseGlossary(source) {
        const match = source.match(/\bconst\s+theglossary\s*=\s*\[([\s\S]*?)\]\s*;/);
        if (!match) return [];
        const pattern = /\{\s*"Term"\s*:\s*"((?:\\.|[^"\\])*)"\s*,\s*"Definition"\s*:\s*"((?:\\.|[^"\\])*)"\s*\}/g;
        return [...match[1].matchAll(pattern)].map(m => ({
            Term: JSON.parse('"' + m[1] + '"'),
            Definition: JSON.parse('"' + m[2] + '"')
        }));
    }

    function loadIntroductionProgress() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
            if (!saved || typeof saved !== "object") return;
            for (const key of unitKeys) {
                const valid = new Set(termsByUnit[key].map(normalizeKey));
                introducedByUnit[key] = unique(Array.isArray(saved[key]) ? saved[key] : [])
                    .filter(term => valid.has(normalizeKey(term)))
                    .map(term => termsByUnit[key].find(item => normalizeKey(item) === normalizeKey(term)));
            }
        } catch (error) {
            console.warn("Couldn't read saved AP vocabulary progress:", error);
        }
    }

    function saveIntroductionProgress() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(introducedByUnit));
            pageStatus.textContent = "Introduction progress saved on this device.";
        } catch (error) {
            pageStatus.textContent = "Couldn't save introduction progress in this browser.";
            console.error(error);
        }
    }

    async function fetchText(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status} loading ${path}`);
        return response.text();
    }

async function loadTeacherData() {
    // Load glossary.js as an actual JavaScript file.
    await new Promise((resolve, reject) => {
        if (window.AP_GLOSSARY) {
            resolve();
            return;
        }

        const script = document.createElement("script");
        script.src = "../glossary.js";
        script.onload = resolve;
        script.onerror = () => reject(
            new Error("Could not load ../glossary.js.")
        );

        document.head.appendChild(script);
    });

    // Read the object exported by glossary.js.
    const master = window.AP_GLOSSARY;

    if (!master || typeof master !== "object") {
        throw new Error(
            "glossary.js did not successfully define window.AP_GLOSSARY."
        );
    }

    termsByUnit = Object.fromEntries(
        unitKeys.map(key => [
            key,
            Array.isArray(master.units?.[key])
                ? master.units[key]
                : []
        ])
    );

    glossary = Array.isArray(master.terms)
        ? master.terms
        : [];

    definitionsByUnit = master.definitionsByUnit ||
        Object.fromEntries(unitKeys.map(key => [key, []]));

    loadIntroductionProgress();

    // Open the highest unit that actually has introduced words.
    selectedUnit =
        [...unitKeys].reverse().find(
            key => introducedByUnit[key].length > 0
        ) || "unit1";

    render();
}

    async function loadStudentData() {
        const source = await fetchText("../terms.js");
        termsByUnit = Object.fromEntries(unitKeys.map(key => [key, parseStringArray(source, key)]));
        glossary = parseGlossary(source);
        definitionsByUnit = Object.fromEntries(unitKeys.map(key => [key, []]));
        let glossaryIndex = 0;
        for (const key of unitKeys) {
            for (const term of termsByUnit[key]) {
                const item = glossary[glossaryIndex++];
                if (item) definitionsByUnit[key].push(item);
            }
        }
        introducedByUnit = Object.fromEntries(unitKeys.map(key => [key, [...termsByUnit[key]]]));
        selectedUnit = [...unitKeys].reverse().find(key => termsByUnit[key].length) || "unit1";
        render();
    }

    async function loadForCurrentRole() {
        const role = roleFromStorage();
        isTeacher = role.teacher;
        isStudent = role.student;
        bottomDownloads.hidden = !isTeacher;
        quizYourselfButton.hidden = !isStudent;
        try {
            if (isTeacher) await loadTeacherData();
            else await loadStudentData();
        } catch (error) {
            termList.replaceChildren();
            const message = document.createElement("div");
            message.className = "empty";
            message.textContent = `Couldn't load the vocabulary files. Check that glossary.js and terms.js are in the expected parent folder. ${error.message}`;
            termList.appendChild(message);
        }
    }

    function introducedTermsForUnit(key) {
        return introducedByUnit[key] || [];
    }

    function futureTermsForUnit(key) {
        const introduced = new Set(introducedTermsForUnit(key).map(normalizeKey));
        return (termsByUnit[key] || []).filter(term => !introduced.has(normalizeKey(term)));
    }

    function visibleUnits() {
        return isTeacher ? unitKeys.filter(key => termsByUnit[key].length) : unitKeys.filter(key => introducedTermsForUnit(key).length);
    }

    function moveUnit(direction) {
        const units = visibleUnits();
        if (units.length < 2) return;
        let index = units.indexOf(selectedUnit);
        if (index < 0) index = 0;
        selectedUnit = units[(index + direction + units.length) % units.length];
        render();
    }

    function typeText(element, value, delay = 22) {
        if (!element) return;
        element.textContent = "";
        let index = 0;
        function next() {
            if (!element.isConnected) return;
            if (index >= value.length) {
                element.textContent = value;
                return;
            }
            element.textContent += value[index++];
            const timer = setTimeout(() => {
                typingTimers.delete(timer);
                next();
            }, delay);
            typingTimers.add(timer);
        }
        next();
    }

    function introduceTerm(term, unitKey) {
        if (!isTeacher) return;
        const alreadyIntroduced = introducedTermsForUnit(unitKey).some(item => normalizeKey(item) === normalizeKey(term));
        if (alreadyIntroduced) return;
        introducedByUnit[unitKey].push(term);
        saveIntroductionProgress();
        render(term);
    }

    function createCard(term, introduced, definitionMap, animateDefinition = false) {
        const card = document.createElement("article");
        card.className = `term-card ${introduced ? "introduced-term" : "future-term"}`;
        card.dataset.term = term;
        const name = document.createElement("div");
        name.className = "term-name";
        name.textContent = term;
        card.appendChild(name);

        if (introduced) {
            const definition = document.createElement("div");
            definition.className = "definition";
            const fullDefinition = definitionMap.get(normalizeKey(term)) || "Definition not entered yet.";
            if (animateDefinition) {
                definition.textContent = "";
                card.classList.add("just-introduced");
                card.appendChild(definition);
                requestAnimationFrame(() => typeText(definition, fullDefinition));
            } else {
                definition.textContent = fullDefinition;
                card.appendChild(definition);
            }

            const reveal = document.createElement("button");
            reveal.className = "reveal-btn";
            reveal.type = "button";
            reveal.setAttribute("aria-label", "Reveal term temporarily");
            reveal.innerHTML = '<img src="../icons/magnifying-glass.png" alt="">';
            reveal.addEventListener("click", event => {
                event.stopPropagation();
                card.classList.add("term-revealed");
                reveal.style.display = "none";
            });
            card.appendChild(reveal);
        } else if (isTeacher) {
            card.setAttribute("role", "button");
            card.setAttribute("tabindex", "0");
            card.setAttribute("aria-label", `Introduce ${term}`);
            card.title = "Click to introduce this term";
            card.addEventListener("click", () => introduceTerm(term, selectedUnit));
            card.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    introduceTerm(term, selectedUnit);
                }
            });
        }
        return card;
    }

    function render(animatedTerm = null) {
        const units = visibleUnits();
        if (!isTeacher && units.length && !units.includes(selectedUnit)) selectedUnit = units[units.length - 1];
        if (isTeacher && !termsByUnit[selectedUnit]?.length) selectedUnit = units[0] || "unit1";

        const introduced = introducedTermsForUnit(selectedUnit);
        const future = isTeacher ? futureTermsForUnit(selectedUnit) : [];
        const definitionMap = new Map((definitionsByUnit[selectedUnit] || []).map(item => [normalizeKey(item.Term), item.Definition]));

        termList.replaceChildren();
        unitTitle.textContent = unitLabels[selectedUnit] || "Unit";
        previousUnit.disabled = units.length < 2;
        nextUnit.disabled = units.length < 2;

        if (!introduced.length && !future.length) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = isTeacher ? "There are no terms in this unit." : "No vocabulary has been introduced yet.";
            termList.appendChild(empty);
        } else {
            introduced.forEach(term => termList.appendChild(createCard(term, true, definitionMap, normalizeKey(term) === normalizeKey(animatedTerm || ""))));
            future.forEach(term => termList.appendChild(createCard(term, false, definitionMap)));
        }

        const totalIntroduced = unitKeys.reduce((sum, key) => sum + introducedTermsForUnit(key).length, 0);
        const totalFuture = unitKeys.reduce((sum, key) => sum + futureTermsForUnit(key).length, 0);
        termCount.textContent = isTeacher
            ? `${introduced.length} introduced · ${future.length} not yet introduced in ${unitLabels[selectedUnit]}\n${totalIntroduced} introduced · ${totalFuture} remaining overall`
            : `${introduced.length} terms in ${unitLabels[selectedUnit]}\n${totalIntroduced} introduced terms total`;
        document.body.classList.toggle("hidden-mode", hiddenMode);
    }

    function shuffleIntroducedCards() {
        const cards = [...termList.querySelectorAll(".introduced-term")];
        if (cards.length < 2) return;
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        const firstFuture = termList.querySelector(".future-term");
        cards.forEach(card => termList.insertBefore(card, firstFuture));
    }

    function toggleHiddenMode() {
        hiddenMode = !hiddenMode;
        const icon = document.getElementById("hiddenModeIcon");
        if (hiddenMode) {
            document.querySelectorAll(".introduced-term").forEach(card => card.classList.remove("term-revealed"));
            document.body.classList.add("hidden-mode");
            if (icon) icon.src = "../icons/hidden-on.png";
        } else {
            document.body.classList.remove("hidden-mode");
            if (icon) icon.src = "../icons/hidden-off.png";
        }
    }

    function downloadTextFile(filename, content, type = "text/javascript;charset=utf-8") {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function jsArray(name, values) {
        return `const ${name} = [\n${values.map(value => `    ${JSON.stringify(value)},`).join("\n")}\n];\n`;
    }

    function introducedGlossary() {
        const result = [];
        for (const key of unitKeys) {
            const definitionMap = new Map((definitionsByUnit[key] || []).map(item => [normalizeKey(item.Term), item]));
            for (const term of introducedTermsForUnit(key)) {
                const item = definitionMap.get(normalizeKey(term));
                if (item) result.push(item);
            }
        }
        return result;
    }

    function buildTermsJs() {
        let output = "// Generated by the AP Terms page. Contains introduced terms only.\n";
        for (const key of unitKeys) output += jsArray(key, introducedTermsForUnit(key)) + "\n";
        output += "const theglossary = [\n" + introducedGlossary().map(item =>
            `    {"Term":${JSON.stringify(item.Term)},"Definition":${JSON.stringify(item.Definition)}},`
        ).join("\n") + "\n];\n";
        return output;
    }

    function shiftString(value, shift) {
        return String(value).split("").map(char => {
            if (!/[a-zA-Z]/.test(char)) return char;
            const code = char.charCodeAt(0);
            const base = char >= "a" ? 97 : 65;
            return String.fromCharCode((code - base + shift) % 26 + base);
        }).join("");
    }

    function toBase64(value) {
        return btoa(unescape(encodeURIComponent(value)));
    }

    function buildScrambledVocabJs(items) {
        const scrambled = items.map(item => ({
            Term: toBase64(shiftString(item.Term, 3)),
            Definition: toBase64(shiftString(item.Definition, 3))
        }));
        return `const scrambledVocabularyTerms = ${JSON.stringify(scrambled, null, 2)};\n`;
    }

    function buildCsv(rows) {
        const escape = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
        return "\uFEFF" + rows.map(row => row.map(escape).join(",")).join("\r\n");
    }

    function downloadUpdatedList() {
        const termsContent = buildTermsJs();
        const vocab = introducedGlossary();
        downloadTextFile("terms.js", termsContent);
        downloadTextFile("scrambled-vocab.js", buildScrambledVocabJs(vocab));

        const rows = [["terms", "definitions"]];
        const definitionMap = new Map((definitionsByUnit[selectedUnit] || []).map(item => [normalizeKey(item.Term), item.Definition]));
        for (const term of introducedTermsForUnit(selectedUnit)) {
            rows.push([term, definitionMap.get(normalizeKey(term)) || "Definition not entered yet."]);
        }
        downloadTextFile(`${unitLabels[selectedUnit]} - Terms.csv`, buildCsv(rows), "text/csv;charset=utf-8;");
        pageStatus.textContent = "Downloaded terms.js, scrambled-vocab.js, and the selected unit's introduced-terms CSV.";
    }

    previousUnit.addEventListener("click", () => moveUnit(-1));
    nextUnit.addEventListener("click", () => moveUnit(1));
    downloadBoth.addEventListener("click", downloadUpdatedList);
    hiddenModeToggle.addEventListener("click", toggleHiddenMode);
    shuffleButton.addEventListener("click", shuffleIntroducedCards);

    document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const target = event.target;
        if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target instanceof HTMLSelectElement || target.isContentEditable) return;
        const key = event.key.toLowerCase();
        if (key === "s") shuffleIntroducedCards();
        else if (key === "h") toggleHiddenMode();
        else if (key === "arrowleft" || key === "arrowright") {
            event.preventDefault();
            moveUnit(key === "arrowleft" ? -1 : 1);
        }
    });

    window.addEventListener("biph-login-changed", loadForCurrentRole);
    window.addEventListener("storage", event => {
        if (event.key === STORAGE_KEY) {
            loadIntroductionProgress();
            render();
        } else if (event.key === "biph_user_role" || event.key === "biph_student_name") {
            loadForCurrentRole();
        }
    });

    loadForCurrentRole();
})();
</script>
</body>
</html>
