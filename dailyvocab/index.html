<script>
// Unicode-safe base64 encoding and decoding functions
function unicodeToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    const binary = Array.from(
        utf8Bytes,
        byte => String.fromCharCode(byte)
    ).join('');
    return btoa(binary);
}

function base64ToUnicode(base64) {
    const binary = atob(base64);
    const bytes = Uint8Array.from(
        binary,
        char => char.charCodeAt(0)
    );
    return new TextDecoder().decode(bytes);
}

function unscrambleTerms(scrambledArray) {
    function unshiftString(str, shift) {
        return str.split('').map(char => {
            if (char.match(/[a-zA-Z]/)) {
                const code = char.charCodeAt(0);
                const base = char >= 'a' ? 97 : 65;

                return String.fromCharCode(
                    (code - base - shift + 26) % 26 + base
                );
            }

            return char;
        }).join('');
    }

    return scrambledArray.map(item => {
        const decodedTerm = base64ToUnicode(item.Term);
        const decodedDef = base64ToUnicode(item.Definition);

        return {
            Term: unshiftString(decodedTerm, 3),
            Definition: unshiftString(decodedDef, 3)
        };
    });
}

const vocabularyTerms = unscrambleTerms(scrambledVocabularyTerms);

// Use apStudents from apstudents.js
let approvedStudents =
    typeof apStudents !== 'undefined' ? apStudents : [];

let currentStudent = '';
let questionBank = {};
let answers = [];
let usedTerms = {};

let selectedQuestion = null;
let selectedWord = null;


// ==================== INITIAL PAGE LOAD ====================

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const resultsParam = urlParams.get('results');

    if (resultsParam) {
        try {
            const decodedData =
                base64ToUnicode(decodeURIComponent(resultsParam));

            const resultData = JSON.parse(decodedData);

            if (resultData.questions) {
                resultData.questionSet = {
                    questions: resultData.questions.map(q => ({
                        Definition: q.definition
                    })),
                    answers: resultData.questions.map(
                        q => q.correctAnswer
                    )
                };

                resultData.answers =
                    resultData.questions.map(q => q.studentAnswer);

                resultData.student =
                    resultData.student || "Unknown";

                resultData.date =
                    resultData.date || "N/A";

                resultData.time =
                    resultData.time || "N/A";

            } else if (resultData.s) {
                resultData.student = resultData.s;
                resultData.date = resultData.d;
                resultData.time = resultData.t;
                resultData.p = resultData.p;
            }

            document.getElementById('login-section')
                .classList.add('hidden');

            document.getElementById('quiz-section')
                .classList.remove('hidden');

            document.querySelector('.quiz-actions')
                .classList.add('hidden');

            document.getElementById('results-section')
                .classList.remove('hidden');

            displayResults(resultData, true);

            window.scrollTo({ top: 10 });

        } catch (err) {
            console.error(
                'Failed to decode results from URL:',
                err
            );

            alert('Invalid results URL');
        }

        return;
    }
});


function capitalizeName(name) {
    return name.trim().split(' ').map(
        w =>
            w.charAt(0).toUpperCase() +
            w.slice(1).toLowerCase()
    ).join(' ');
}


function generateQuestionSet(student) {
    const shuffledQuestions =
        [...vocabularyTerms]
            .sort(() => Math.random() - 0.5)
            .slice(0, 10);

    const sortedTerms =
        [...shuffledQuestions.map(q => q.Term)]
            .sort((a, b) => a.localeCompare(b));

    return {
        questions: shuffledQuestions,
        terms: sortedTerms,
        answers: shuffledQuestions.map(q => q.Term)
    };
}


// ==================== QUESTION SELECTION ====================

function selectQuestion(index, focusInput = true) {
    clearSelections();

    selectedQuestion = index;
    lastSelectedIndex = index;

    const qBox = document.querySelectorAll('.question-box')[index];
    const input = document.getElementById(`answer-${index}`);

    if (qBox) {
        // Clicking the question itself highlights it.
        qBox.classList.add('selected');

        const rect = qBox.getBoundingClientRect();

        // The questions column has its own scroll position.
        // Do not scroll the page when a question is selected.
        scrollQuestionToBox(qBox);
    }

    if (focusInput && input) {
        // Remember that the textbox is being focused
        // because the question box was clicked.
        input.dataset.focusFromQuestion = 'true';

        input.focus();

        input.setSelectionRange(
            input.value.length,
            input.value.length
        );

        updateInputWidth(input);
        updateTypingHighlights(input);
    }
}


function selectWord(index) {
    const buttons =
        Array.from(
            document.querySelectorAll('.word-bank button')
        );

    if (!buttons[index]) return;

    buttons.forEach(b =>
        b.classList.remove(
            'selected',
            'keyboard-highlight'
        )
    );

    selectedWord = index;

    buttons[index].classList.add(
        'selected',
        'keyboard-highlight'
    );

    // Scroll only the word-bank column, never the page.
    scrollWordBankToButton(
        buttons[index],
        'smooth'
    );
}


function clearSelections() {
    document.querySelectorAll('.question-box')
        .forEach(q =>
            q.classList.remove('selected')
        );

    document.querySelectorAll('.word-bank button')
        .forEach(b =>
            b.classList.remove(
                'selected',
                'keyboard-highlight'
            )
        );

    selectedQuestion = null;
    selectedWord = null;
}


// ==================== MATCHING WORDS ====================

function makeMatch(qIndex, wIndex) {
    const input = document.getElementById(`answer-${qIndex}`);
    const term = questionBank[currentStudent]?.terms?.[wIndex];

    if (!input || !term) return;

    input.value = term;
    input.dataset.committed = term;

    input.classList.remove('invalid-input');

    updateInputWidth(input);

    lastSelectedIndex = qIndex;

    updateAllAnswerStates();

    resetWordBankScrollFreedom();

    clearSelections();

    const qBox = input.closest('.question-box');
    if (qBox) {
        qBox.classList.remove('selected');
    }
}


// ==================== COMMIT TYPED ANSWER ====================

function commitTypedAnswer(index) {
    const input =
        document.getElementById(`answer-${index}`);

    if (!input) return false;

    const typed = input.value.trim();

    const terms =
        questionBank[currentStudent]?.terms || [];

    const exactMatch = terms.find(
        term =>
            term.toLowerCase() ===
            typed.toLowerCase()
    );

    const prefixMatches = terms.filter(
        term =>
            !usedTerms[term.toLowerCase()] &&
            term.toLowerCase()
                .startsWith(typed.toLowerCase())
    );

    const term =
        exactMatch ||
        (
            prefixMatches.length === 1
                ? prefixMatches[0]
                : null
        );

    if (!term) {
        // Empty input should never be red.
        // Non-empty invalid input should be red.
        if (typed) {
            input.classList.add('invalid-input');
        } else {
            input.classList.remove('invalid-input');
        }

        return false;
    }

    input.value = term;
    input.dataset.committed = term;

    input.classList.remove('invalid-input');

    updateInputWidth(input);

    lastSelectedIndex = index;

    updateAllAnswerStates();

    // Clear selection but KEEP TEXTBOX FOCUSED.
    clearSelections();

    input.focus();

    input.setSelectionRange(
        input.value.length,
        input.value.length
    );

    updateWordBank('');

    return true;
}


// ==================== CLEAR ANSWER ====================

function clearAnswer(index) {
    const input =
        document.getElementById(`answer-${index}`);

    if (!input) return;

    input.value = '';

    delete input.dataset.committed;

    input.classList.remove(
        'invalid-input',
        'duplicate-input'
    );

    updateInputWidth(input);
    updateAllAnswerStates();
    updateWordBank('');
}


// ==================== INPUT WIDTH ====================

function updateInputWidth(input) {
    const canvas =
        updateInputWidth.canvas ||
        (
            updateInputWidth.canvas =
            document.createElement('canvas')
        );

    const ctx = canvas.getContext('2d');

    if (!ctx) return;

    const style = getComputedStyle(input);

    ctx.font =
        `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;

    const textWidth =
        ctx.measureText(input.value || '').width;

    input.style.width =
        `${Math.max(120, Math.ceil(textWidth))}px`;
}


// ==================== ANSWER STATES ====================

function updateAllAnswerStates() {
    const inputs =
        Array.from(
            document.querySelectorAll('.answer-input')
        );

    const buttons =
        Array.from(
            document.querySelectorAll('.word-bank button')
        );

    const terms =
        questionBank[currentStudent]?.terms || [];

    inputs.forEach(input => {
        input.classList.remove('duplicate-input');
    });

    buttons.forEach(button => {
        button.classList.remove(
            'used',
            'duplicate',
            'possible',
            'filtered-out',
            'selected',
            'keyboard-highlight'
        );

        button.style.opacity = '1';
        button.style.backgroundColor =
            'rgba(255, 255, 255, 0.1)';
        button.style.color = 'white';
    });

    const usedCounts = {};

    inputs.forEach((input, idx) => {
        const committed =
            input.dataset.committed;

        if (!committed) return;

        const key =
            committed.toLowerCase();

        if (!usedCounts[key]) {
            usedCounts[key] = [];
        }

        usedCounts[key].push(idx);
    });

    Object.entries(usedCounts).forEach(
        ([key, positions]) => {
            const termIndex =
                terms.findIndex(
                    term =>
                        term.toLowerCase() === key
                );

            const button =
                termIndex >= 0
                    ? buttons[termIndex]
                    : null;

            if (positions.length > 1) {
                positions.forEach(position => {
                    inputs[position]
                        .classList.add(
                            'duplicate-input'
                        );
                });

                if (button) {
                    button.classList.add('duplicate');
                    button.style.opacity = '1';
                }

            } else if (button) {
                button.classList.add('used');
                button.style.opacity = '0.4';
            }
        }
    );

    answers =
        inputs.map(
            input =>
                input.dataset.committed || ''
        );

    usedTerms = {};

    answers.forEach((answer, idx) => {
        if (!answer) return;

        const key =
            answer.toLowerCase();

        if (!usedTerms[key]) {
            usedTerms[key] = [];
        }

        usedTerms[key].push(idx + 1);
    });
}


// ==================== WORD BANK SCROLLING ====================


function scrollQuestionToBox(box, behavior = 'smooth') {
    const container =
        document.querySelector('.questions-container');

    if (!container || !box) return;

    const containerRect =
        container.getBoundingClientRect();

    const boxRect =
        box.getBoundingClientRect();

    const padding = 10;

    if (boxRect.top < containerRect.top + padding) {
        container.scrollBy({
            top:
                boxRect.top -
                containerRect.top -
                padding,
            behavior
        });

    } else if (
        boxRect.bottom >
        containerRect.bottom - padding
    ) {
        container.scrollBy({
            top:
                boxRect.bottom -
                containerRect.bottom +
                padding,
            behavior
        });
    }
}


function scrollWordBankToButton(button, behavior = 'smooth') {
    const container =
        document.querySelector('.word-bank-container');

    if (!container || !button) return;

    const containerRect =
        container.getBoundingClientRect();

    const buttonRect =
        button.getBoundingClientRect();

    const padding = 10;

    if (buttonRect.top < containerRect.top + padding) {
        container.scrollBy({
            top:
                buttonRect.top -
                containerRect.top -
                padding,
            behavior
        });

    } else if (
        buttonRect.bottom >
        containerRect.bottom - padding
    ) {
        container.scrollBy({
            top:
                buttonRect.bottom -
                containerRect.bottom +
                padding,
            behavior
        });
    }
}


function scrollHighlightedWordBankButtons(buttons) {
    if (!buttons?.length) return;

    const highlighted =
        buttons.filter(button =>
            button.classList.contains('possible') ||
            button.classList.contains('keyboard-highlight')
        );

    if (!highlighted.length) return;

    const target = highlighted[0];

    const container =
        document.querySelector('.word-bank-container');

    if (!container) return;

    const vv = window.visualViewport;

    const viewportTop =
        vv ? vv.offsetTop : 0;

    const viewportHeight =
        vv ? vv.height : window.innerHeight;

    // Put the highlighted word around 40% down the
    // ACTUAL visible viewport. This works much better
    // when the iPad keyboard is open.
    const desiredY =
        viewportTop + viewportHeight * 0.40;

    const rect =
        target.getBoundingClientRect();

    const wordCenter =
        (rect.top + rect.bottom) / 2;

    let scrollAmount =
        wordCenter - desiredY;

    // Keep the scroll amount within the word bank's
    // actual scrollable range.
    const maxScroll =
        container.scrollHeight -
        container.clientHeight;

    const newScrollTop =
        Math.max(
            0,
            Math.min(
                container.scrollTop + scrollAmount,
                maxScroll
            )
        );

    scrollAmount =
        newScrollTop - container.scrollTop;

    if (Math.abs(scrollAmount) > 1) {
        container.scrollBy({
            top: scrollAmount,
            behavior: 'smooth'
        });
    }

    // iPad Safari can finish resizing the visual viewport
    // slightly after the keyboard appears. Recheck once.
    setTimeout(() => {
        const finalVV =
            window.visualViewport;

        const finalViewportTop =
            finalVV ? finalVV.offsetTop : 0;

        const finalViewportHeight =
            finalVV ? finalVV.height : window.innerHeight;

        const finalDesiredY =
            finalViewportTop +
            finalViewportHeight * 0.40;

        const finalRect =
            target.getBoundingClientRect();

        const finalWordCenter =
            (finalRect.top + finalRect.bottom) / 2;

        let finalScrollAmount =
            finalWordCenter - finalDesiredY;

        const finalMaxScroll =
            container.scrollHeight -
            container.clientHeight;

        const finalScrollTop =
            Math.max(
                0,
                Math.min(
                    container.scrollTop +
                    finalScrollAmount,
                    finalMaxScroll
                )
            );

        finalScrollAmount =
            finalScrollTop -
            container.scrollTop;

        if (Math.abs(finalScrollAmount) > 1) {
            container.scrollBy({
                top: finalScrollAmount,
                behavior: 'smooth'
            });
        }
    }, 300);
}


// ==================== TYPING HIGHLIGHTS ====================

function updateTypingHighlights(input) {
    const buttons = Array.from(
        document.querySelectorAll('.word-bank button')
    );
    const terms = questionBank[currentStudent]?.terms || [];
    const typed = input.value.trim().toLowerCase();

    if (input.dataset.committed) {
        input.classList.remove(
            'invalid-input',
            'duplicate-input'
        );
        return;
    }

    buttons.forEach(button => {
        button.classList.remove(
            'possible',
            'keyboard-highlight'
        );
    });

    selectedWord = null;

    if (!typed) {
        input.classList.remove(
            'invalid-input',
            'duplicate-input'
        );
        resetWordBankScrollFreedom();
        return;
    }

    const matches = terms
        .map((term, index) => ({
            term,
            index
        }))
        .filter(item =>
            item.term
                .toLowerCase()
                .startsWith(typed)
        );

    const exactMatch = terms.find(
        term =>
            term.toLowerCase() === typed
    );

    const isDuplicate =
        exactMatch &&
        !!usedTerms[
            exactMatch.toLowerCase()
        ];

    input.classList.remove('invalid-input');

    if (isDuplicate) {
        input.classList.add('duplicate-input');
    } else {
        input.classList.remove('duplicate-input');

        if (matches.length === 0) {
            input.classList.add('invalid-input');
        }
    }

    matches.forEach(match => {
        const button = buttons[match.index];

        if (!button) return;

        button.classList.add('possible');
        button.style.opacity = '1';
    });

    if (matches.length === 1) {
        selectedWord = matches[0].index;
        buttons[selectedWord]?.classList.add(
            'keyboard-highlight'
        );

        scrollHighlightedWordBankButtons(buttons);
    } else {
        resetWordBankScrollFreedom();
    }
}


// ==================== INITIALIZE QUIZ ====================

function initializeQuiz() {
    const quizQuestionsDiv =
        document.getElementById(
            'quiz-questions'
        );

    const wordBankDiv =
        document.getElementById(
            'word-bank'
        );

    quizQuestionsDiv.innerHTML = '';
    wordBankDiv.innerHTML = '';

    answers = [];
    usedTerms = {};

    selectedQuestion = null;
    selectedWord = null;
    lastSelectedIndex = -1;

    const studentQuestions =
        questionBank[currentStudent];


    // ==================== QUESTIONS ====================

    studentQuestions.questions.forEach(
        (question, index) => {
            const questionDiv =
                document.createElement('div');

            questionDiv.className =
                'question-box';

            questionDiv.tabIndex = -1;

            questionDiv.innerHTML = `
                <div class="question-label">
                    <strong>${index + 1}.</strong>
                    <input type="text"
                           id="answer-${index}"
                           class="answer-input"
                           autocomplete="off"
                           spellcheck="false">
                </div>

                <div class="question-text">
                    ${question.Definition}
                </div>
            `;

            const input =
                questionDiv.querySelector(
                    '.answer-input'
                );


            // ==================== QUESTION CLICK ====================

            questionDiv.addEventListener('click', e => {
                if (e.target === input) return;

                // If a word is currently selected, clicking the question
                // immediately puts that word into this question.
                if (selectedWord !== null) {
                    makeMatch(index, selectedWord);
                } else {
                    selectQuestion(index, false);
                }
            });


            // ==================== INPUT FOCUS ====================

            input.addEventListener('focus', () => {
                selectedQuestion = index;
                lastSelectedIndex = index;

                if (input.dataset.focusFromQuestion === 'true') {
                    // The question box itself was clicked.
                    // Keep its yellow highlight.
                    delete input.dataset.focusFromQuestion;
                } else {
                    // Directly clicking/focusing the textbox should
                    // NOT highlight the question.
                    document.querySelectorAll('.question-box').forEach(q => {
                        q.classList.remove('selected');
                    });
                }

                // Show predictions for whatever is currently being typed.
                updateTypingHighlights(input);
            });


            // ==================== INPUT ====================

            input.addEventListener('input', () => {
                // The moment the student changes a committed answer,
                // it becomes an uncommitted typed answer again.
                delete input.dataset.committed;

                input.classList.remove('duplicate-input');

                selectedQuestion = index;
                lastSelectedIndex = index;

                updateAllAnswerStates();

                // Now prediction highlighting takes over.
                updateTypingHighlights(input);
            });


            quizQuestionsDiv.appendChild(
                questionDiv
            );

            updateInputWidth(input);
        }
    );


    // ==================== WORD BANK ====================

    studentQuestions.terms.forEach(
        (term, index) => {
            const button =
                document.createElement('button');

            // No A., B., C. prefixes.
            button.textContent = term;

            button.dataset.index = index;
            button.tabIndex = -1;

            button.addEventListener(
                'click',
                () => {
                    if (selectedQuestion !== null) {
                        makeMatch(
                            selectedQuestion,
                            index
                        );

                    } else if (
                        lastSelectedIndex >= 0
                    ) {
                        makeMatch(
                            lastSelectedIndex,
                            index
                        );

                    } else {
                        selectWord(index);
                    }
                }
            );

            wordBankDiv.appendChild(button);
        }
    );

    updateAllAnswerStates();

    // Make absolutely sure nothing is focused
    // or highlighted on initial quiz creation.
    clearSelections();

    document
        .querySelectorAll('.answer-input')
        .forEach(input => input.blur());

    document.activeElement?.blur();
}

// ==================== WORD CANDIDATES ====================

function getCandidateWordIndices() {
    const terms =
        questionBank[currentStudent]?.terms || [];

    const input =
        document.activeElement
            ?.classList.contains('answer-input')
            ? document.activeElement
            : (
                selectedQuestion !== null
                    ? document.getElementById(
                        `answer-${selectedQuestion}`
                    )
                    : null
            );

    const prefix =
        input
            ? input.value.trim().toLowerCase()
            : '';

    return terms
        .map((term, i) => ({
            term,
            i
        }))
        .filter(item =>
            !usedTerms[
                item.term.toLowerCase()
            ] &&
            (
                !prefix ||
                item.term
                    .toLowerCase()
                    .startsWith(prefix)
            )
        )
        .map(item => item.i);
}


function moveWordSelection(direction) {
    const candidates =
        getCandidateWordIndices();

    if (!candidates.length) return;

    let currentPos =
        candidates.indexOf(selectedWord);

    if (currentPos < 0) {
        currentPos =
            direction > 0
                ? -1
                : candidates.length;
    }

    let nextPos =
        currentPos + direction;

    if (
        nextPos >= candidates.length
    ) {
        nextPos = 0;
    }

    if (nextPos < 0) {
        nextPos =
            candidates.length - 1;
    }

    const nextIndex =
        candidates[nextPos];

    selectWord(nextIndex);

    const button =
        document.querySelectorAll(
            '.word-bank button'
        )[nextIndex];

    if (button) {
        button.classList.add(
            'keyboard-highlight'
        );

        // Keep keyboard navigation inside the word-bank
        // scroll area instead of scrolling the page.
        scrollWordBankToButton(
            button,
            'smooth'
        );
    }
}


// ==================== GLOBAL KEYBOARD ====================

document.addEventListener(
    'keydown',
    e => {
        const inputs =
            Array.from(
                document.querySelectorAll(
                    '.answer-input'
                )
            );

        if (!inputs.length) return;

        const currentInput =
            document.activeElement;

        const currentIndex =
            inputs.indexOf(currentInput);

        const submitButton =
            document.querySelector(
                '.quiz-actions .action-button'
            );

        const isSubmitFocused =
            submitButton === currentInput;


        // ==================== ESCAPE ====================

        if (e.key === 'Escape') {
            e.preventDefault();

            clearSelections();

            if (
                currentInput?.classList
                    .contains('answer-input')
            ) {
                currentInput.blur();
            }

            updateWordBank('');

            return;
        }


        // ==================== TAB ====================

        if (e.key === 'Tab') {
            e.preventDefault();

            let baseIndex =
                currentIndex >= 0
                    ? currentIndex
                    : lastSelectedIndex;

            // IMPORTANT:
            // If nothing has been selected/focused yet,
            // the first Tab goes to question 1.
            if (baseIndex < 0) {
                baseIndex = -1;
            }

            let targetIndex;

            if (e.shiftKey) {
                if (baseIndex <= 0) {
                    // Nothing before question 1.
                    return;
                }

                targetIndex =
                    baseIndex - 1;

            } else if (
                baseIndex < inputs.length - 1
            ) {
                targetIndex =
                    baseIndex + 1;

            } else {
                targetIndex = null;
            }


            // Submit button is currently focused.
            if (isSubmitFocused) {
                if (e.shiftKey) {
                    focusQuestion(
                        inputs.length - 1
                    );
                }

                return;
            }


            // Move to Submit after final question.
            if (targetIndex === null) {
                focusSubmitButton();

            } else {
                focusQuestion(
                    targetIndex
                );
            }

            return;
        }


        // ==================== ARROW KEYS ====================

        if (
            e.key === 'ArrowDown' ||
            e.key === 'ArrowUp'
        ) {
            if (
                currentIndex < 0 &&
                selectedQuestion === null &&
                selectedWord === null
            ) {
                return;
            }

            e.preventDefault();

            keyboardCandidates =
                getCandidateWordIndices();

            if (
                !keyboardCandidates.length
            ) {
                return;
            }

            moveWordSelection(
                e.key === 'ArrowDown'
                    ? 1
                    : -1
            );

            return;
        }


        // ==================== ENTER ====================

        if (e.key === 'Enter') {
            e.preventDefault();

            // If the Submit button is focused, submit the quiz.
            if (submitButton === currentInput) {
                submitQuiz();
                return;
            }

            // If an answer input is active,
            // use the selected word or commit typed text.
            if (currentIndex >= 0) {

                if (selectedWord !== null) {
                    const terms =
                        questionBank[
                            currentStudent
                        ].terms;

                    const typed =
                        currentInput.value
                            .trim()
                            .toLowerCase();

                    if (
                        !typed ||
                        terms[selectedWord]
                            .toLowerCase()
                            .startsWith(typed)
                    ) {
                        makeMatch(
                            currentIndex,
                            selectedWord
                        );

                    } else {
                        commitTypedAnswer(
                            currentIndex
                        );
                    }

                } else {
                    commitTypedAnswer(
                        currentIndex
                    );
                }

                return;
            }


            // If a word is selected with no input
            // focused, apply it to the most recent question.
            if (
                selectedWord !== null &&
                lastSelectedIndex >= 0
            ) {
                makeMatch(
                    lastSelectedIndex,
                    selectedWord
                );
            }
        }
    }
);

// ==================== SUBMIT QUIZ ====================

function submitQuiz() {
    const hasBlankAnswers =
        answers.some(
            answer => !answer
        );

    const usedCounts = {};

    answers.forEach(answer => {
        if (answer) {
            usedCounts[answer] =
                (usedCounts[answer] || 0) + 1;
        }
    });

    const duplicateAnswers =
        Object.keys(usedCounts)
            .filter(
                term =>
                    usedCounts[term] > 1
            );


    if (
        hasBlankAnswers &&
        duplicateAnswers.length > 0
    ) {
        if (
            !confirm(
                'There are blank answers and duplicate responses.\nWould you still like to proceed?'
            )
        ) return;

    } else if (hasBlankAnswers) {
        if (
            !confirm(
                'There are some questions left blank.\nWould you still like to proceed?'
            )
        ) return;

    } else if (
        duplicateAnswers.length > 0
    ) {
        if (
            !confirm(
                'There are duplicate responses (each word should only be used once).\n\nWould you still like to proceed?'
            )
        ) return;
    }


    const resultData =
        prepareResultData();

    displayResults(
        resultData,
        false
    );

    document
        .querySelector('.quiz-container')
        .classList.add('hidden');

    document
        .querySelector('.quiz-actions')
        .classList.add('hidden');

    document
        .getElementById('results-section')
        .classList.remove('hidden');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


// ==================== SHARE / AIRDROP ====================

async function shareScoreEntryLink(
    resultData,
    percentage
) {
    try {
        const exportPayload = {
            student: resultData.student,
            date: resultData.date,
            time: resultData.time,
            percentage: percentage,
            exercise: "Vocab",
            termsToReview:
                resultData.termsToReview
                    .map(t => t.term)
        };

        const jsonStr =
            JSON.stringify(exportPayload);

        const base64 =
            btoa(
                unescape(
                    encodeURIComponent(
                        jsonStr
                    )
                )
            );

        const scoreEntryBase =
            'https://biphmusic.github.io/grades/';

        const deepLink =
            `${scoreEntryBase}#data=${base64}`;

        const safeName =
            (
                resultData.student ||
                'Student'
            )
                .replace(
                    /[\/\\?%*:|"<>]/g,
                    ''
                )
                .trim();

        const fileName =
            `${safeName} - Vocab, ${resultData.date}.txt`;

        const blob =
            new Blob(
                [deepLink + '\n'],
                {
                    type: 'text/plain'
                }
            );

        const file =
            new File(
                [blob],
                fileName,
                {
                    type: 'text/plain'
                }
            );


        if (
            navigator.canShare &&
            navigator.canShare({
                files: [file]
            })
        ) {
            await navigator.share({
                files: [file],
                title: fileName,
                text:
                    'Score for ' +
                    resultData.student
            });

        } else {
            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement('a');

            a.href = url;
            a.download = fileName;

            a.click();

            URL.revokeObjectURL(url);
        }

    } catch (err) {
        if (
            err.name !== 'AbortError'
        ) {
            console.error(err);
            alert(
                'Could not share the file.'
            );
        }
    }
}

// ==================== PREPARE RESULT DATA ====================

function prepareResultData() {
    const correctAnswers =
        questionBank[
            currentStudent
        ].answers;

    const allTerms =
        [...correctAnswers];

    const correctTerms =
        answers
            .map(
                (answer, index) =>
                    answer &&
                    answer.toLowerCase() ===
                    correctAnswers[index]
                        .toLowerCase()
                        ? correctAnswers[index]
                        : null
            )
            .filter(term => term);

    const termsToReview =
        allTerms.filter(
            term =>
                !correctTerms.includes(term)
        );


    return {
        student:
            capitalizeName(
                currentStudent
            ),

        date:
            new Date()
                .toISOString()
                .split('T')[0],

        time:
            new Date()
                .toLocaleTimeString(
                    [],
                    {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: true
                    }
                ),

        exercise:
            "Vocab Quiz",

        answers:
            Array.from(
                { length: 10 },
                (_, index) =>
                    answers[index] || ""
            ),

        questionSet:
            questionBank[currentStudent],

        termsToReview:
            termsToReview
                .map(term => ({
                    term,
                    definition:
                        vocabularyTerms
                            .find(
                                v =>
                                    v.Term ===
                                    term
                            )
                            ?.Definition ||
                        "Definition not found"
                }))
                .sort(
                    (a, b) =>
                        a.term.localeCompare(
                            b.term
                        )
                )
    };
}
