        .action-button.export {

        .action-button:disabled {

        .quick-action {

            align-items: center;

        .question-box {
transition: all 0.2s ease;
    cursor: pointer;
}

.question-box:hover {

}

.question-box.selected {

    border: 2px solid #ffd700;
    transform: scale(1.02);
}

.word-bank button {
    transition: all 0.2s ease;
    cursor: pointer;
    pointer-events: auto;
}

.word-bank button:hover {

}

.word-bank button.selected {
    background: rgba(255, 215, 0, 0.3) !important;
    border: 2px solid #ffd700;
}

.word-bank button.used {
    opacity: 0.4;
}

.flash {
    animation: flash 0.6s ease;
}

@keyframes flash {
    0% { background: rgba(74, 222, 128, 0.4); }

}

<script>
// Unicode-safe base64 encoding and decoding functions
function unicodeToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    const binary = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join('');
    return btoa(binary);
}

function base64ToUnicode(base64) {
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

function unscrambleTerms(scrambledArray) {
    function unshiftString(str, shift) {
        return str.split('').map(char => {
            if (char.match(/[a-zA-Z]/)) {
                const code = char.charCodeAt(0);
                const base = char >= 'a' ? 97 : 65;
                return String.fromCharCode((code - base - shift + 26) % 26 + base);
            }
            return char;
        }).join('');
    }
    return scrambledArray.map(item => {
        const decodedTerm = atob(item.Term);
        const decodedDef = atob(item.Definition);
        return {
            Term: unshiftString(decodedTerm, 3),
            Definition: unshiftString(decodedDef, 3)
        };
    });
}

const vocabularyTerms = unscrambleTerms(scrambledVocabularyTerms);

// Use apStudents from apstudents.js
let approvedStudents = typeof apStudents !== 'undefined' ? apStudents : [];

let currentStudent = '';
let questionBank = {};
let answers = [];
let usedTerms = {};

let selectedQuestion = null;
let selectedWord = null;     

// Auto-login if already signed in via menu
function autoLoginIfPossible() {
    const storedName = localStorage.getItem('biph_student_name');
    if (!storedName) return false;

    const lower = storedName.toLowerCase();
    const student = approvedStudents.find(s => 
        s.name.toLowerCase() === lower || 
        (s.altName && s.altName.toLowerCase() === lower)
    );
    
    if (student) {
        currentStudent = lower;
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        document.querySelector('.quiz-actions').classList.remove('hidden');
        
        questionBank[currentStudent] = generateQuestionSet(currentStudent);
        initializeQuiz();
        return true;
    }
    return false;
}

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const resultsParam = urlParams.get('results');
    
    if (resultsParam) {
        try {
            const decodedData = base64ToUnicode(decodeURIComponent(resultsParam));
            const resultData = JSON.parse(decodedData);

            if (resultData.questions) {
                resultData.questionSet = {
                    questions: resultData.questions.map(q => ({ Definition: q.definition })),
                    answers: resultData.questions.map(q => q.correctAnswer)
                };
                resultData.answers = resultData.questions.map(q => q.studentAnswer);
                resultData.student = resultData.student || "Unknown";
                resultData.date = resultData.date || "N/A";
                resultData.time = resultData.time || "N/A";
            } else if (resultData.s) {
                resultData.student = resultData.s;
                resultData.date = resultData.d;
                resultData.time = resultData.t;
                resultData.p = resultData.p;
            }

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.querySelector('.quiz-actions').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');
            displayResults(resultData, true);
            window.scrollTo({ top: 0 });
        } catch (err) {
            console.error('Failed to decode results from URL:', err);
            alert('Invalid results URL');
        }
        return;
    }

    autoLoginIfPossible();
});

function checkName() {
    const nameInput = document.getElementById('name-input').value.trim();
    const errorElement = document.getElementById('error-message');

    if (!nameInput) {
        errorElement.textContent = 'Please enter your name';
        return;
    }

    const lower = nameInput.toLowerCase();
    const student = approvedStudents.find(s =>
        s.name.toLowerCase() === lower || (s.altName && s.altName.toLowerCase() === lower)
    );

    if (student) {
        currentStudent = lower;
        
        // Save to localStorage so mymenu.js reflects the login
        const displayName = capitalizeName(student.name);
        localStorage.setItem('biph_student_name', displayName);
        localStorage.setItem('biph_name_timestamp', Date.now().toString());

        // Refresh the profile menu immediately
        if (typeof initMyMenu === 'function') {
            initMyMenu();
        }

        questionBank[currentStudent] = generateQuestionSet(currentStudent);
        
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');
        document.querySelector('.quiz-actions').classList.remove('hidden');
        initializeQuiz();
        document.getElementById('answer-0').focus();
    } else {
        errorElement.textContent = 'Name not found in approved list';
    }
}

function capitalizeName(name) {
    return name.trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

function generateQuestionSet(student) {
    const shuffledQuestions = [...vocabularyTerms].sort(() => Math.random() - 0.5).slice(0, 10);
    const sortedTerms = [...shuffledQuestions.map(q => q.Term)].sort((a, b) => a.localeCompare(b));
    return {
        questions: shuffledQuestions,
        terms: sortedTerms,
        answers: shuffledQuestions.map(q => q.Term)
    };
}

function isIpad() {
    return /iPad/.test(navigator.platform) || 
           (navigator.platform === 'iPhone' && 'ontouchend' in document) ||
           navigator.userAgent.includes('iPad');
}

function selectQuestion(index) {
    clearSelections();
    selectedQuestion = index;
    const qBox = document.querySelectorAll('.question-box')[index];
    if (qBox) qBox.classList.add('selected');
}

function selectWord(index) {
    clearSelections();
    selectedWord = index;
    const buttons = document.querySelectorAll('.word-bank button');
    if (buttons[index]) buttons[index].classList.add('selected');
}

function clearSelections() {
    document.querySelectorAll('.question-box').forEach(q => q.classList.remove('selected'));
    document.querySelectorAll('.word-bank button').forEach(b => b.classList.remove('selected'));
    selectedQuestion = null;
    selectedWord = null;
}

function makeMatch(qIndex, wIndex) {
    const input = document.getElementById(`answer-${qIndex}`);
    if (!input) return;

    const letter = String.fromCharCode(65 + wIndex);
    input.value = letter;

    // Update logic (same as typing)
    handleInput(input, qIndex);

    // Focus behavior (except iPad)
    if (!isIpad()) {
        input.focus();
    }

    clearSelections();
}

function clearAnswer(index) {
    const input = document.getElementById(`answer-${index}`);
    if (input) {
        input.value = '';
        handleInput(input, index);
        if (!isIpad()) input.focus();
    }
}

function initializeQuiz() {
    const quizQuestionsDiv = document.getElementById('quiz-questions');
    const wordBankDiv = document.getElementById('word-bank');
    quizQuestionsDiv.innerHTML = '';
    wordBankDiv.innerHTML = '';
    answers = [];
    usedTerms = {};
    selectedQuestion = null;
    selectedWord = null;

    const studentQuestions = questionBank[currentStudent];

    // Questions
    studentQuestions.questions.forEach((question, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-box';
        questionDiv.innerHTML = `
            <p><strong>${index + 1}. 
                <input type="text" id="answer-${index}" class="answer-input" 
                       oninput="handleInput(this, '${index}')" 
                       autocomplete="off" maxlength="1">
            </strong> ${question.Definition}</p>
        `;

        questionDiv.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT') return;

            if (selectedWord !== null) {
                makeMatch(index, selectedWord);
            } else {
                selectQuestion(index);
            }
        });

        quizQuestionsDiv.appendChild(questionDiv);
    });

    // Word Bank
    studentQuestions.terms.forEach((term, index) => {
        const button = document.createElement('button');
        button.textContent = `${String.fromCharCode(65 + index)}. ${term}`;
        button.dataset.index = index;

        button.addEventListener('click', () => {
            if (selectedQuestion !== null) {
                makeMatch(selectedQuestion, index);
            } else {
                selectWord(index);
            }
        });

        wordBankDiv.appendChild(button);
    });
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        clearSelections();
        return;
    }

    // Delete / Backspace when question is selected
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedQuestion !== null) {
        e.preventDefault();
        clearAnswer(selectedQuestion);
        return;
    }

    const questions = document.querySelectorAll('.question-box');
    const buttons = document.querySelectorAll('.word-bank button');

    // Arrow navigation
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();

        if (selectedQuestion !== null) {
            let newIndex = selectedQuestion + (e.key === 'ArrowDown' ? 1 : -1);
            if (newIndex < 0) newIndex = questions.length - 1;
            if (newIndex >= questions.length) newIndex = 0;
            selectQuestion(newIndex);
        } 
        else if (selectedWord !== null) {
            let newIndex = selectedWord + (e.key === 'ArrowDown' ? 1 : -1);
            if (newIndex < 0) newIndex = buttons.length - 1;
            if (newIndex >= buttons.length) newIndex = 0;
            selectWord(newIndex);
        }
    }

    // Type letter when question selected
    if (selectedQuestion !== null && /^[a-zA-Z]$/.test(e.key)) {
        const input = document.getElementById(`answer-${selectedQuestion}`);
        if (input) {
            input.value = e.key.toUpperCase();
            handleInput(input, selectedQuestion);
            if (!isIpad()) input.focus();
            clearSelections();
        }
    }
});

// Click outside to deselect
document.addEventListener('click', (e) => {
    if (!e.target.closest('.question-box') && !e.target.closest('.word-bank button')) {
        clearSelections();
    }
});

function handleInput(input, index) {
    const value = input.value.toUpperCase();
    const currentLetter = value.charAt(0);

    const allInputs = document.querySelectorAll('.answer-input');
    const buttons = document.querySelectorAll('.word-bank button');
    
    allInputs.forEach(input => {
        input.classList.remove('duplicate-input');
        input.classList.remove('invalid-input');
    });
    
    buttons.forEach(button => {
        button.classList.remove('used');
        button.classList.remove('duplicate');
        button.removeAttribute('data-tooltip');
        button.style.opacity = '1';
        button.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
        button.style.color = 'white';
    });

    const letterCounts = {};
    const letterPositions = {};

    allInputs.forEach((input, idx) => {
        const letter = input.value.toUpperCase().charAt(0);
        if (letter) {
            const letterIndex = letter.charCodeAt(0) - 65;
            const isValidLetter = letterIndex >= 0 && letterIndex < questionBank[currentStudent].terms.length;
            
            if (!isValidLetter) input.classList.add('invalid-input');
            
            if (isValidLetter) {
                if (!letterCounts[letter]) {
                    letterCounts[letter] = 0;
                    letterPositions[letter] = [];
                }
                letterCounts[letter]++;
                letterPositions[letter].push(idx);
            }
        }
    });

    Object.entries(letterCounts).forEach(([letter, count]) => {
        const letterIndex = letter.charCodeAt(0) - 65;
        if (letterIndex >= 0 && letterIndex < buttons.length) {
            const button = buttons[letterIndex];
            
            if (count > 1) {
                letterPositions[letter].forEach(position => {
                    const duplicateInput = document.querySelector(`#answer-${position}`);
                    duplicateInput.classList.add('duplicate-input');
                });
                button.classList.add('duplicate');
                button.setAttribute('data-tooltip', 
                    `Duplicate response in questions: ${letterPositions[letter].map(pos => pos + 1).join(', ')}`
                );
            } else {
                button.classList.add('used');
                button.style.opacity = '0.4';
                button.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                button.style.color = 'rgba(255, 255, 255, 0.4)';
            }
        }
    });

    if (currentLetter) {
        const letterIndex = currentLetter.charCodeAt(0) - 65;
        if (letterIndex >= 0 && letterIndex < questionBank[currentStudent].terms.length) {
            answers[index] = questionBank[currentStudent].terms[letterIndex];
        } else {
            answers[index] = '';
            input.classList.add('invalid-input');
        }
    } else {
        answers[index] = '';
    }

    usedTerms = {};
    allInputs.forEach((input, idx) => {
        const letter = input.value.toUpperCase().charAt(0);
        if (letter) {
            const letterIndex = letter.charCodeAt(0) - 65;
            if (letterIndex >= 0 && letterIndex < questionBank[currentStudent].terms.length) {
                const term = questionBank[currentStudent].terms[letterIndex];
                if (!usedTerms[term]) usedTerms[term] = [];
                usedTerms[term].push(idx + 1);
            }
        }
    });
}

function submitQuiz() {
    const hasBlankAnswers = [...document.querySelectorAll('.answer-input')].some(input => input.value.trim() === '');
    const duplicateAnswers = Object.keys(usedTerms).filter(term => usedTerms[term].length > 1);

    if (hasBlankAnswers && duplicateAnswers.length > 0) {
        if (!confirm('There are blank answers and duplicate responses.\nWould you still like to proceed?')) return;
    } else if (hasBlankAnswers) {
        if (!confirm('There are some questions left blank.\nWould you still like to proceed?')) return;
    } else if (duplicateAnswers.length > 0) {
        if (!confirm('There are duplicate responses (each word should only be used once).\n\nWould you still like to proceed?')) return;
    }

    const resultData = prepareResultData();
    displayResults(resultData, false);

    document.querySelector('.quiz-container').classList.add('hidden');
    document.querySelector('.quiz-actions').classList.add('hidden');
    document.getElementById('results-section').classList.remove('hidden');

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==================== DISPLAY RESULTS (with both buttons) ====================
function displayResults(resultData, isUrlView = false) {
    const resultsSection = document.getElementById('results-section');
    resultsSection.innerHTML = '';

    const title = document.createElement('h2');
    title.textContent = `Results for ${resultData.student || resultData.s}`;
    resultsSection.appendChild(title);

    const dateTime = document.createElement('p');
    dateTime.textContent = `Date: ${resultData.date || resultData.d} | Time: ${resultData.time || resultData.t}`;
    resultsSection.appendChild(dateTime);

    let percentage;
    if (isUrlView && resultData.p !== undefined) {
        percentage = resultData.p;
    } else if (resultData.questionSet && resultData.answers) {
        const correctCount = resultData.answers.filter((ans, idx) => 
            ans && ans.toLowerCase() === resultData.questionSet.answers[idx].toLowerCase()
        ).length;
        percentage = Math.round(correctCount / resultData.questionSet.answers.length * 100);
    } else {
        percentage = 'N/A';
    }

    const score = document.createElement('p');
    if (!isUrlView && resultData.questionSet && resultData.answers) {
        const correctCount = resultData.answers.filter((ans, idx) => 
            ans && ans.toLowerCase() === resultData.questionSet.answers[idx].toLowerCase()
        ).length;
        score.textContent = `Score: ${correctCount}/${resultData.questionSet.answers.length} (${percentage}%)`;
    } else {
        score.textContent = `Score: ${percentage}%`;
    }
    resultsSection.appendChild(score);

    if (!isUrlView && resultData.questionSet) {
        const table = document.createElement('table');
        table.className = 'results-table';
        table.innerHTML = `
            <tr>
                <th>#</th>
                <th>Question</th>
                <th>Your Answer</th>
                <th>Correct Answer</th>
            </tr>
            ${resultData.questionSet.questions.map((question, index) => {
                const studentAnswer = resultData.answers[index] || "";
                const correctAnswer = resultData.questionSet.answers[index];
                const isCorrect = studentAnswer.toLowerCase() === correctAnswer.toLowerCase();
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${question.Definition}</td>
                        <td class="${isCorrect ? '' : 'incorrect'}">${studentAnswer}${isCorrect ? '<span class="correct-mark">√</span>' : ''}</td>
                        <td>${correctAnswer}</td>
                    </tr>
                `;
            }).join('')}
        `;
        resultsSection.appendChild(table);
    }

    if (isUrlView) {
        const authContainer = document.createElement('div');
        authContainer.className = 'auth-container';
        authContainer.innerHTML = `<span class="auth-check">✔</span><span class="auth-text">Authentication successful</span>`;
        resultsSection.appendChild(authContainer);

        const copyScoreButton = document.createElement('button');
        copyScoreButton.className = 'copy-button';
        copyScoreButton.textContent = 'Copy Score';
        copyScoreButton.onclick = () => {
            navigator.clipboard.writeText(`${percentage}%`).then(() => {
                copyScoreButton.textContent = '√ Copied';
                setTimeout(() => copyScoreButton.textContent = 'Copy Score', 2000);
            });
        };
        resultsSection.appendChild(copyScoreButton);
    }

    if (!isUrlView) {
        const termsToReview = document.createElement('div');
        termsToReview.className = 'terms-to-review';
        
        const heading = document.createElement('h3');
        heading.textContent = (percentage === 100) ? 'Great job!' : 'Terms to Review';
        termsToReview.appendChild(heading);

        // Improved Terms to Review (no bullets, left-aligned, better spacing)
        const termsList = document.createElement('div');
        termsList.style.marginTop = '12px';
        termsList.style.textAlign = 'left';
        termsList.style.lineHeight = '1.8';           // Increased vertical spacing
        termsList.style.paddingLeft = '10px';

        resultData.termsToReview.forEach(item => {
            const termLine = document.createElement('div');
            termLine.style.marginBottom = '14px';     // Extra space between terms
            termLine.innerHTML = `<strong>${item.term}:</strong> ${item.definition}`;
            termsList.appendChild(termLine);
        });

        termsToReview.appendChild(termsList);
        resultsSection.appendChild(termsToReview);

        const isMobileOrTablet = /iPad|iPhone|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // PNG Button - Full original logic
        const pngButton = document.createElement('button');
        pngButton.className = 'copy-button';
        pngButton.id = 'copy-png-button';
        pngButton.textContent = isMobileOrTablet ? 'Download Results' : 'Copy Results';
        pngButton.style.display = 'block';
        pngButton.style.marginLeft = 'auto';
        pngButton.style.marginRight = 'auto';
        pngButton.style.marginTop = '20px';

        pngButton.onclick = () => {
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.backgroundColor = 'white';
            flash.style.opacity = '1';
            flash.style.zIndex = '9999';
            flash.style.transition = 'opacity 0.3s ease-out';
            document.body.appendChild(flash);

            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(flash);

                    const background = document.querySelector('.background');
                    const overlay = document.querySelector('.overlay');
                    const overlay2 = document.querySelector('.overlay2');
                    const logo = document.querySelector('.logo');
                    const copyPngBtn = document.getElementById('copy-png-button');

                    background.style.display = 'none';
                    overlay.style.display = 'none';
                    overlay2.style.display = 'none';
                    if (logo) logo.style.display = 'none'; 
                    if (copyPngBtn) copyPngBtn.style.visibility = 'hidden';

                    html2canvas(document.body, {
                        scale: 2,
                        useCORS: true,
                        scrollX: 0,
                        scrollY: 0,
                        width: document.body.scrollWidth,
                        height: document.body.scrollHeight,
                        backgroundColor: 'rgb(45, 70, 119)'
                    }).then(canvas => {
                        const logoImg = new Image();
                        logoImg.crossOrigin = 'anonymous';
                        logoImg.src = '../icons/Full Logo White on Transparent.png';

                        logoImg.onload = () => {
                            const ctx = canvas.getContext('2d');
                            const logoWidth = canvas.width * 0.25;
                            const logoHeight = (logoImg.height / logoImg.width) * logoWidth;
                            const padding = 50 * 2;
                            const x = canvas.width - logoWidth - padding;
                            const y = canvas.height - logoHeight - padding;
                            ctx.drawImage(logoImg, x, y, logoWidth, logoHeight);

                            canvas.toBlob(blob => {
                                if (isMobileOrTablet) {
                                    const link = document.createElement('a');
                                    link.download = `Vocabulary_Results_${resultData.student || resultData.s}_${resultData.date || resultData.d}.png`;
                                    link.href = URL.createObjectURL(blob);
                                    link.click();
                                    URL.revokeObjectURL(link.href);
                                } else {
                                    const item = new ClipboardItem({ 'image/png': blob });
                                    navigator.clipboard.write([item]).then(() => {
                                        pngButton.textContent = '√ Copied';
                                        setTimeout(() => {
                                            pngButton.textContent = isMobileOrTablet ? 'Download Results' : 'Copy Results';
                                        }, 2000);
                                    }).catch(err => {
                                        console.error('Failed to copy PNG:', err);
                                        if (confirm('Failed to copy. Download instead?')) {
                                            const link = document.createElement('a');
                                            link.download = `Vocabulary_Results_${resultData.student || resultData.s}_${resultData.date || resultData.d}.png`;
                                            link.href = URL.createObjectURL(blob);
                                            link.click();
                                            URL.revokeObjectURL(link.href);
                                        }
                                    });
                                }

                                background.style.display = '';
                                overlay.style.display = '';
                                overlay2.style.display = '';
                                if (logo) logo.style.display = '';
                                if (copyPngBtn) copyPngBtn.style.visibility = 'visible';
                            }, 'image/png');
                        };

                        logoImg.onerror = () => {
                            canvas.toBlob(blob => {
                                if (isMobileOrTablet) {
                                    const link = document.createElement('a');
                                    link.download = `Vocabulary_Results_${resultData.student || resultData.s}_${resultData.date || resultData.d}.png`;
                                    link.href = URL.createObjectURL(blob);
                                    link.click();
                                    URL.revokeObjectURL(link.href);
                                } else {
                                    const item = new ClipboardItem({ 'image/png': blob });
                                    navigator.clipboard.write([item]);
                                }
                                background.style.display = '';
                                overlay.style.display = '';
                                overlay2.style.display = '';
                                if (logo) logo.style.display = '';
                                if (copyPngBtn) copyPngBtn.style.visibility = 'visible';
                            }, 'image/png');
                        };
                    }).catch(err => {
                        console.error('html2canvas error:', err);
                        alert('Failed to generate image.');
                        background.style.display = '';
                        overlay.style.display = '';
                        overlay2.style.display = '';
                        if (logo) logo.style.display = '';
                        if (copyPngBtn) copyPngBtn.style.visibility = 'visible';
                    });
                }, 300);
            }, 100);
        };

        resultsSection.appendChild(pngButton);

        // Share Button (Airdrop)
        const shareButton = document.createElement('button');
        shareButton.className = 'copy-button';
        shareButton.style.marginTop = '12px';
        shareButton.style.marginLeft = 'auto';
        shareButton.style.marginRight = 'auto';
        shareButton.style.display = 'block';
        shareButton.innerHTML = '📤 Share Results (Airdrop)';
        shareButton.onclick = () => shareResultsAsPNG(resultData);
        resultsSection.appendChild(shareButton);

        // QR Code
        if (resultData.questionSet && resultData.answers) {
            const correctCount = resultData.answers.filter((ans, idx) => 
                ans && ans.toLowerCase() === resultData.questionSet.answers[idx].toLowerCase()
            ).length;
            const percentageForUrl = Math.round(correctCount / resultData.questionSet.answers.length * 100);
            const simplifiedResultData = { s: resultData.student, d: resultData.date, t: resultData.time, p: percentageForUrl };
            const jsonString = JSON.stringify(simplifiedResultData);
            const base64Data = unicodeToBase64(jsonString);
            const baseUrl = window.location.origin + window.location.pathname;
            const resultUrl = `${baseUrl}?results=${encodeURIComponent(base64Data)}`;

            const qrContainer = document.createElement('div');
            qrContainer.id = 'qr-code';
            qrContainer.style.marginTop = '20px';
            qrContainer.style.marginBottom = '-100px';
            qrContainer.style.width = '200px';
            qrContainer.style.height = '200px';
            qrContainer.style.marginLeft = 'auto';
            qrContainer.style.marginRight = 'auto';
            resultsSection.appendChild(qrContainer);

            if (typeof kjua !== 'undefined') {
                const qr = kjua({
                    text: resultUrl,
                    size: 200,
                    fill: '#303f6c',
                    back: '#FFFFFF',
                    quiet: 0,
                    ecLevel: 'M',
                    render: 'canvas'
                });
                qrContainer.appendChild(qr);
            }
        }
    }
}

async function shareResultsAsPNG(resultData) {
    try {
        const background = document.querySelector('.background');
        const overlay = document.querySelector('.overlay');
        const overlay2 = document.querySelector('.overlay2');
        const logo = document.querySelector('.logo');
        const copyPngBtn = document.getElementById('copy-png-button');

        const tempHide = [background, overlay, overlay2, logo, copyPngBtn].filter(el => el);
        tempHide.forEach(el => el.style.display = 'none');

        const canvas = await html2canvas(document.body, {
            scale: 2,
            useCORS: true,
            scrollX: 0,
            scrollY: 0,
            width: document.body.scrollWidth,
            height: document.body.scrollHeight,
            backgroundColor: 'rgb(45, 70, 119)'
        });

        const logoImg = new Image();
        logoImg.crossOrigin = 'anonymous';
        logoImg.src = '../icons/Full Logo White on Transparent.png';

        await new Promise(resolve => {
            logoImg.onload = () => {
                const ctx = canvas.getContext('2d');
                const logoWidth = canvas.width * 0.25;
                const logoHeight = (logoImg.height / logoImg.width) * logoWidth;
                const padding = 100;
                ctx.drawImage(logoImg, canvas.width - logoWidth - padding, canvas.height - logoHeight - padding, logoWidth, logoHeight);
                resolve();
            };
            logoImg.onerror = resolve;
        });

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

        tempHide.forEach(el => { if (el) el.style.display = ''; });
        if (copyPngBtn) copyPngBtn.style.visibility = 'visible';

        const file = new File([blob], `Vocabulary_Results_${resultData.student || resultData.s}_${resultData.date || resultData.d}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                files: [file],
                title: `Vocabulary Results - ${resultData.student || resultData.s}`,
                text: `Score: ${resultData.p || percentage || 'N/A'}%`
            });
        } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        console.error('Share failed:', err);
        if (err.name !== 'AbortError') {
            alert('Sharing failed. Please use the Copy/Download button.');
        }
    }
}

function prepareResultData() {
    const correctAnswers = questionBank[currentStudent].answers;
    const allTerms = [...correctAnswers];
    const correctTerms = answers
        .map((answer, index) => answer && answer.toLowerCase() === correctAnswers[index].toLowerCase() ? correctAnswers[index] : null)
        .filter(term => term);
    const termsToReview = allTerms.filter(term => !correctTerms.includes(term));

    return {
        student: capitalizeName(currentStudent),
        date: new Date().toISOString().split('T')[0],
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
        exercise: "Vocab Review",
        answers: Array.from({ length: 15 }, (_, index) => answers[index] || ""),
        questionSet: questionBank[currentStudent],
        termsToReview: termsToReview.map(term => ({
            term,
            definition: vocabularyTerms.find(v => v.Term === term)?.Definition || "Definition not found"
        })).sort((a, b) => a.term.localeCompare(b.term))
    };
}

document.addEventListener('keydown', handleInputNavigation);
document.getElementById('name-input').addEventListener('keydown', handleNameInput);

function handleInputNavigation(event) {
    const inputs = Array.from(document.querySelectorAll('.answer-input'));
    const submitButton = document.querySelector('.action-button[onclick="submitQuiz()"]');
    const currentIndex = inputs.indexOf(document.activeElement);
    const isSubmitFocused = document.activeElement === submitButton;

    if ((event.key === 'Tab' && !event.shiftKey) || event.key === 'ArrowDown') {
        if (isSubmitFocused) {
            event.preventDefault();
        } else if (currentIndex === inputs.length - 1) {
            event.preventDefault();
            submitButton.focus();
        } else if (currentIndex >= 0 && currentIndex < inputs.length - 1) {
            event.preventDefault();
            inputs[currentIndex + 1].focus();
        }
    } else if ((event.key === 'Tab' && event.shiftKey) || event.key === 'ArrowUp') {
        if (currentIndex === 0) {
            event.preventDefault();
        } else if (currentIndex > 0) {
            event.preventDefault();
            inputs[currentIndex - 1].focus();
        } else if (isSubmitFocused) {
            event.preventDefault();
            inputs[inputs.length - 1].focus();
        }
    }
}

function handleNameInput(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        checkName();
    }
}
