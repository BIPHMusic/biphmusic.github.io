<script>
// Unicode-safe base64 encoding and decoding functions
function unicodeToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    const binary = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join('');
    return btoa(binary);
}

function base64ToUnicode(base64) {
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    return new TextDecoder().decode(bytes);
}

function unscrambleTerms(scrambledArray) {
    function unshiftString(str, shift) {
        return str.split('').map(char => {
            if (char.match(/[a-zA-Z]/)) {
                const code = char.charCodeAt(0);
                const base = char >= 'a' ? 97 : 65;
                return String.fromCharCode((code - base - shift + 26) % 26 + base);
            }
            return char;          // special characters are left untouched – good
        }).join('');
    }
    return scrambledArray.map(item => {
        const decodedTerm = base64ToUnicode(item.Term);   // ← changed
        const decodedDef  = base64ToUnicode(item.Definition); // ← changed
        return {
            Term: unshiftString(decodedTerm, 3),
            Definition: unshiftString(decodedDef, 3)
        };
    });
}

const vocabularyTerms = unscrambleTerms(scrambledVocabularyTerms);

// Use apStudents from apstudents.js
let approvedStudents = typeof apStudents !== 'undefined' ? apStudents : [];

let currentStudent = '';
let questionBank = {};
let answers = [];
let usedTerms = {};

let selectedQuestion = null;
let selectedWord = null;     


document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const resultsParam = urlParams.get('results');
    
    if (resultsParam) {
        try {
            const decodedData = base64ToUnicode(decodeURIComponent(resultsParam));
            const resultData = JSON.parse(decodedData);

            if (resultData.questions) {
                resultData.questionSet = {
                    questions: resultData.questions.map(q => ({ Definition: q.definition })),
                    answers: resultData.questions.map(q => q.correctAnswer)
                };
                resultData.answers = resultData.questions.map(q => q.studentAnswer);
                resultData.student = resultData.student || "Unknown";
                resultData.date = resultData.date || "N/A";
                resultData.time = resultData.time || "N/A";
            } else if (resultData.s) {
                resultData.student = resultData.s;
                resultData.date = resultData.d;
                resultData.time = resultData.t;
                resultData.p = resultData.p;
            }

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.querySelector('.quiz-actions').classList.add('hidden');
            document.getElementById('results-section').classList.remove('hidden');
            displayResults(resultData, true);
            window.scrollTo({ top: 10 });
        } catch (err) {
            console.error('Failed to decode results from URL:', err);
            alert('Invalid results URL');
        }
        return;
    }

});


function capitalizeName(name) {
    return name.trim().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
}

function generateQuestionSet(student) {
    const shuffledQuestions = [...vocabularyTerms].sort(() => Math.random() - 0.5).slice(0, 10);
    const sortedTerms = [...shuffledQuestions.map(q => q.Term)].sort((a, b) => a.localeCompare(b));
    return {
        questions: shuffledQuestions,
        terms: sortedTerms,
        answers: shuffledQuestions.map(q => q.Term)
    };
}

function selectQuestion(index) {
    clearSelections();
    selectedQuestion = index;
    
    const questions = document.querySelectorAll('.question-box');
    const qBox = questions[index];
    
    if (qBox) {
        qBox.classList.add('selected');
        
        const rect = qBox.getBoundingClientRect();
        const isVisible = rect.top >= 0 && rect.bottom <= window.innerHeight;

        if (!isVisible) {
            qBox.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        }
    }
}

function setupInputFocusListeners() {
    document.querySelectorAll('.answer-input').forEach((input, index) => {
        input.addEventListener('focus', () => {
            selectQuestion(index);
            updateLastSelected(index);
        });
    });
}

function selectWord(index) {
    clearSelections();
    selectedWord = index;
    const buttons = document.querySelectorAll('.word-bank button');
    if (buttons[index]) buttons[index].classList.add('selected');
}

function clearSelections() {
    document.querySelectorAll('.question-box').forEach(q => q.classList.remove('selected'));
    document.querySelectorAll('.word-bank button').forEach(b => b.classList.remove('selected'));
    selectedQuestion = null;
    selectedWord = null;
}

function makeMatch(qIndex, wIndex) {
    const input = document.getElementById(`answer-${qIndex}`);
    if (!input) return;

    const letter = String.fromCharCode(65 + wIndex);
    input.value = letter;

    handleInput(input, qIndex);

    // Keep question selected after match + scroll to it
    const buttons = document.querySelectorAll('.word-bank button');
    if (buttons[wIndex]) buttons[wIndex].classList.remove('selected');
    selectedWord = null;
    
    selectQuestion(qIndex);   // This also ensures it scrolls into view
}

function clearAnswer(index) {
    const input = document.getElementById(`answer-${index}`);
    if (input) {
        input.value = '';
        handleInput(input, index);
    }
}

// ==================== INITIALIZE QUIZ ====================

function initializeQuiz() {
    const quizQuestionsDiv = document.getElementById('quiz-questions');
    const wordBankDiv = document.getElementById('word-bank');
    quizQuestionsDiv.innerHTML = '';
    wordBankDiv.innerHTML = '';
    answers = [];
    usedTerms = {};
    selectedQuestion = null;
    selectedWord = null;

    const studentQuestions = questionBank[currentStudent];

    // Questions
    studentQuestions.questions.forEach((question, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-box';
        questionDiv.tabIndex = -1;
        
        questionDiv.innerHTML = `
            <div class="question-label">
                <strong>${index + 1}.</strong>
                <input type="text" id="answer-${index}" class="answer-input" 
                       oninput="handleInput(this, '${index}')" 
                       autocomplete="off" maxlength="1">
            </div>
            <div class="question-text">
                ${question.Definition}
            </div>
        `;

        questionDiv.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (selectedWord !== null) {
                makeMatch(index, selectedWord);
            } else {
                selectQuestion(index);
            }
        });

        quizQuestionsDiv.appendChild(questionDiv);
    });

    // Word Bank
    studentQuestions.terms.forEach((term, index) => {
        const button = document.createElement('button');
        button.textContent = `${String.fromCharCode(65 + index)}. ${term}`;
        button.dataset.index = index;
        button.tabIndex = -1;                         // Disable tab navigation

        button.addEventListener('click', () => {
            if (selectedQuestion !== null) {
                makeMatch(selectedQuestion, index);
            } else {
                selectWord(index);
            }
        });

        wordBankDiv.appendChild(button);
    });

    setupInputFocusListeners();
}

// ==================== KEYBOARD SUPPORT ====================

let lastSelectedIndex = -1;

function updateLastSelected(index) {
    lastSelectedIndex = index;
}

function focusQuestion(index) {
    const input = document.getElementById(`answer-${index}`);
    if (input) {
        selectQuestion(index);
        input.focus();
        updateLastSelected(index);
    }
}

function focusSubmitButton() {
    const submitBtn = document.querySelector('.quiz-actions .action-button');
    if (submitBtn) {
        clearSelections();
        submitBtn.focus();
    }
}

// Main keyboard handler
document.addEventListener('keydown', (e) => {
    const inputs = Array.from(document.querySelectorAll('.answer-input'));
    if (inputs.length === 0) return;

    const currentInput = document.activeElement;
    const currentIndex = inputs.indexOf(currentInput);
    const isSubmitFocused = document.querySelector('.quiz-actions .action-button') === currentInput;

    // ESCAPE
    if (e.key === 'Escape') {
        e.preventDefault();
        clearSelections();
        if (currentInput?.classList.contains('answer-input')) currentInput.blur();
        return;
    }

    // ==================== TAB ====================
    if (e.key === 'Tab') {
        e.preventDefault();

        let targetIndex = 0;

        if (isSubmitFocused) {
            if (e.shiftKey) focusQuestion(inputs.length - 1);
            return;
        }

        if (currentIndex >= 0) {
            // Normal navigation between inputs
            if (e.shiftKey) {
                targetIndex = currentIndex > 0 ? currentIndex - 1 : 0;
            } else {
                targetIndex = currentIndex < inputs.length - 1 ? currentIndex + 1 : null;
            }
        } else {
            // FIRST LOAD or nothing focused → ALWAYS go to first question
            targetIndex = 0;
        }

        if (targetIndex !== null) {
            focusQuestion(targetIndex);
        } else {
            focusSubmitButton();
        }
        return;
    }

    // ==================== ARROW KEYS ====================
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (isSubmitFocused) return;

        const current = selectedQuestion ?? lastSelectedIndex ?? -1;
        const nextIndex = current + 1;

        if (nextIndex >= inputs.length) {
            focusSubmitButton();
        } else {
            focusQuestion(nextIndex);
        }
        return;
    }

    if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (isSubmitFocused) {
            focusQuestion(inputs.length - 1);
            return;
        }

        const current = selectedQuestion ?? lastSelectedIndex ?? 0;
        focusQuestion(Math.max(0, current - 1));
        return;
    }

    // Letter typing
    if (/^[a-zA-Z]$/.test(e.key) && selectedQuestion !== null) {
        const input = document.getElementById(`answer-${selectedQuestion}`);
        if (input) {
            input.value = e.key.toUpperCase();
            handleInput(input, selectedQuestion);
            updateLastSelected(selectedQuestion);
        }
    }
});

// Click outside handler
document.addEventListener('click', (e) => {
    if (!e.target.closest('.question-box') && !e.target.closest('.word-bank button')) {
        clearSelections();
    }
});

function setupInputFocusListeners() {
    document.querySelectorAll('.answer-input').forEach((input, index) => {
        input.addEventListener('focus', () => {
            selectQuestion(index);
            updateLastSelected(index);
        });
    });
}

function handleInput(input, index) {
    const value = input.value.toUpperCase();
    const currentLetter = value.charAt(0);

    const allInputs = document.querySelectorAll('.answer-input');
    const buttons = document.querySelectorAll('.word-bank button');
    
    allInputs.forEach(input => {
        input.classList.remove('duplicate-input');
        input.classList.remove('invalid-input');
    });
    
    buttons.forEach(button => {
        button.classList.remove('used');
        button.classList.remove('duplicate');
        button.style.opacity = '1';
        button.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
        button.style.color = 'white';
    });

    const letterCounts = {};
    const letterPositions = {};

    allInputs.forEach((input, idx) => {
        const letter = input.value.toUpperCase().charAt(0);
        if (letter) {
            const letterIndex = letter.charCodeAt(0) - 65;
            const isValidLetter = letterIndex >= 0 && letterIndex < questionBank[currentStudent].terms.length;
            
            if (!isValidLetter) input.classList.add('invalid-input');
            
            if (isValidLetter) {
                if (!letterCounts[letter]) {
                    letterCounts[letter] = 0;
                    letterPositions[letter] = [];
                }
                letterCounts[letter]++;
                letterPositions[letter].push(idx);
            }
        }
    });

    Object.entries(letterCounts).forEach(([letter, count]) => {
        const letterIndex = letter.charCodeAt(0) - 65;
        if (letterIndex >= 0 && letterIndex < buttons.length) {
            const button = buttons[letterIndex];
            
            if (count > 1) {
                letterPositions[letter].forEach(position => {
                    const duplicateInput = document.querySelector(`#answer-${position}`);
                    duplicateInput.classList.add('duplicate-input');
                });
                button.classList.add('duplicate');
            } else {
                button.classList.add('used');
                button.style.opacity = '0.4';
                button.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                button.style.color = 'rgba(255, 255, 255, 0.4)';
            }
        }
    });

    if (currentLetter) {
        const letterIndex = currentLetter.charCodeAt(0) - 65;
        if (letterIndex >= 0 && letterIndex < questionBank[currentStudent].terms.length) {
            answers[index] = questionBank[currentStudent].terms[letterIndex];
        } else {
            answers[index] = '';
            input.classList.add('invalid-input');
        }
    } else {
        answers[index] = '';
    }

    usedTerms = {};
    allInputs.forEach((input, idx) => {
        const letter = input.value.toUpperCase().charAt(0);
        if (letter) {
            const letterIndex = letter.charCodeAt(0) - 65;
            if (letterIndex >= 0 && letterIndex < questionBank[currentStudent].terms.length) {
                const term = questionBank[currentStudent].terms[letterIndex];
                if (!usedTerms[term]) usedTerms[term] = [];
                usedTerms[term].push(idx + 1);
            }
        }
    });
}

function submitQuiz() {
    const hasBlankAnswers = [...document.querySelectorAll('.answer-input')].some(input => input.value.trim() === '');
    const duplicateAnswers = Object.keys(usedTerms).filter(term => usedTerms[term].length > 1);

    if (hasBlankAnswers && duplicateAnswers.length > 0) {
        if (!confirm('There are blank answers and duplicate responses.\nWould you still like to proceed?')) return;
    } else if (hasBlankAnswers) {
        if (!confirm('There are some questions left blank.\nWould you still like to proceed?')) return;
    } else if (duplicateAnswers.length > 0) {
        if (!confirm('There are duplicate responses (each word should only be used once).\n\nWould you still like to proceed?')) return;
    }

    const resultData = prepareResultData();
    displayResults(resultData, false);

    document.querySelector('.quiz-container').classList.add('hidden');
    document.querySelector('.quiz-actions').classList.add('hidden');
    document.getElementById('results-section').classList.remove('hidden');

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==================== DISPLAY RESULTS ====================
function displayResults(resultData, isUrlView = false) {
    const resultsSection = document.getElementById('results-section');
    resultsSection.innerHTML = '';

    const title = document.createElement('h2');
    title.textContent = `Results for ${resultData.student || resultData.s}`;
    resultsSection.appendChild(title);

    const dateTime = document.createElement('p');
    dateTime.textContent = `Date: ${resultData.date || resultData.d} | Time: ${resultData.time || resultData.t}`;
    resultsSection.appendChild(dateTime);

    let percentage;
    if (isUrlView && resultData.p !== undefined) {
        percentage = resultData.p;
    } else if (resultData.questionSet && resultData.answers) {
        const correctCount = resultData.answers.filter((ans, idx) => 
            ans && ans.toLowerCase() === resultData.questionSet.answers[idx].toLowerCase()
        ).length;
        percentage = Math.round(correctCount / resultData.questionSet.answers.length * 100);
    } else {
        percentage = 'N/A';
    }

    const score = document.createElement('p');
    score.textContent = `Score: ${percentage}%`;
    resultsSection.appendChild(score);

    if (!isUrlView && resultData.questionSet) {
        const table = document.createElement('table');
        table.className = 'results-table';
        table.innerHTML = `
            <tr>
                <th>#</th>
                <th>Question</th>
                <th>Your Answer</th>
                <th>Correct Answer</th>
            </tr>
            ${resultData.questionSet.questions.map((question, index) => {
                const studentAnswer = resultData.answers[index] || "";
                const correctAnswer = resultData.questionSet.answers[index];
                const isCorrect = studentAnswer.toLowerCase() === correctAnswer.toLowerCase();
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${question.Definition}</td>
                        <td class="${isCorrect ? '' : 'incorrect'}">${studentAnswer}${isCorrect ? '<span class="correct-mark">√</span>' : ''}</td>
                        <td>${correctAnswer}</td>
                    </tr>
                `;
            }).join('')}
        `;
        resultsSection.appendChild(table);
    }

    if (isUrlView) {
        const authContainer = document.createElement('div');
        authContainer.className = 'auth-container';
        authContainer.innerHTML = `<span class="auth-check">✔</span><span class="auth-text">Authentication successful</span>`;
        resultsSection.appendChild(authContainer);

        const copyScoreButton = document.createElement('button');
        copyScoreButton.className = 'copy-button';
        copyScoreButton.textContent = 'Copy Score';
        copyScoreButton.onclick = () => {
            navigator.clipboard.writeText(`${percentage}%`).then(() => {
                copyScoreButton.textContent = '√ Copied';
                setTimeout(() => copyScoreButton.textContent = 'Copy Score', 2000);
            });
        };
        resultsSection.appendChild(copyScoreButton);
    }

    if (!isUrlView) {
        const termsToReview = document.createElement('div');
        termsToReview.className = 'terms-to-review';
        
        const heading = document.createElement('h3');
        heading.textContent = (percentage === 100) ? 'Great job!' : 'Terms to Review';
        termsToReview.appendChild(heading);

        const termsList = document.createElement('div');
        termsList.style.marginTop = '12px';
        termsList.style.textAlign = 'left';
        termsList.style.lineHeight = '1.8';
        termsList.style.paddingLeft = '10px';

        resultData.termsToReview.forEach(item => {
            const termLine = document.createElement('div');
            termLine.style.marginBottom = '14px';
            termLine.innerHTML = `<strong>${item.term}:</strong> ${item.definition}`;
            termsList.appendChild(termLine);
        });

        termsToReview.appendChild(termsList);
        resultsSection.appendChild(termsToReview);

        // Share Button (JSON)
        const shareButton = document.createElement('button');
        shareButton.className = 'copy-button';
        shareButton.style.marginTop = '18px';
        shareButton.style.marginLeft = 'auto';
        shareButton.style.marginRight = 'auto';
        shareButton.style.display = 'block';
        shareButton.innerHTML = '📤 Share Results (Airdrop)';
        shareButton.onclick = () => shareResultsAsText(resultData);
        resultsSection.appendChild(shareButton);

        // QR Code (kept)
        if (resultData.questionSet && resultData.answers) {
            const correctCount = resultData.answers.filter((ans, idx) => 
                ans && ans.toLowerCase() === resultData.questionSet.answers[idx].toLowerCase()
            ).length;
            const percentageForUrl = Math.round(correctCount / resultData.questionSet.answers.length * 100);
            const simplifiedResultData = { s: resultData.student, d: resultData.date, t: resultData.time, p: percentageForUrl };
            const jsonString = JSON.stringify(simplifiedResultData);
            const base64Data = unicodeToBase64(jsonString);
            const baseUrl = window.location.origin + window.location.pathname;
            const resultUrl = `${baseUrl}?results=${encodeURIComponent(base64Data)}`;

            const qrContainer = document.createElement('div');
            qrContainer.id = 'qr-code';
            qrContainer.style.marginTop = '30px';
            qrContainer.style.width = '200px';
            qrContainer.style.height = '200px';
            qrContainer.style.marginLeft = 'auto';
            qrContainer.style.marginRight = 'auto';
            resultsSection.appendChild(qrContainer);

            if (typeof kjua !== 'undefined') {
                const qr = kjua({
                    text: resultUrl,
                    size: 200,
                    fill: '#303f6c',
                    back: '#FFFFFF',
                    quiet: 0,
                    ecLevel: 'M',
                    render: 'canvas'
                });
                qrContainer.appendChild(qr);
            }
        }
    }
}

function getHiddenKey() {
    const parts = ["B1PH", "MU51C", "_V0C4B", "2026", "X7K9"];
    let key = parts.join("_");
    key = key.split('').map((char, i) => {
        return String.fromCharCode(char.charCodeAt(0) ^ (i + 7));
    }).join('');
    
    return key;
}

const SECRET_KEY = getHiddenKey();

function encryptData(data) {
    const jsonStr = JSON.stringify(data);
    let encrypted = '';
    
    for (let i = 0; i < jsonStr.length; i++) {
        encrypted += String.fromCharCode(
            jsonStr.charCodeAt(i) ^ SECRET_KEY.charCodeAt(i % SECRET_KEY.length)
        );
    }
    
    return btoa(encrypted) + "==v2";
}

async function shareResultsAsText(resultData) {
    try {
        let percentage = resultData.percentage;
        if (typeof percentage !== 'number' && resultData.questionSet && resultData.answers) {
            const correctCount = resultData.answers.filter((ans, i) => 
                ans && ans.toLowerCase() === (resultData.questionSet.answers[i] || "").toLowerCase()
            ).length;
            percentage = Math.round(correctCount / resultData.questionSet.answers.length * 100);
        }

        const exportData = {
            student: resultData.student || resultData.s || "Unknown",
            date: resultData.date || resultData.d,
            time: resultData.time || resultData.t,
            percentage: typeof percentage === 'number' ? percentage : "N/A",
            exercise: "Vocab",                    // ← Changed here
            termsToReview: resultData.termsToReview ? 
                resultData.termsToReview.map(item => item.term) : []
        };

        const encryptedContent = encryptData(exportData);
        
        const blob = new Blob([encryptedContent], { type: 'text/plain' });
        const safeName = (exportData.student || "Student").replace(/[^a-zA-Z0-9]/g, '_');
        const fileName = `Vocab_${safeName}_${exportData.date || 'unknown'}.txt`;

        const file = new File([blob], fileName, { type: 'text/plain' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
        } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
    } catch (err) {
        console.error(err);
        alert('Failed to export results.');
    }
}

function prepareResultData() {
    const correctAnswers = questionBank[currentStudent].answers;
    const allTerms = [...correctAnswers];
    const correctTerms = answers
        .map((answer, index) => answer && answer.toLowerCase() === correctAnswers[index].toLowerCase() ? correctAnswers[index] : null)
        .filter(term => term);
    const termsToReview = allTerms.filter(term => !correctTerms.includes(term));

    return {
        student: capitalizeName(currentStudent),
        date: new Date().toISOString().split('T')[0],
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }),
        exercise: "Vocab",  
        answers: Array.from({ length: 15 }, (_, index) => answers[index] || ""),
        questionSet: questionBank[currentStudent],
        termsToReview: termsToReview.map(term => ({
            term,
            definition: vocabularyTerms.find(v => v.Term === term)?.Definition || "Definition not found"
        })).sort((a, b) => a.term.localeCompare(b.term))
    };
}
